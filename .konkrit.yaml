    value:
      id: "install-apparmor-profile-set"
      title: "Install a comprehensive AppArmor profile set (apparmor.d) to confine system services"
      category: "mac-apparmor"
      rationale: "Stock Arch ships very few profiles, so AppArmor confines almost nothing out of the box. roddhjav/apparmor.d (AUR: apparmor.d / apparmor.d-git) provides 1500+ profiles confining systemd tools, dbus, polkit, NetworkManager, bluetooth, GDM and more, moving toward the full-system confinement madaidans recommends. The AUR package installs all profiles in COMPLAIN mode by default, so it does not immediately enforce anything; enforce mode must be enabled per-profile only after reviewing aa-log/audit.log for a representative period. Marked default_enabled=false because it is third-party, in active development, and must be tuned (especially around libvirt/qemu/virtiofsd and the GPU stack) before any profile is switched to enforce."
      sources: ["secureblue.dev (full-system MAC posture)", "madaidans MAC (full system confinement)", "github.com/roddhjav/apparmor.d", "AUR apparmor.d / apparmor.d-git", "apparmor.pujol.io/install"]
      risk: "medium"
      breaks: ["makepkg refuses to run as root: the 'makepkg -D ... -si' step must be run as a non-root user with sudo rights (the -si prompts for sudo only for the pacman install). Running it as root will fail.", "Although profiles install in complain mode, switching profiles to ENFORCE (aa-enforce) can deny legitimate access for libvirtd/qemu/virtiofsd, NetworkManager/iwd, GDM or amdgpu helpers, breaking the VM, wifi or the desktop; only switch a profile to enforce after reviewing aa-log/audit.log denials for that profile.", "AUR build requires base-devel and git; review the PKGBUILD before building per Arch policy."]
      enabled: false
      apply:
