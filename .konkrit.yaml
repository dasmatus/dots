# konkrit.yaml — full hardening catalog + Alpine Flatpak VM
#
# Generated by `konkrit catalog`. Every module is cited to its source
# (PrivacyGuides, Arch Wiki Security, madaidans-insecurities, secureblue) and
# carries a `risk:` and `enabled:` flag. This ships with the MAXIMAL posture:
# aggressive items are enabled by default; ones that would break this host
# (amdgpu, suspend, wifi, or the VM) are present but `enabled: false`.
#
# ── GENTOO ADAPTATION ────────────────────────────────────────────────────────
# The upstream catalog targets Arch. This copy is adapted for the tokyonight-dots
# Gentoo host (verified against packages.gentoo.org + the GURU overlay):
#   • pacman -S …            → emerge --noreplace <cat/pkg>   (verified atoms)
#   • mkinitcpio -P / sbctl / grub-mkconfig → rebuild-uki  (rebuilds the UKI from
#       /etc/kernel/cmdline + /etc/kernel/cmdline.d/*.conf; helper from install.sh)
#   • /etc/cmdline.d/*.conf  → /etc/kernel/cmdline.d/*.conf  (systemd-boot/UKI)
#   • hardened_malloc (AUR)  → dev-libs/hardened_malloc  (GURU; builds BOTH .so
#       variants into /usr/lib64 — install.sh enables GURU) + preload paths /usr/lib64
#   • apparmor.d (AUR)       → sec-policy/apparmor-profiles
#   • install-linux-hardened-kernel → DISABLED (no clean Gentoo equivalent; the
#       installer already builds sys-kernel/vanilla-kernel with the hardened USE)
#   • sshd -t / makepkg BUILDDIR → neutralised (no-op) — Arch-only
# Prose/rationale/`sources` are left verbatim (they only document intent). `{{user}}`
# is set by the first-boot service to the freshly created homed account.
# ─────────────────────────────────────────────────────────────────────────────
#
# REVIEW before running. To skip a module, set `enabled: false`. To opt into a
# disabled one, set `enabled: true` and read its `breaks:` notes first.
#
# Apply:  konkrit konkrit.yaml   (debug builds dry-run and touch nothing;
#                                 release builds actually execute)

# konkrit catalog — generated; edit values freely (see `konkrit catalog`).
#
# CROSS-MODULE CONFLICTS the critic flagged — review these before enabling:
#  * [core-kernel-self-protection-kargs (and all boot-params/cpu-mitigations items) <-> lockdown-confidentiality]
#      All boot-param drop-ins depend on the one-time migration in core-kernel-self-protection-kargs that copies /etc/kernel/cmdline to /etc/cmdline.d/00-bas
#      -> Apply core-kernel-self-protection-kargs FIRST among boot-params (it performs the migration), then lockdown-confidentiality (removes lockdown=integrity
#  * [all boot-param / cpu-mitigation items (each calls mkinitcpio -P) <-> itself (redundant UKI rebuilds)]
#      Every cmdline.d item runs 'mkinitcpio -P' independently. Running it 6+ times is wasteful and, worse, an intermediate rebuild before the lockdown sed e
#      -> Write ALL /etc/cmdline.d/*.conf files and perform the 00-base migration + lockdown sed first, then run 'mkinitcpio -P' EXACTLY ONCE at the end of the 
#  * [host-disable-user-namespaces (HOST: unprivileged_userns_clone=0) <-> Alpine guest Flatpak/bwrap requirement]
#      The host disables unprivileged user namespaces, but the Alpine VM guest REQUIRES userns enabled for Flatpak/bwrap. Deploying the host sysctl file insi
#      -> Apply 90-hardening-userns.conf to the HOST ONLY. The guest must keep kernel.unprivileged_userns_clone=1 (or default) and user.max_user_namespaces>0. N
#  * [host-disable-user-namespaces (optional user.max_user_namespaces=0) <-> systemd service sandboxing (PrivateUsers=yes) and any future AppArmor/systemd-hardening item]
#      If the commented user.max_user_namespaces=0 is enabled, it disables ALL user namespaces including root/systemd ones, breaking PrivateUsers=yes units (
#      -> Keep user.max_user_namespaces=0 commented (as shipped). Use kernel.unprivileged_userns_clone=0 as the surgical control so systemd PrivateUsers= sandbo
#  * [net-core-tcpip-hardening (rp_filter=1 strict) <-> libvirt NAT bridge (virbr0) + suggested nftables firewall]
#      Strict rp_filter and any default-deny firewall must not drop legitimate VM<->NAT return traffic or block forwarding on virbr0. A naive firewall INPUT/
#      -> strict rp_filter is safe here (symmetric NAT return paths). For the firewall, accept established/related + loopback, do NOT flush or override libvirt'
#  * [net-arp-hardening (arp_ignore/arp_filter/drop_gratuitous_arp via *) <-> libvirt virbr0/tap interfaces]
#      Globbed conf.all/conf.* ARP hardening also hits virbr0 and tap devices and can break guest<->host/LAN ARP resolution and gratuitous-ARP failover. Mark
#      -> Keep disabled by default (ships as .disabled). If wanted, scope strictly to the physical wifi NIC (net.ipv4.conf.wlan0.*) and never use conf.all/conf.
#  * [tmp-tmpfs-nosuid-nodev-noexec (/tmp noexec) <-> var-tmp-nosuid-nodev-noexec (/var/tmp kept exec as BUILDDIR) + makepkg]
#      noexec on /tmp breaks makepkg/AUR builds; the design relies on /var/tmp staying exec to serve as BUILDDIR. install-hardened-malloc-aur builds via make
#      -> Apply /tmp noexec AND set makepkg BUILDDIR=/var/tmp in /etc/makepkg.conf BEFORE running install-hardened-malloc-aur. Keep /var/tmp exec (do not add no
#  * [global-hardened-malloc-light-preload (/etc/ld.so.preload) <-> exempt-qemu-from-hardened-malloc (empty LD_PRELOAD env)]
#      /etc/ld.so.preload is read UNCONDITIONALLY by ld.so for every dynamically linked process and is NOT controlled by the LD_PRELOAD env var, and modern l
#      -> Either rely on the LIGHT variant being safe for QEMU (accepted default) OR wrap the emulator via /etc/libvirt/qemu.conf so guest QEMU starts without t
#  * [install-hardened-malloc-aur (makepkg, refuses root) <-> orchestrator running as root]
#      makepkg refuses to run as root; if the apply pipeline executes as root the build fails. Also git base-devel must be present first.
#      -> Run the AUR build as a non-root build user (or via paru/yay as that user). Ensure base-devel+git installed first, and makepkg BUILDDIR points at an ex
#  * [global-hardened-malloc-light-preload <-> hardened-malloc-full-variant-optional & install-hardened-malloc-aur]
#      Both preload items write the SAME file /etc/ld.so.preload (mutually exclusive variants), and the preload is meaningless/will crash the linker if it po
#      -> Order: raise-vm-max-map-count -> install-hardened-malloc-aur (creates the .so) -> write ld.so.preload (light). Pick exactly ONE variant; full overwrit
#
variables:
  user: "matus"
  vmname: "konkrit-flatpak"
  vm_disk: "/var/lib/libvirt/images/konkrit-flatpak.qcow2"
  vm_xml: "/etc/konkrit/konkrit-flatpak.xml"
  vmshare_host: "/srv/vm-share"
  rendernode: "/dev/dri/renderD128"
  alpine_iso: "/var/lib/libvirt/images/alpine-virt.iso"
  alpine_iso_url: "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-virt-3.21.0-x86_64.iso"
modules:
  - !NoCon
    value:
      id: "install-amd-ucode"
      title: "Install amd-ucode for AMD CPU microcode updates"
      category: "cpu-mitigations"
      rationale: "Microcode updates are essential to fix critical CPU vulnerabilities (Meltdown/Spectre/SSB/SRSO/etc.); Arch Wiki (Microcode) instructs AMD users to install the amd-ucode package so the kernel can apply vendor microcode patches at early boot. This AMD Barcelo (Ryzen 7 5825U, Zen3) host must have it installed for the mkinitcpio 'microcode' hook to have firmware to embed. (Already installed on this host: amd-ucode 20260622-1, microcode revision 0x0a500014 loaded.)"
      sources: ["Arch Wiki Microcode (wiki.archlinux.org/title/Microcode)", "madaidans-insecurities.github.io/guides/linux-hardening.html"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Command
          command: "emerge --noreplace --quiet sys-firmware/amd-ucode"
          parallel: false
      verify: "pacman -Q amd-ucode"
      revert: "pacman -R amd-ucode (NOT recommended: removes microcode firmware; only do this if you understand the security loss)"
  - !NoCon
    value:
      id: "mkinitcpio-microcode-hook"
      title: "Embed microcode early via the mkinitcpio 'microcode' hook (after autodetect) and rebuild+re-sign the UKI"
      category: "cpu-mitigations"
      rationale: "Arch's mkinitcpio (v37+) provides a 'microcode' hook that bundles amd-ucode into the generated image so it is applied during early boot; it must appear AFTER 'autodetect'. On this host the boot artifact is a Unified Kernel Image (UKI) at /boot/EFI/Linux/arch-linux.efi (systemd-stub, Secure Boot via sbctl), so the microcode hook is the correct bootloader-agnostic way to guarantee early microcode -- it embeds amd-ucode directly into the signed UKI, with no separate initrd line needed. This host already has the hook correctly placed: HOOKS=(base udev autodetect microcode ...). This item ensures it stays present and that the UKI is rebuilt and re-signed after any change."
      sources: ["Arch Wiki Microcode (wiki.archlinux.org/title/Microcode)", "Arch Wiki Unified kernel image (wiki.archlinux.org/title/Unified_kernel_image)", "Linux Kernel docs: The Linux Microcode Loader (docs.kernel.org/arch/x86/microcode.html)"]
      risk: "low"
      breaks: ["This host uses a UKI (not systemd-boot loader entries and not a standalone /boot/initramfs-linux.img). The microcode hook embeds amd-ucode into the UKI automatically; no separate 'initrd /amd-ucode.img' line applies. Because Secure Boot is enabled with sbctl, any manual `mkinitcpio -P` MUST be followed by `sbctl sign-all` (or sbctl sign of the UKI) or the machine will fail Secure Boot verification on next reboot."]
      enabled: true
      apply:
        - !Command
          command: "rebuild-uki"
          parallel: false
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "lsinitcpio --early /boot/EFI/Linux/arch-linux.efi"
      revert: "Not destructive: the microcode hook is standard and recommended. If you must remove it, delete 'microcode' from the HOOKS=() array in /etc/mkinitcpio.conf (currently it is correctly after 'autodetect'), then run mkinitcpio -P and sbctl sign-all."
  - !NoCon
    value:
      id: "systemd-boot-microcode-initrd"
      title: "Add microcode initrd line to systemd-boot loader entry (early load via bootloader) -- NOT APPLICABLE to this UKI host"
      category: "cpu-mitigations"
      rationale: "This is the classic systemd-boot loader-entry mechanism for early microcode (separate 'initrd /amd-ucode.img' line before the main initramfs). It does NOT apply to this host: there are no systemd-boot loader entries -- the machine boots a Unified Kernel Image (/boot/EFI/Linux/arch-linux.efi) via systemd-stub with Secure Boot. Early microcode is instead provided by the mkinitcpio 'microcode' hook embedded in the UKI (see item mkinitcpio-microcode-hook), which is already in place."
      sources: ["Arch Wiki Microcode (wiki.archlinux.org/title/Microcode)", "Arch Wiki systemd-boot (wiki.archlinux.org/title/Systemd-boot)", "Arch Wiki Unified kernel image (wiki.archlinux.org/title/Unified_kernel_image)"]
      risk: "low"
      breaks: ["REJECTED for this host: /boot/loader/entries/ does not exist (confirmed). The system uses a Unified Kernel Image + systemd-stub + Secure Boot (sbctl), not systemd-boot loader entries. Writing 'initrd /amd-ucode.img' into /boot/loader/entries/arch.conf would create a file the bootloader never reads -- it would NOT load microcode and could mislead future maintenance. Microcode is already early-loaded via the mkinitcpio 'microcode' hook embedded in the UKI; this item is redundant. Do not enable."]
      enabled: false
      apply: []
      verify: "test ! -d /boot/loader/entries; echo 'No loader entries: host uses UKI; microcode is embedded via the mkinitcpio microcode hook'"
      revert: "Not applicable (no change is made)."
  - !NoCon
    value:
      id: "do-not-disable-mitigations"
      title: "Ensure CPU mitigations are NOT disabled (no mitigations=off / nopti / nospectre)"
      category: "cpu-mitigations"
      rationale: "madaidans explicitly advises against mitigations=off and recommends enabling all CPU mitigations applicable to the CPU. This guard verifies the running kernel cmdline (and the UKI cmdline source /etc/kernel/cmdline) does not contain a mitigation-disabling flag that would silently undo this topic. Confirmed clean on this host: /proc/cmdline has no such flag."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html", "Arch Wiki Security (wiki.archlinux.org/title/Security)"]
      risk: "low"
      breaks: ["Verification guard only. grep -L prints /proc/cmdline (exit 0) ONLY when none of the mitigation-disabling tokens are present = PASS. If grep instead matches a disabling token, remove that token from /etc/kernel/cmdline, run mkinitcpio -P and sbctl sign-all, then reboot (this host's cmdline lives in the signed UKI, not in a bootloader entry)."]
      enabled: true
      apply:
        - !Command
          command: "grep -EL (mitigations=off|nopti|nospectre_v2|nospec_store_bypass_disable|tsx=on|kpti=off) /proc/cmdline"
          parallel: false
      verify: "grep -EL (mitigations=off|nopti|nospectre_v2|nospec_store_bypass_disable|tsx=on|kpti=off) /proc/cmdline"
      revert: "Not applicable (non-destructive guard check)."
  - !NoCon
    value:
      id: "mitigations-auto-nosmt"
      title: "Set kernel cmdline mitigations=auto,nosmt + ssbd=force-on (+ spec_store_bypass_disable=on) via the UKI cmdline"
      category: "cpu-mitigations"
      rationale: "secureblue ships mitigations=auto,nosmt (apply all known CPU vulnerability mitigations, disabling SMT only when the CPU is actually affected) plus ssbd=force-on and spec_store_bypass_disable=on (force Speculative Store Bypass mitigation for kernel and userspace). This is the maximal posture without unconditionally halving cores. On this Zen3 (Ryzen 7 5825U) all cross-thread vulns report 'Not affected', so SMT remains enabled (16 threads preserved for the KVM VM). On this host the cmdline is embedded in the signed UKI via /etc/kernel/cmdline, NOT a systemd-boot loader entry."
      sources: ["secureblue.dev/articles/kargs", "madaidans-insecurities.github.io/guides/linux-hardening.html", "Arch Wiki Unified kernel image (wiki.archlinux.org/title/Unified_kernel_image)"]
      risk: "medium"
      breaks: ["CMDLINE LIVES IN THE UKI, NOT A LOADER ENTRY. /etc/kernel/cmdline is a single space-separated line; ensure the appended tokens end up on that kernel command line (verify by reading the UKI or /proc/cmdline after reboot). After editing you MUST run mkinitcpio -P then sbctl sign-all (Secure Boot is enabled) or the next boot fails verification. ssbd=force-on / spec_store_bypass_disable=on add a small throughput cost to the KVM/virtio VM but do not break it. mitigations=auto,nosmt disables SMT only if the CPU is vulnerable; this Zen3 is not, so SMT stays on and the VM keeps full vCPUs."]
      enabled: true
      apply:
        - !Append
          path: "/etc/kernel/cmdline"
          content: "mitigations=auto,nosmt ssbd=force-on spec_store_bypass_disable=on"
        - !Command
          command: "rebuild-uki"
          parallel: false
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "lsinitcpio --early /boot/EFI/Linux/arch-linux.efi; grep -E (mitigations=auto,nosmt) /etc/kernel/cmdline"
      revert: "Remove 'mitigations=auto,nosmt ssbd=force-on spec_store_bypass_disable=on' from /etc/kernel/cmdline, run mkinitcpio -P, run sbctl sign-all, then reboot."
  - !NoCon
    value:
      id: "force-disable-smt"
      title: "Unconditionally disable SMT with nosmt=force (optional; OFF by default on this VM host)"
      category: "cpu-mitigations"
      rationale: "nosmt=force disables SMT/hyperthreading regardless of whether the CPU is currently known-vulnerable, closing the entire class of cross-thread side-channel leakage (MDS/L1TF/TAA siblings). It is the strongest SMT stance (secureblue offers it as an optional, non-default karg). On this host the cmdline is set in the UKI via /etc/kernel/cmdline."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html", "secureblue.dev/articles/kargs", "Arch Wiki Unified kernel image (wiki.archlinux.org/title/Unified_kernel_image)"]
      risk: "high"
      breaks: ["OFF BY DEFAULT on this host because it runs the KVM/QEMU Alpine VM. nosmt=force halves logical CPUs (16->8 here), up to ~40% throughput loss on parallel workloads (secureblue), directly degrading virtio-gpu venus+virgl and virtiofs VM performance without breaking functionality. This Zen3 (5825U) reports all cross-thread vulns 'Not affected', so unconditional SMT-off buys little. Cmdline lives in the signed UKI: editing /etc/kernel/cmdline requires mkinitcpio -P then sbctl sign-all or the next boot fails Secure Boot. mitigations=auto,nosmt already disables SMT if the CPU ever becomes vulnerable. Enable only if you accept the VM performance hit."]
      enabled: false
      apply:
        - !Append
          path: "/etc/kernel/cmdline"
          content: "nosmt=force"
        - !Command
          command: "rebuild-uki"
          parallel: false
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "grep -E (nosmt=force) /etc/kernel/cmdline; cat /sys/devices/system/cpu/smt/active"
      revert: "Remove 'nosmt=force' from /etc/kernel/cmdline, run mkinitcpio -P, run sbctl sign-all, then reboot."
  - !NoCon
    value:
      id: "verify-microcode-loaded"
      title: "Verify AMD microcode was actually updated at boot"
      category: "cpu-mitigations"
      rationale: "Arch Wiki (Microcode) and the kernel microcode loader docs recommend confirming the update actually applied; the kernel logs a 'microcode: Current revision' line and AMD microcode is loaded from the early cpio path kernel/x86/microcode/AuthenticAMD.bin embedded in the UKI. This catches a silently-missing early load. Confirmed on this host: journalctl reports 'microcode: Current revision: 0x0a500014' and /proc/cpuinfo shows microcode 0xa500014."
      sources: ["Arch Wiki Microcode (wiki.archlinux.org/title/Microcode)", "Linux Kernel docs: The Linux Microcode Loader (docs.kernel.org/arch/x86/microcode.html)"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Command
          command: "journalctl -k --grep microcode --no-pager"
          parallel: false
      verify: "journalctl -k --grep microcode --no-pager"
      revert: "Not applicable (read-only verification)."
  - !NoCon
    value:
      id: "install-linux-hardened-kernel"
      title: "Install the linux-hardened kernel from the official extra repo (alongside linux as fallback)"
      category: "memory-allocator"
      rationale: "linux-hardened (maintained by Levente Polyak/anthraxx, in Arch's extra repo; verified at 7.0.12.hardened1-2 on 2026-06-28) ships Brad Spengler/PaX-derived patches plus a security-conscious config: hardened usercopy, stricter heap/slab hardening, structure layout randomization, and tighter defaults. Arch Wiki Security and madaidans recommend a distro hardened kernel as the primary kernel-level memory-corruption hardening. It is a first-class repo package so it tracks the rolling release and keeps in-tree amdgpu/KVM (kvm_amd) modules, so KMS and the libvirt VM keep working. Installing the package fires the mkinitcpio pacman hook automatically; an explicit regen is included for clarity. Keep stock linux installed as a fallback boot entry. NOTE: linux-hardened does NOT itself disable unprivileged user namespaces, so it neither blocks the host userns-lockdown goal nor interferes with the Alpine VM's bwrap/Flatpak needs."
      sources: ["Arch Wiki Security#Kernel_hardening (wiki.archlinux.org/title/Security)", "madaidans-insecurities.github.io/guides/linux-hardening.html (kernel)", "archlinux.org/packages/extra/x86_64/linux-hardened (verified 7.0.12.hardened1-2, extra repo)", "secureblue.dev"]
      risk: "medium"
      breaks: ["Bootloader entry must be regenerated/added for vmlinuz-linux-hardened (run grub-mkconfig -o /boot/grub/grub.cfg, or add a systemd-boot/UKI entry), otherwise the new kernel will not be bootable.", "Out-of-tree DKMS modules must be rebuilt against linux-hardened-headers.", "Slightly stricter ptrace/usercopy defaults; KEEP stock linux installed as a fallback boot entry in case amdgpu/suspend regress on a given hardened release. Validate amdgpu KMS, suspend/resume, wifi, and the KVM VM after first boot into linux-hardened."]
      enabled: false
      apply:
        - !Command
          command: "true"
          parallel: false
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "pacman -Q linux-hardened"
      revert: "pacman -R linux-hardened linux-hardened-headers"
  - !NoCon
    value:
      id: "raise-vm-max-map-count-for-hardened-malloc"
      title: "Pin vm.max_map_count to 1048576 (prerequisite for hardened_malloc guard pages; already the Arch default)"
      category: "memory-allocator"
      rationale: "hardened_malloc creates many guard pages; GrapheneOS README and madaidans state vm.max_map_count must be raised substantially or allocation-heavy processes fail with ENOMEM/map failures. 1048576 is the upstream-recommended value. NOTE FOR ARCH: this is ALREADY the distro default since 2024-04-07 (raised from 65530 via the filesystem package, per archlinux.org news), so this file is usually redundant on a current host. It is kept as an explicit pin to (a) document the hard dependency of the preload items, and (b) survive any future default change. Safe, reversible, and benefits mmap-heavy apps generally. Does not affect amdgpu/KVM/virtiofs (it only raises a permissive limit)."
      sources: ["GrapheneOS/hardened_malloc README", "madaidans-insecurities.github.io/guides/linux-hardening.html (memory allocator)", "Arch Wiki Security#Memory_allocator", "archlinux.org/news/increasing-the-default-vmmax_map_count-value (default raised to 1048576, 2024-04-07)"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/30-hardened-malloc.conf"
          content: "# Pin vm.max_map_count for GrapheneOS hardened_malloc guard pages.\n# NOTE: This is already the Arch default (raised from 65530 to 1048576 via the\n# filesystem package on 2024-04-07). Kept as an explicit dependency pin.\n# Refs: GrapheneOS/hardened_malloc README; madaidans linux-hardening; archlinux.org news.\nvm.max_map_count = 1048576\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl -n vm.max_map_count"
      revert: "rm /etc/sysctl.d/30-hardened-malloc.conf"
  - !NoCon
    value:
      id: "install-hardened-malloc-aur"
      title: "Build/install hardened_malloc (AUR) providing the default and light .so libraries in /usr/lib"
      category: "memory-allocator"
      rationale: "The AUR package 'hardened_malloc' builds both variants and installs /usr/lib64/libhardened_malloc.so (full) and /usr/lib64/libhardened_malloc-light.so (light). The GrapheneOS README explicitly recommends /usr/lib (not /usr/local/lib) so the library is reachable from AppArmor/systemd-confined units \u2014 verified. Installation alone does NOT change runtime behavior; it only makes the libraries available for selective preload. madaidans and Arch Wiki Security recommend hardened_malloc as the strongest userspace heap hardening. IMPORTANT: makepkg cannot run as root; build as a regular user or via an AUR helper."
      sources: ["AUR: hardened_malloc (aur.archlinux.org/packages/hardened_malloc \u2014 provides libhardened_malloc.so + libhardened_malloc-light.so in /usr/lib)", "GrapheneOS/hardened_malloc README (recommends /usr/lib)", "madaidans-insecurities.github.io/guides/linux-hardening.html", "Arch Wiki Security#Memory_allocator"]
      risk: "low"
      breaks: ["makepkg REFUSES to run as root (base-devel/makepkg drops root). The 'makepkg -siD ...' step MUST be executed as a non-root build user, or replaced with an AUR helper invocation (paru -S hardened_malloc / yay -S hardened_malloc) run as that user. As written from a root context it will fail \u2014 substitute your build user.", "-siD passes the build directory and installs with pacman (-i) and syncs deps (-s); requires a recent toolchain (glibc/GCC), satisfied on Arch rolling.", "If /tmp/hardened_malloc already exists the git clone fails; remove it first on re-run."]
      enabled: true
      apply:
        - !Command
          command: "emerge --noreplace --quiet dev-libs/hardened_malloc"
          parallel: false
      verify: "test -f /usr/lib64/libhardened_malloc-light.so"
      revert: "emerge --deselect dev-libs/hardened_malloc"
  - !NoCon
    value:
      id: "global-hardened-malloc-light-preload"
      title: "Enable hardened_malloc (light variant) system-wide via /etc/ld.so.preload"
      category: "memory-allocator"
      rationale: "Per Arch Wiki Security#Memory_allocator and madaidans, global enablement via /etc/ld.so.preload is the recommended and only robust way to harden the heap, since LD_PRELOAD does not apply to AT_SECURE/setuid binaries. On a desktop the LIGHT variant is recommended (Kicksecure/Whonix, Alpine wiki): it keeps zero-on-free and slab canaries but drops the costly features that most often break GUI processes (quarantines, write-after-free checks, slot randomization; guard-slab interval raised 1->8) \u2014 verified against the GrapheneOS README. For THIS host, untrusted browsers/Steam-like apps live in the Alpine VM, so the host preload only touches the compositor, NetworkManager/iwd, and system daemons, which tolerate light well. The full variant is intentionally NOT used here because it can break Xorg and is heavier on a host that must also run QEMU. ORDERING: apply this only AFTER install-hardened-malloc-aur (the .so must exist) and AFTER exempt-qemu-from-hardened-malloc (so the VM does not inherit the allocator)."
      sources: ["Arch Wiki Security#Memory_allocator", "madaidans-insecurities.github.io/guides/linux-hardening.html", "Kicksecure/Whonix Hardened_Malloc wiki", "Alpine Linux Hardened_malloc wiki", "GrapheneOS/hardened_malloc README (light variant feature list)", "secureblue.dev"]
      risk: "high"
      breaks: ["HIGHEST-RISK single change: /etc/ld.so.preload injects into EVERY dynamically-linked process, including the Wayland/Xorg compositor and display manager. A bad interaction can leave the graphical session unable to start (potential black screen at boot). Have a recovery plan ready: boot to a TTY (or add init=/bin/sh / use a live USB) and delete the plain-text file /etc/ld.so.preload.", "QEMU/libvirt MUST be exempted first (see exempt-qemu-from-hardened-malloc) so virtio-gpu (venus/virgl) and virtiofs memory behaviour is unchanged; otherwise the VM inherits the allocator and may suffer added memory pressure/instability.", "After enabling, TEST: amdgpu/KMS login, suspend/resume, wifi (NetworkManager/iwd), and that the libvirt VM still launches with KVM+virtio-gpu+virtiofs. Remove the line if the graphical session fails.", "Statically linked binaries and Go programs (own allocator) are unaffected \u2014 expected, not a failure.", "The .so must already exist (install-hardened-malloc-aur). If /usr/lib64/libhardened_malloc-light.so is missing, ld.so will warn but continue (the file is ignored), so a missing lib is non-fatal but leaves the host unhardened."]
      enabled: true
      apply:
        - !Write
          path: "/etc/ld.so.preload"
          content: "/usr/lib64/libhardened_malloc-light.so\n"
      verify: "grep -q libhardened_malloc-light /etc/ld.so.preload"
      revert: "rm /etc/ld.so.preload"
  - !NoCon
    value:
      id: "exempt-qemu-from-hardened-malloc"
      title: "Exempt QEMU/libvirt from inherited hardened_malloc preload (protect the KVM/virtio-gpu/virtiofs VM)"
      category: "memory-allocator"
      rationale: "The host's libvirt/QEMU VM (KVM + virtio-gpu venus/virgl + virtiofs) is the core workload and is sensitive to allocator changes: hardened_malloc's guard pages and quarantines add overhead and can perturb large-RAM/hugepage and virtiofs mappings. systemd drop-ins that empty LD_PRELOAD for the qemu/libvirt units keep those services from propagating any LD_PRELOAD env to QEMU. Verified that modern Arch libvirt is modular (virtqemud.service is the QEMU driver); monolithic setups use libvirtd.service \u2014 shipping both drop-ins is correct, and a drop-in for an absent unit is ignored. CAVEAT: /etc/ld.so.preload is honored by the dynamic loader for ALL binaries irrespective of a unit's Environment=, so this drop-in clears the LD_PRELOAD environment variable but does not by itself override a global ld.so.preload entry. Combine with the light variant (which is QEMU-safe in practice) for the design goal: aggressive host hardening that must not break the VM."
      sources: ["GrapheneOS/hardened_malloc README (per-app exclusion guidance)", "Kicksecure ld-system-preload-disable pattern", "Arch Wiki Security#Memory_allocator", "systemd.exec(5) Environment= / drop-in semantics"]
      risk: "low"
      breaks: ["NUANCE: /etc/ld.so.preload is loader-global; Environment=LD_PRELOAD= clears the LD_PRELOAD environment variable for these units but does NOT remove a global ld.so.preload entry. The light variant is QEMU-safe in practice, so this is sufficient for this host; if the full variant ever caused VM instability, the robust exemption would be to launch QEMU in a namespace/wrapper without /etc/ld.so.preload.", "If you launch QEMU directly (not through libvirt) these drop-ins do not apply; wrap such launches with 'env -u LD_PRELOAD' or a namespace without the preload.", "Verify after applying: 'systemctl show -p Environment virtqemud.service' should show LD_PRELOAD empty, and the VM must still start with KVM+virtio-gpu+virtiofs."]
      enabled: true
      apply:
        - !Write
          path: "/etc/systemd/system/libvirtd.service.d/no-hardened-malloc.conf"
          content: "# Clear any inherited LD_PRELOAD so QEMU/libvirt run on the stock glibc allocator,\n# avoiding perturbation of KVM hugepages, virtio-gpu (venus/virgl), and virtiofs mappings.\n[Service]\nEnvironment=LD_PRELOAD=\n"
        - !Write
          path: "/etc/systemd/system/virtqemud.service.d/no-hardened-malloc.conf"
          content: "# Modular libvirt QEMU driver (current Arch default): same allocator exemption as libvirtd.\n[Service]\nEnvironment=LD_PRELOAD=\n"
        - !Command
          command: "systemctl daemon-reload"
          parallel: false
      verify: "systemctl show -p Environment virtqemud.service"
      revert: "rm /etc/systemd/system/libvirtd.service.d/no-hardened-malloc.conf /etc/systemd/system/virtqemud.service.d/no-hardened-malloc.conf"
  - !NoCon
    value:
      id: "glibc-malloc-tunables-hardening"
      title: "Set glibc malloc hardening tunables (glibc.malloc.check + perturb) as a complement/alternative to hardened_malloc"
      category: "memory-allocator"
      rationale: "Where hardened_malloc is too aggressive (or for processes exempted from it), glibc's own GLIBC_TUNABLES add cheap defense-in-depth. glibc.malloc.check=3 (verified valid range 0..3; 3 = fully enabled) aborts on detected heap corruption (double-free, malloc-metadata overflow); glibc.malloc.perturb fills freed/allocated memory (85=0x55 is a valid byte) to surface use-after-free and uninitialized-use bugs. These are the modern (glibc >= 2.34) replacements for MALLOC_CHECK_/MALLOC_PERTURB_; glibc.malloc.check is is_secure=true so it is auto-disabled for SUID/SGID (AT_SECURE) binaries unless /etc/suid-debug exists, limiting risk. Set via /etc/environment so it applies to PAM user sessions but NOT to early-boot systemd system services (so it does not reach QEMU/libvirt). Kept OFF by default: it turns previously-tolerated buggy apps into aborts and adds per-allocation cost."
      sources: ["GNU C Library manual: Memory Allocation Tunables (glibc.malloc.check range 0..3, is_secure; glibc.malloc.perturb)", "Arch Wiki Security#Memory_allocator", "madaidans-insecurities.github.io/guides/linux-hardening.html"]
      risk: "medium"
      breaks: ["malloc.check=3 makes processes ABORT on detected heap corruption instead of limping on \u2014 a buggy (but previously 'working') app may now crash; intended fail-closed behavior but can surprise on a daily-driver desktop.", "perturb adds a small per-allocation cost and can expose latent bugs in apps that read uninitialized memory.", "/etc/environment is read by PAM logins, NOT by early-boot systemd system services, so coverage is user-session scoped (acceptable; do NOT put this in a global systemd manager.conf/DefaultEnvironment or it would also hit QEMU/libvirt).", "/etc/environment is a simple KEY=VALUE file (no shell 'export', no expansion); the single self-contained line above is the correct form."]
      enabled: false
      apply:
        - !Append
          path: "/etc/environment"
          content: "GLIBC_TUNABLES=glibc.malloc.check=3:glibc.malloc.perturb=85\n"
      verify: "grep -q GLIBC_TUNABLES /etc/environment"
      revert: "Remove the GLIBC_TUNABLES line from /etc/environment"
  - !NoCon
    value:
      id: "kernel-info-leak-restrictions"
      title: "Restrict kernel info leaks: kptr_restrict, dmesg_restrict, printk"
      category: "sysctl-kernel"
      rationale: "kptr_restrict=2 hides kernel pointers (e.g. in /proc/kallsyms) from all userspace including CAP_SYSLOG holders, defeating a common KASLR-defeat / exploit-targeting primitive. dmesg_restrict=1 keeps the kernel ring buffer (which leaks pointers and addresses) root-only, and printk=3 3 3 3 quiets console leaks. Per madaidans (sysctl section) and KSPP these mitigate kernel pointer leaks that exploits rely on. No impact on amdgpu/suspend/wifi/KVM. Verified live: keys valid on stock Arch kernel 7.x."
      sources: ["madaidans:sysctl", "kspp:Recommended_Settings", "Arch Wiki Security#Sysctl"]
      risk: "low"
      breaks: ["dmesg as a normal user stops working (must use sudo dmesg).", "Some perf/observability tooling that reads /proc/kallsyms pointers will see zeros."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/90-hardening-kernel-leaks.conf"
          content: "# Kernel information-leak hardening (madaidans / KSPP)\nkernel.kptr_restrict = 2\nkernel.dmesg_restrict = 1\nkernel.printk = 3 3 3 3\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl kernel.kptr_restrict"
      revert: "rm /etc/sysctl.d/90-hardening-kernel-leaks.conf"
