  - !NoCon
    value:
      id: "disable-core-dumps"
      title: "Disable core dumps (core_pattern + suid_dumpable)"
      category: "sysctl-kernel"
      rationale: "Core dumps can contain passwords, keys, and other secrets from process memory. core_pattern=|/bin/false discards them by piping to a no-op, and suid_dumpable=0 ensures setuid/privileged processes never dump even via other paths. Per madaidans this both prevents secret leakage and removes a userland-fault attack surface. No effect on amdgpu/suspend/wifi/KVM. On Arch this drop-in (in /etc/sysctl.d, ordered 90-) correctly overrides systemd's /usr/lib/sysctl.d/50-coredump.conf which otherwise routes dumps to systemd-coredump."
      sources: ["madaidans:sysctl", "secureblue"]
      risk: "low"
      breaks: ["No core dumps for crash debugging (coredumpctl will have nothing). The systemd-coredump core_pattern from /usr/lib/sysctl.d/50-coredump.conf is overridden by this file.", "Crash-reporting tools (abrt, apport-style) stop collecting dumps.", "For belt-and-suspenders disabling you may additionally mask systemd-coredump.socket and set a hard core ulimit, but that is a separate non-sysctl item."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/90-hardening-coredump.conf"
          content: "# Disable core dumps to avoid leaking secrets (madaidans).\n# Overrides Arch/systemd /usr/lib/sysctl.d/50-coredump.conf (lexical: /etc + 90 wins).\nkernel.core_pattern = |/bin/false\nfs.suid_dumpable = 0\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl kernel.core_pattern"
      revert: "rm /etc/sysctl.d/90-hardening-coredump.conf"
  - !NoCon
    value:
      id: "host-disable-user-namespaces"
      title: "Disable unprivileged user namespaces on the HOST"
      category: "sysctl-kernel"
      rationale: "Unprivileged user namespaces are a major LPE attack surface (they expose otherwise root-only kernel code to unprivileged callers). On THIS host all untrusted GUI/Flatpak/bwrap workloads run inside the Alpine KVM guest, so the host needs no unprivileged userns and can disable them. CORRECTION vs the original proposal: the stock Arch 'linux' kernel (verified 7.x on this host) DOES ship kernel.unprivileged_userns_clone in /proc/sys/kernel \u2014 it is NOT Debian-only and does NOT error here, so it is the primary, surgical control (blocks only UNPRIVILEGED userns, leaving systemd/root namespaces working). user.max_user_namespaces=0 is the harsher all-namespaces switch and is offered only as an optional maximal hardening, because it also kills privileged/systemd userns and breaks host service sandboxing (PrivateUsers=yes). Per madaidans ('unprivileged_userns_clone=0 (or user.max_user_namespaces=0)') and secureblue. CRITICAL: apply only to the host -- the Alpine guest must keep userns enabled for Flatpak/bwrap."
      sources: ["madaidans:sysctl", "secureblue", "kspp:Recommended_Settings"]
      risk: "high"
      breaks: ["Anything on the HOST that needs UNPRIVILEGED user namespaces breaks: rootless Podman/Docker, host-side Flatpak/bwrap/Steam sandbox, Chromium/Firefox sandbox, AppImages using userns. Acceptable here because such apps run in the Alpine VM, NOT on the host.", "If user.max_user_namespaces=0 is uncommented it additionally breaks systemd service sandboxing using PrivateUsers=yes (upower, uuidd, etc.) with a 'No space left on device' namespacing error \u2014 that is why it is left commented by default; unprivileged_userns_clone=0 alone does NOT have this problem.", "Does NOT affect system-mode libvirt/QEMU/KVM, virtio-gpu, or virtiofs -- those do not rely on host unprivileged userns. (Rootless/session-mode libvirt WOULD need it, but this host uses system-mode.)", "This file is for the HOST ONLY. Do NOT deploy it inside the Alpine guest, which needs userns for Flatpak/bwrap."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/90-hardening-userns.conf"
          content: "# HOST ONLY: untrusted apps run in the Alpine VM, so the host needs no UNPRIVILEGED userns.\n# Primary control (exists on stock Arch 'linux' kernel 7.x -- verified present, does NOT error):\n# blocks only unprivileged userns creation, leaving root/systemd PrivateUsers= namespaces working.\nkernel.unprivileged_userns_clone = 0\n# OPTIONAL maximal hardening (secureblue-style). WARNING: this disables ALL user namespaces\n# including root/systemd ones, which BREAKS systemd service sandboxing that uses PrivateUsers=yes\n# (e.g. upower, uuidd) with 'Failed to set up user namespacing: No space left on device'.\n# Leave commented unless you accept losing host systemd userns sandboxing:\n#user.max_user_namespaces = 0\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl kernel.unprivileged_userns_clone"
      revert: "rm /etc/sysctl.d/90-hardening-userns.conf (then sysctl --system; setting unprivileged_userns_clone back to 1 also works live)"
  - !NoCon
    value:
      id: "net-core-tcpip-hardening"
      title: "Core network sysctl hardening (anti-spoof, no redirects, no source-route, SYN cookies, rfc1337, martian logging)"
      category: "sysctl-net"
      rationale: "Bundles the universally-safe TCP/IP hardening keys recommended by all three primary sources: strict reverse-path filtering (rp_filter=1) for IP-spoof/source validation (Arch systemd default is the looser rp_filter=2 in /usr/lib/sysctl.d/50-default.conf, so this is the real hardening delta), disabling ICMP redirect accept/send (MITM/route-injection), disabling source routing (MITM), SYN-cookie SYN-flood defense, RFC1337 TIME-WAIT assassination defense, broadcast-echo (Smurf) and bogus-ICMP-error suppression, and logging martian packets. These do not depend on RA/DHCP and are safe on a single-NIC laptop with a libvirt NAT bridge (outbound VM/NAT return paths are symmetric, so strict rp_filter does not drop legitimate VM traffic). secureblue ships nearly identical values in /usr/lib/sysctl.d/55-hardening.conf; Arch Wiki Sysctl documents each; madaidans recommends the same set."
      sources: ["secureblue (files/system/usr/lib/sysctl.d/55-hardening.conf)", "Arch Wiki Security / Sysctl#TCP/IP stack hardening", "madaidans:linux-hardening#sysctl"]
      risk: "low"
      breaks: ["log_martians can flood the kernel log/journal on noisy networks (Arch Wiki notes it is best for testing); informational only, no functional breakage", "strict rp_filter=1 only affects asymmetric/multipath routing and inbound port-forwarding INTO a libvirt guest; this outbound-only single-wifi + libvirt-NAT host has symmetric return paths, so legitimate VM traffic is not dropped"]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/90-network-hardening.conf"
          content: "# Network hardening (sysctl-net) - safe core set\n# Sources: secureblue 55-hardening.conf, Arch Wiki Sysctl#TCP/IP stack hardening, madaidans linux-hardening\n\n# SYN flood protection\nnet.ipv4.tcp_syncookies = 1\n\n# TCP TIME-WAIT assassination hazard protection (RFC1337)\nnet.ipv4.tcp_rfc1337 = 1\n\n# Reverse path filtering = strict mode (anti IP-spoof / source validation)\n# Overrides systemd default of 2 (loose) from /usr/lib/sysctl.d/50-default.conf\nnet.ipv4.conf.all.rp_filter = 1\nnet.ipv4.conf.default.rp_filter = 1\n\n# Do not accept or send ICMP redirects (anti MITM / route injection)\nnet.ipv4.conf.all.accept_redirects = 0\nnet.ipv4.conf.default.accept_redirects = 0\nnet.ipv4.conf.all.secure_redirects = 0\nnet.ipv4.conf.default.secure_redirects = 0\nnet.ipv4.conf.all.send_redirects = 0\nnet.ipv4.conf.default.send_redirects = 0\nnet.ipv6.conf.all.accept_redirects = 0\nnet.ipv6.conf.default.accept_redirects = 0\n\n# Do not accept source-routed packets (anti MITM)\nnet.ipv4.conf.all.accept_source_route = 0\nnet.ipv4.conf.default.accept_source_route = 0\nnet.ipv6.conf.all.accept_source_route = 0\nnet.ipv6.conf.default.accept_source_route = 0\n\n# Ignore broadcast ICMP echo (Smurf) and bogus ICMP error responses\nnet.ipv4.icmp_echo_ignore_broadcasts = 1\nnet.ipv4.icmp_ignore_bogus_error_responses = 1\n\n# Log martian (spoofed/source-routed/redirect) packets\nnet.ipv4.conf.all.log_martians = 1\nnet.ipv4.conf.default.log_martians = 1\n"
      verify: "sysctl net.ipv4.conf.all.rp_filter net.ipv4.tcp_syncookies net.ipv4.conf.all.accept_redirects net.ipv4.tcp_rfc1337"
      revert: "rm /etc/sysctl.d/90-network-hardening.conf"
  - !NoCon
    value:
      id: "net-ipv6-disable-ra"
      title: "Disable IPv6 Router Advertisement / autoconfig acceptance (accept_ra=0, router_solicitations=0)"
      category: "sysctl-net"
      rationale: "madaidans and secureblue recommend not accepting IPv6 RAs because malicious/rogue RAs enable MITM and rogue-default-gateway attacks. However on THIS host the only uplink is wifi managed by NetworkManager/iwd; setting kernel accept_ra=0 disables SLAAC, so on IPv6-only or IPv6-preferred networks the host loses its IPv6 address and default route (broken connectivity on captive/public IPv6 networks). It is therefore left OFF by default and provided as an opt-in. A safer middle ground is to let NetworkManager handle RA in userspace and only disable kernel RA, but that is connection-specific and not a blanket sysctl."
      sources: ["madaidans:linux-hardening#sysctl", "secureblue (network hardening rationale)", "Arch Wiki Sysctl#Disable ICMP redirects (IPv6 context)"]
      risk: "high"
      breaks: ["Disables IPv6 SLAAC: on IPv6-only / IPv6-preferred wifi networks the host gets no IPv6 address or default route, breaking connectivity", "Can break captive-portal / dual-stack networks that rely on RA-provided DNS (RDNSS) or gateway", "Does not affect the KVM VM (guest has its own stack) but does affect host wifi"]
      enabled: false
      apply:
        - !Write
          path: "/etc/sysctl.d/91-ipv6-no-ra.conf"
          content: "# Opt-in: refuse IPv6 Router Advertisements (anti rogue-RA MITM)\n# WARNING: breaks IPv6 SLAAC on IPv6-only/preferred wifi networks.\nnet.ipv6.conf.all.accept_ra = 0\nnet.ipv6.conf.default.accept_ra = 0\nnet.ipv6.conf.all.router_solicitations = 0\nnet.ipv6.conf.default.router_solicitations = 0\n"
      verify: "sysctl net.ipv6.conf.all.accept_ra"
      revert: "rm /etc/sysctl.d/91-ipv6-no-ra.conf"
  - !NoCon
    value:
      id: "net-ipv6-privacy-tempaddr"
      title: "Enable IPv6 Privacy Extensions (use_tempaddr=2)"
      category: "sysctl-net"
      rationale: "secureblue ships net.ipv6.conf.*.use_tempaddr=2 so that outbound IPv6 connections prefer randomized temporary addresses instead of a stable EUI-64 address derived from the MAC, reducing cross-network device tracking. This is purely additive: SLAAC still assigns the stable address, so connectivity is unaffected. Compatible with NetworkManager (which also supports ipv6.addr-gen-mode/privacy at the connection level) and does not touch the VM."
      sources: ["secureblue (files/system/usr/lib/sysctl.d/55-hardening.conf)", "PrivacyGuides (IPv6 privacy / MAC randomization guidance)"]
      risk: "low"
