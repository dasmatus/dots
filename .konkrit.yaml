      rationale: "module.sig_enforce=1 refuses to load any module not signed by a trusted key, making malicious-module loading far harder (madaidans/secureblue baseline). Arch's stock linux in-tree modules (amdgpu, kvm_amd, vfio) are signed, so core function and the KVM VM keep working. The catch: any DKMS/out-of-tree module (v4l2loopback, VirtualBox, NVIDIA, ZFS, custom) must be MOK-signed or it silently fails to load, and must be re-signed on every kernel update on rolling Arch. Left OFF by default until a module-signing workflow exists."
