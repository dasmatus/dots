    value:
      id: "umask-077-login-defs"
      title: "Set restrictive default umask 077 and HOME_MODE 0700 in /etc/login.defs"
      category: "auth-pam"
      rationale: "Default Arch UMASK is 022, which makes new files group/world-readable. madaidans recommends umask 077 so newly created files are only accessible by the owner; Arch moved umask configuration out of /etc/profile into /etc/login.defs, so login.defs is the correct shell-agnostic place (login.defs honors the LAST matching key, so appending UMASK 077 overrides the shipped UMASK 022). HOME_MODE 0700 ensures new home directories are not traversable by other users (this is already the Arch default in current login.defs, so the append is idempotent)."
      sources: ["madaidans:linux-hardening", "Arch Linux News: Changes to default password hashing algorithm and umask settings", "login.defs(5) Arch manual", "PrivacyGuides (privacyguides.org)"]
      risk: "low"
      breaks: ["A stricter umask can surface latent bugs in poorly written software that assumes group/other-readable files (rare). Leaves a duplicate UMASK line in login.defs (cosmetic; the last value wins). Does not affect amdgpu/KMS, suspend/resume, wifi, or the KVM/virtio-gpu/virtiofs VM."]
      enabled: true
      apply:
        - !Append
          path: "/etc/login.defs"
          content: "UMASK 077"
        - !Append
          path: "/etc/login.defs"
          content: "HOME_MODE 0700"
      verify: "grep -E ^UMASK[[:space:]]+077 /etc/login.defs"
      revert: "Edit /etc/login.defs and remove the appended UMASK 077 line (restoring the shipped UMASK 022) and the appended HOME_MODE 0700 line to return to Arch defaults"
  - !NoCon
    value:
      id: "login-defs-password-aging-rounds"
      title: "Harden /etc/login.defs: password aging, login fail delay, and hashing cost"
      category: "auth-pam"
      rationale: "login.defs(5) enforces password aging (PASS_MAX_DAYS, PASS_MIN_DAYS, PASS_WARN_AGE) and a post-failure delay (FAIL_DELAY) to slow brute force at the console. Arch's default hash is yescrypt; YESCRYPT_COST_FACTOR (valid range 1-11) is set to 11 and SHA_CRYPT_MIN/MAX_ROUNDS raised for future-proofing. NOTE: these hashing-cost keys are read by the shadow utilities that call libc crypt directly; interactive user password changes go through pam_unix, which does NOT read these login.defs values, so this is hardening-in-depth rather than the primary control on pam_unix passwords. SHA_CRYPT_* rounds only apply to SHA512 hashes, which Arch no longer uses by default, so they are effectively inert but harmless."
      sources: ["login.defs(5) Arch manual", "Arch Linux News: Changes to default password hashing algorithm and umask settings", "madaidans:linux-hardening", "secureblue.dev"]
      risk: "low"
      breaks: ["Password aging means the user's password must be changed at least once a year; PASS_MIN_DAYS 1 blocks immediate re-change. Hashing-cost values only affect passwords set via the shadow tools and only for newly set passwords. No effect on amdgpu/suspend/wifi or the KVM/virtio-gpu/virtiofs VM."]
      enabled: true
      apply:
        - !Append
          path: "/etc/login.defs"
          content: "PASS_MAX_DAYS 365"
        - !Append
          path: "/etc/login.defs"
          content: "PASS_MIN_DAYS 1"
        - !Append
          path: "/etc/login.defs"
          content: "PASS_WARN_AGE 14"
        - !Append
          path: "/etc/login.defs"
          content: "FAIL_DELAY 4"
        - !Append
          path: "/etc/login.defs"
          content: "ENCRYPT_METHOD YESCRYPT"
        - !Append
          path: "/etc/login.defs"
          content: "YESCRYPT_COST_FACTOR 11"
        - !Append
          path: "/etc/login.defs"
          content: "SHA_CRYPT_MIN_ROUNDS 65536"
        - !Append
          path: "/etc/login.defs"
          content: "SHA_CRYPT_MAX_ROUNDS 65536"
      verify: "grep -E ^PASS_MAX_DAYS[[:space:]]+365 /etc/login.defs"
      revert: "Edit /etc/login.defs and remove the appended PASS_*, FAIL_DELAY, ENCRYPT_METHOD, YESCRYPT_COST_FACTOR and SHA_CRYPT_*_ROUNDS lines (login.defs honors the last matching key, so removing the appended lines restores prior behavior)"
  - !NoCon
    value:
      id: "faillock-lockout"
      title: "Configure pam_faillock account lockout in /etc/security/faillock.conf"
      category: "auth-pam"
      rationale: "Current Arch pambase (verified: pambase 20260616-1) already wires pam_faillock (preauth/authfail/authsucc) into /etc/pam.d/system-auth, so lockout behavior is controlled centrally by /etc/security/faillock.conf with no PAM-stack edits. This locks an account after repeated failures to defeat password brute forcing, mirroring secureblue's brute-force protection. The shipped faillock.conf has every option commented (defaults only), so writing the file is safe. Values shown are stricter than the faillock defaults (deny 3 / fail_interval 900 / unlock_time 600). even_deny_root is deliberately NOT set to avoid permanently locking the only admin path."
      sources: ["faillock.conf(5) Arch manual", "pam_faillock(8) Arch manual", "secureblue.dev", "Arch Wiki Security (wiki.archlinux.org/title/Security)"]
      risk: "medium"
      breaks: ["Repeated wrong passwords (at the display-manager/login, screen locker, sudo, or su) will lock the account for unlock_time; recover with 'faillock --user <name> --reset' as root or via a root TTY. Keep a root shell open when first enabling. Does not affect amdgpu/suspend/wifi or the KVM/virtio VM."]
      enabled: true
      apply:
        - !Write
          path: "/etc/security/faillock.conf"
          content: "# Managed: pam_faillock account lockout policy\n# Number of consecutive auth failures before lockout\ndeny = 5\n# Window in which the failures must occur (seconds)\nfail_interval = 900\n# Time the account stays locked after deny is reached (seconds)\nunlock_time = 1200\n# Log unknown usernames\naudit\n# Do NOT lock root: leave even_deny_root unset so the admin recovery path stays open\n"
      verify: "grep -E ^deny[[:space:]]*=[[:space:]]*5 /etc/security/faillock.conf"
      revert: "faillock --reset (clears existing tallies); to disable, remove /etc/security/faillock.conf so module defaults apply, or comment the pam_faillock lines in /etc/pam.d/system-auth"
