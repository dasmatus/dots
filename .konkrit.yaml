      sources: ["secureblue (files/system/usr/lib/sysctl.d/55-hardening.conf)", "Arch Wiki Sysctl (conf.* ARP semantics)", "kernel ip-sysctl.html (arp_ignore/arp_filter/drop_gratuitous_arp)"]
