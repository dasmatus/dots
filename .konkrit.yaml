      rationale: "madaidans/CIS: disable/remove what you don't need to minimise attack surface. Masking (not just disabling) makes the unit unstartable even via dependencies or sockets. On this GNOME host, rpcbind/nfs-server are genuinely unused and safe to mask, and debug-shell should be masked to block console root-shell abuse. avahi-daemon.service and cups.socket are CURRENTLY ENABLED on this desktop, so masking them is a deliberate trade-off (loses mDNS discovery and printing) \u2014 hence this item is left opt-in (default_enabled=false). Verify each is genuinely unused before applying."
      sources: ["madaidans:linux-hardening (reduce attack surface)", "Arch Wiki Security", "CIS systemd hardening (mask debug-shell/rpcbind/nfs-server)"]
      risk: "medium"
      breaks: ["cups/cups.socket masked breaks local and network printing (cups.socket is currently enabled on this host; unmask cups.socket if you print).", "avahi masked breaks mDNS/.local hostname discovery and printer/Chromecast discovery (avahi is currently enabled on this host). Name resolution itself is unaffected since nsswitch.conf uses systemd-resolved, not mdns.", "Does NOT affect libvirt's own dnsmasq (started by libvirtd, not rpcbind); virtiofs uses vhost, not nfs-server, so the VM is unaffected."]
      enabled: false
      apply:
        - !Command
          command: "systemctl mask --now avahi-daemon.socket avahi-daemon.service cups.service cups.socket rpcbind.service rpcbind.socket nfs-server.service debug-shell.service"
          parallel: false
      verify: "systemctl is-enabled debug-shell.service"
      revert: "systemctl unmask avahi-daemon.socket avahi-daemon.service cups.service cups.socket rpcbind.service rpcbind.socket nfs-server.service debug-shell.service"
  - !NoCon
    value:
      id: "audit-and-strip-setuid"
      title: "Audit setuid/setgid binaries (do NOT re-cap ping; Arch already ships it unprivileged)"
      category: "misc"
      rationale: "REJECTED as written. The premise that ping needs de-setuiding is false on Arch: verified on this host ping is -rwxr-xr-x with no setuid bit and no file capability, and net.ipv4.ping_group_range is already 0 2147483647 (set by /usr/lib/sysctl.d/50-default.conf), so ping uses unprivileged ICMP sockets. 'chmod u-s' is a no-op and 'setcap cap_net_raw+ep' would ADD an unneeded raw-socket capability, making ping MORE privileged than the secure Arch default \u2014 the opposite of the intent. Only the read-only audit (find for setuid/setgid) is worth keeping; the ping modification is removed."
      sources: ["madaidans:linux-hardening (setuid)", "Arch Wiki Security (SUID)", "Arch Wiki Iputils / iputils packaging (ping uses ping_group_range, no setcap)"]
      risk: "medium"
      breaks: ["Original item was counterproductive on Arch: it would add cap_net_raw to a ping that already runs unprivileged via net.ipv4.ping_group_range, increasing privilege rather than reducing it.", "De-setuiding the wrong binary (su/sudo/passwd) would break login/privesc; the corrected item touches no binaries and only audits."]
      enabled: false
      apply:
        - !Command
          command: "find / -xdev -type f -perm -4000 -o -type f -perm -2000"
          parallel: false
      verify: "getcap /usr/bin/ping"
      revert: "No state change is made by the corrected (audit-only) item; nothing to revert. (If the original setcap was applied by mistake, undo with: setcap -r /usr/bin/ping)"
  - !NoCon
    value:
      id: "polkit-restrict-and-no-rng-daemons"
      title: "Restrict polkit admin to the wheel group; skip redundant entropy daemons"
      category: "misc"
      rationale: "Polkit lets local sessions escalate; constraining administrative auth to the wheel group (matching sudo) reduces who can act. Verified host runs polkit 127 (JS rules engine) and user matus is already in wheel, so this rule is safe. Separately, on kernels >= 5.6 (host is 7.x) the CRNG seeds quickly from jitter+CPU and getrandom() no longer blocks late, so haveged/rng-tools add little besides daemon/attack surface \u2014 do not install them (note only, no action)."
      sources: ["Arch Wiki Polkit", "madaidans:linux-hardening (entropy)", "PrivacyGuides", "polkit(8) freedesktop reference (addAdminRule)"]
      risk: "medium"
      breaks: ["If the primary user is NOT in the wheel group, polkit admin prompts (some GNOME/KDE privileged actions) will fail \u2014 verified matus IS in wheel on this host, so it is safe; otherwise add with: usermod -aG wheel matus.", "Do NOT install haveged/rng-tools (this item's note): unnecessary on kernel 7.x and would add a daemon; no action needed beyond not installing them."]
      enabled: false
      apply:
        - !Write
          path: "/etc/polkit-1/rules.d/49-wheel-admin.rules"
          content: "/* Treat only members of the 'wheel' group as administrators for polkit. */\npolkit.addAdminRule(function(action, subject) {\n    return [\"unix-group:wheel\"];\n});\n"
        - !Command
          command: "groups {{user}}"
          parallel: false
      verify: "test -f /etc/polkit-1/rules.d/49-wheel-admin.rules"
      revert: "rm /etc/polkit-1/rules.d/49-wheel-admin.rules"
  - !NoCon
    value:
      id: "core-kernel-self-protection-kargs"
      title: "Core kernel self-protection boot parameters (slab_nomerge, init_on_alloc/free, page_alloc.shuffle, randomize_kstack_offset, vsyscall=none)"
      category: "boot-params"
      rationale: "slab_nomerge hardens heap exploitation by preventing object overwrites across merged caches; init_on_alloc=1/init_on_free=1 zero memory on alloc and free to kill use-after-free and erase secrets; page_alloc.shuffle=1 randomizes page allocator freelists; randomize_kstack_offset=on randomizes the kernel stack per syscall; vsyscall=none removes the obsolete fixed-address vsyscall ROP target. Exact KSPP/madaidans/secureblue baseline, safe on amdgpu, suspend, wifi, and the KVM/virtio VM."
      sources: ["madaidans:linux-hardening (Boot parameters)", "KSPP Recommended_Settings (slab_nomerge, init_on_alloc=1, init_on_free=1, page_alloc.shuffle=1, randomize_kstack_offset=on, vsyscall=none)", "secureblue kargs (https://secureblue.dev/articles/kargs)", "Arch Wiki Unified kernel image / mkinitcpio(8) (/etc/cmdline.d precedence)"]
