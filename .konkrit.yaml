      rationale: "mem_encrypt=on enables AMD SME, transparently encrypting host RAM against cold-boot/physical DRAM attacks (a secureblue optional/unstable karg). But on a host whose job is running the libvirt KVM guest with virtio-gpu/virtiofs, SME forces guest DMA through SWIOTLB bounce buffers, adding CPU overhead and risking SWIOTLB pool exhaustion under virtio multiqueue load - hurting and occasionally breaking virtio I/O. Under the maximal-but-must-not-break-the-VM constraint this stays OFF; enable only if physical RAM attacks are in your threat model and you accept VM I/O overhead."
