      title: "Enable and enforce strong passwords via pam_pwquality in system-auth + /etc/security/pwquality.conf"
      category: "auth-pam"
      rationale: "CORRECTION: contrary to a common assumption, Arch's pambase does NOT load pam_pwquality by default (verified: no pam_pwquality line anywhere in /etc/pam.d; ArchWiki PAM states it must be added manually). Therefore /etc/security/pwquality.conf is inert until the module is wired into the PAM password stack. This item (a) inserts 'password requisite pam_pwquality.so retry=3' BEFORE pam_unix in /etc/pam.d/system-auth (ordering required by pam_pwquality(8)) and adds use_authtok to pam_unix so it reuses the validated token, and (b) sets a strong policy in pwquality.conf (minlen 16, multiple character classes, dictionary/repeat/sequence/username checks, enforced for root). madaidans and secureblue recommend long, complex passwords."
      sources: ["madaidans:linux-hardening", "Arch Wiki Security (wiki.archlinux.org/title/Security)", "PAM - ArchWiki (wiki.archlinux.org/title/PAM)", "pam_pwquality(8) / pwquality.conf(5) Arch manual", "secureblue.dev"]
      risk: "medium"
      breaks: ["WARNING: system-auth is the central PAM stack used by login, sudo, su, the display manager and screen locker. A typo in this file can lock you out of ALL authentication; keep a root TTY open and test 'sudo -v' / a new login in a separate session immediately after applying. New/changed passwords must satisfy the policy, including for root (enforce_for_root); existing passwords are unaffected until changed. If pambase is updated by pacman, re-apply the pam_pwquality line (a .pacnew will appear). No effect on amdgpu/suspend/wifi or the KVM/virtio-gpu/virtiofs VM."]
      enabled: true
      apply:
        - !Write
          path: "/etc/security/pwquality.conf"
          content: "# Managed: libpwquality strong-password policy\nminlen = 16\nminclass = 3\ndcredit = -1\nucredit = -1\nlcredit = -1\nocredit = -1\nmaxrepeat = 3\nmaxsequence = 3\ngecoscheck = 1\ndictcheck = 1\nusercheck = 1\nenforcing = 1\nenforce_for_root\n"
        - !Write
          path: "/etc/pam.d/system-auth"
          content: "#%PAM-1.0\n\nauth       required                    pam_faillock.so      preauth\n# Optionally use requisite above if you do not want to prompt for the password\n# on locked accounts.\n-auth      [success=2 default=ignore]  pam_systemd_home.so\nauth       [success=1 default=bad]     pam_unix.so          try_first_pass nullok\nauth       [default=die]               pam_faillock.so      authfail\nauth       optional                    pam_permit.so\nauth       required                    pam_env.so\nauth       required                    pam_faillock.so      authsucc\n# If you drop the above call to pam_faillock.so the lock will be done also\n# on non-consecutive authentication failures.\n\n-account   [success=1 default=ignore]  pam_systemd_home.so\naccount    required                    pam_unix.so\naccount    optional                    pam_permit.so\naccount    required                    pam_time.so\n\n-password  [success=1 default=ignore]  pam_systemd_home.so\npassword   requisite                   pam_pwquality.so     retry=3\npassword   required                    pam_unix.so          try_first_pass nullok shadow use_authtok\npassword   optional                    pam_permit.so\n\n-session   optional                    pam_systemd_home.so\nsession    required                    pam_limits.so\nsession    required                    pam_unix.so\nsession    optional                    pam_permit.so\n"
      verify: "grep -E ^password[[:space:]]+requisite[[:space:]]+pam_pwquality.so /etc/pam.d/system-auth"
      revert: "Restore /etc/pam.d/system-auth from the pacman-shipped version (e.g. cp /etc/pam.d/system-auth.pacnew or reinstall pambase: pacman -S pambase) to remove the pam_pwquality line and the use_authtok flag, and remove/empty /etc/security/pwquality.conf to fall back to defaults"
  - !NoCon
    value:
      id: "su-restrict-wheel"
      title: "Restrict su to the wheel group via pam_wheel in /etc/pam.d/su"
      category: "auth-pam"
      rationale: "By default Arch ships /etc/pam.d/su (and su-l) with the pam_wheel line commented out, so any user who knows root's password can su to root (verified on host). pam_wheel(8) with use_uid restricts su to members of the wheel group, a standard Arch Wiki / madaidans hardening step. use_uid checks the real uid so it cannot be bypassed by a forged login session. The host's admin user is already in the wheel group, so su access is preserved."
      sources: ["pam_wheel(8) Arch manual", "madaidans:linux-hardening", "Arch Wiki Security (wiki.archlinux.org/title/Security)"]
      risk: "medium"
      breaks: ["Only wheel-group members can run su; the host admin user 'matus' is already in wheel ('getent group wheel'), so su is preserved. If applying to a host without a wheel admin, run 'gpasswd -a <user> wheel' FIRST. sudo is unaffected. No effect on amdgpu/suspend/wifi or the VM."]
      enabled: true
      apply:
        - !Append
          path: "/etc/pam.d/su"
          content: "auth required pam_wheel.so use_uid"
        - !Append
          path: "/etc/pam.d/su-l"
          content: "auth required pam_wheel.so use_uid"
      verify: "grep -E ^auth[[:space:]]+required[[:space:]]+pam_wheel.so[[:space:]]+use_uid /etc/pam.d/su"
      revert: "Remove the appended 'auth required pam_wheel.so use_uid' line from /etc/pam.d/su and /etc/pam.d/su-l (the original commented template line is unchanged)"
  - !NoCon
    value:
      id: "lock-root-account"
      title: "Lock the root account password (force sudo/wheel-only escalation)"
      category: "auth-pam"
      rationale: "madaidans and secureblue recommend locking the root account so direct root password authentication is impossible; combined with the wheel/sudo setup this removes a high-value credential target and disables direct root login on TTYs and su-with-root-password. 'passwd --lock root' disables password auth for root while leaving the account usable via sudo. Only enable on a host that already has a working sudo-capable wheel user (this host: 'matus' is in wheel)."
      sources: ["madaidans:linux-hardening", "Arch Wiki Security (wiki.archlinux.org/title/Security)", "secureblue.dev"]
      risk: "high"
      breaks: ["After this you CANNOT log in as root directly or use the root password in single-user/emergency mode prompts; recovery requires a sudo-capable wheel user or booting with init=/bin/bash from the bootloader (UEFI/systemd-boot or GRUB edit). Verify 'sudo -v' works for your admin user FIRST. Keep emergency boot media available. Does not affect amdgpu/suspend/wifi or the KVM/virtio-gpu/virtiofs VM (libvirt/QEMU run under your user + libvirt group, not root login)."]
      enabled: false
      apply:
        - !Command
          command: "passwd --lock root"
          parallel: false
      verify: "passwd --status root"
      revert: "passwd --unlock root (run as root via sudo) to restore root password authentication"
  - !NoCon
    value:
      id: "tmp-tmpfs-nosuid-nodev-noexec"
      title: "Mount /tmp as a hardened tmpfs (nosuid,nodev,noexec) via fstab"
      category: "mount"
      rationale: "madaidans recommends nosuid,nodev,noexec on /tmp to block exploit code and setuid/device tricks staged in the world-writable temp dir. On this host /tmp is currently provided by systemd's tmp.mount as tmpfs rw,nosuid,nodev (NO noexec, ~7.8G). Adding an explicit /tmp tmpfs line to /etc/fstab makes systemd honor these options (tmp.mount is static and defers to an fstab entry), adding noexec. RAM-backed tmpfs also avoids leaving temp data on disk."
      sources: ["madaidans:linux-hardening.html (fstab example /tmp nosuid,noexec,nodev)", "Arch Wiki Tmpfs", "Arch Wiki Security", "secureblue"]
      risk: "medium"
      breaks: ["noexec on /tmp breaks makepkg/AUR builds and any tool that runs intermediate binaries from $TMPDIR=/tmp. Mitigated here by setting BUILDDIR=/var/tmp/makepkg in /etc/makepkg.conf (an exec-allowed path). For other tools that exec from /tmp, set TMPDIR to an exec-allowed dir.", "size=4G caps /tmp at 4 GiB of RAM/swap; large temp writes can hit 'No space left on device'. Host has ~15.7 GiB RAM, so raise size if needed (e.g. size=8G).", "Requires a reboot to take effect. systemd tmp.mount will honor this fstab entry instead of its built-in defaults on next boot.", "If BUILDDIR=/var/tmp/makepkg is set, do NOT also apply noexec to /var/tmp (see var-tmp item), or builds will fail."]
      enabled: true
      apply:
        - !Append
          path: "/etc/fstab"
          content: "tmpfs /tmp tmpfs rw,nosuid,nodev,noexec,size=4G,mode=1777,strictatime 0 0"
        - !Command
          command: "true"
          parallel: false
        - !Append
          path: "/etc/makepkg.conf"
          content: "BUILDDIR=/var/tmp/makepkg"
      verify: "findmnt -no OPTIONS /tmp"
      revert: "Remove the tmpfs /tmp line from /etc/fstab (and optionally the BUILDDIR line from /etc/makepkg.conf) and reboot; systemd reverts to its default tmp.mount tmpfs without noexec."
  - !NoCon
    value:
      id: "var-tmp-nosuid-nodev-noexec"
      title: "Harden /var/tmp with nosuid,nodev,noexec (self bind mount)"
      category: "mount"
      rationale: "/var/tmp is world-writable and persistent across reboots, a prime staging area for payloads. madaidans-style hardening applies nosuid,nodev,noexec. On this host /var/tmp is a directory on the root ext4 FS (not a separate partition), so a self bind mount is required to enforce per-directory options. Disabled by default because it directly conflicts with using /var/tmp as the makepkg BUILDDIR (see tmp item) and with package tooling that execs from /var/tmp."
      sources: ["madaidans:linux-hardening.html (Mount options)", "Arch Wiki Security", "secureblue"]
      risk: "medium"
      breaks: ["CONFLICT: noexec on /var/tmp is incompatible with BUILDDIR=/var/tmp/makepkg set by the tmp-tmpfs item. Pick ONE: either keep /var/tmp exec-capable for builds (do NOT enable this), OR point BUILDDIR elsewhere (e.g. a dedicated exec-allowed dir) AND enable this.", "Self bind mount requires /var/tmp to already exist (it does). On hosts where /var is its own partition, add the options to the real /var/tmp entry instead.", "Some package managers/installers extract and run helper scripts from /var/tmp and will fail under noexec.", "Does not affect amdgpu/suspend/wifi/KVM/virtio-gpu/virtiofs."]
      enabled: false
      apply:
        - !Append
          path: "/etc/fstab"
          content: "/var/tmp /var/tmp none rw,nosuid,nodev,noexec,bind 0 0"
      verify: "findmnt -no OPTIONS /var/tmp"
      revert: "Remove the /var/tmp bind line from /etc/fstab and reboot."
  - !NoCon
    value:
      id: "dev-shm-nosuid-nodev-noexec"
      title: "Harden /dev/shm with nosuid,nodev,noexec (explicit pin)"
      category: "mount"
      rationale: "/dev/shm is a world-writable tmpfs abused for fileless payload execution; noexec blocks running code from shared memory, nosuid+nodev block setuid/device abuse. NOTE: on this host /dev/shm is ALREADY mounted rw,nosuid,nodev,noexec by default, so this item is largely redundant \u2014 it serves to pin the hardening explicitly in /etc/fstab so a future default change cannot silently relax it."
      sources: ["madaidans:linux-hardening.html (Mount options)", "Arch Wiki Security", "secureblue"]
      risk: "low"
      breaks: ["Already satisfied by default on this host, so applying it changes nothing \u2014 purely defensive pinning.", "Rare host-side apps that JIT/mmap-exec from POSIX shared memory could break, but untrusted GUI apps run inside the VM here so host exposure is minimal. Chromium/Electron use /dev/shm for IPC, not exec, and are unaffected.", "Does not affect amdgpu/suspend/wifi/KVM/virtio-gpu/virtiofs."]
      enabled: true
      apply:
        - !Append
          path: "/etc/fstab"
          content: "tmpfs /dev/shm tmpfs rw,nosuid,nodev,noexec 0 0"
      verify: "findmnt -no OPTIONS /dev/shm"
      revert: "Remove the tmpfs /dev/shm line from /etc/fstab and reboot (kernel/systemd re-mounts /dev/shm with defaults, which already include nosuid,nodev,noexec on current Arch)."
  - !NoCon
    value:
      id: "home-nosuid-nodev"
      title: "Harden /home with nosuid,nodev (keep exec)"
      category: "mount"
      rationale: "nosuid stops setuid escalation via user-controlled files; nodev blocks device-node tricks in user-writable space. noexec is intentionally omitted (it would break ~/.local/bin, cargo/pip/npm binaries, AppImages, user scripts). On THIS host /home is a dedicated ext4 LVM volume (/dev/mapper/ArchinstallVg-home, UUID=140483b0-478b-44b0-b44c-bbd20c1ec86e), so the options apply directly via its fstab line \u2014 no bind mount needed."
      sources: ["madaidans:linux-hardening.html (fstab example /home nosuid,noexec,nodev)", "Arch Wiki Security"]
      risk: "low"
      breaks: ["IMPORTANT: this appends a second /home line. The ORIGINAL line 'UUID=140483b0-478b-44b0-b44c-bbd20c1ec86e /home ext4 rw,relatime 0 2' must be removed (edited in place) so there is no duplicate /home entry \u2014 duplicates cause an ambiguous/failed mount. Prefer editing the existing line to add nosuid,nodev rather than appending.", "nosuid and nodev are safe for ordinary home dirs. noexec is intentionally NOT applied.", "Does not affect amdgpu/suspend/wifi/KVM/virtio-gpu/virtiofs (libvirt images under /home still read/write fine; nodev/nosuid do not affect regular image files or virtiofs)."]
      enabled: true
      apply:
        - !Command
          command: "cp /etc/fstab /etc/fstab.bak.home"
          parallel: false
        - !Append
          path: "/etc/fstab"
          content: "UUID=140483b0-478b-44b0-b44c-bbd20c1ec86e\t/home\text4\trw,relatime,nosuid,nodev\t0 2"
      verify: "findmnt -no OPTIONS /home"
      revert: "Restore /etc/fstab.bak.home (or remove the added nosuid,nodev /home line and ensure the original UUID=140483b0... /home ext4 rw,relatime line is present) and remount/reboot."
  - !NoCon
    value:
      id: "boot-nosuid-nodev-noexec"
      title: "Harden /boot (ESP) with nosuid,nodev,noexec"
      category: "mount"
      rationale: "/boot only holds kernel images, initramfs, and bootloader files read at boot; no runtime userspace exec/suid/dev is needed. On this UEFI host /boot is the FAT32 ESP (/dev/nvme0n1p1, UUID=7DF9-9502). Arch's mkinitcpio and bootloader WRITE to /boot but never exec from it at runtime, so noexec is safe. Tighter fmask/dmask additionally hide ESP contents from non-root."
      sources: ["madaidans:linux-hardening.html (fstab example /boot nosuid,noexec,nodev)", "Arch Wiki Security", "secureblue"]
      risk: "low"
      breaks: ["IMPORTANT: this appends a second /boot line. The ORIGINAL 'UUID=7DF9-9502 /boot vfat rw,relatime,fmask=0022,dmask=0022,...' line must be removed (edited in place) to avoid a duplicate /boot mount. Prefer editing the existing line.", "After applying, verify a kernel update succeeds (pacman -S linux) and that the system still boots; standard mkinitcpio + systemd-boot/GRUB on Arch write to /boot rather than executing from it, so noexec is normally safe.", "fmask=0137,dmask=0027 restrict ESP file/dir permissions to root; if any non-root tooling reads /boot it may lose access (uncommon).", "Does not affect amdgpu/suspend/wifi/KVM/virtio-gpu/virtiofs."]
      enabled: true
      apply:
        - !Command
          command: "cp /etc/fstab /etc/fstab.bak.boot"
          parallel: false
        - !Append
          path: "/etc/fstab"
          content: "UUID=7DF9-9502\t/boot\tvfat\trw,relatime,nosuid,nodev,noexec,fmask=0137,dmask=0027,codepage=437,iocharset=ascii,shortname=mixed,utf8,errors=remount-ro\t0 2"
      verify: "findmnt -no OPTIONS /boot"
      revert: "Restore /etc/fstab.bak.boot (or remove the hardened /boot line and ensure the original UUID=7DF9-9502 /boot vfat rw,relatime,fmask=0022,dmask=0022,... line is present) and remount/reboot."
  - !NoCon
    value:
      id: "proc-hidepid-gid-proc"
      title: "Hide other users' processes: /proc with hidepid=2,gid=proc (DISABLED \u2014 breaks GNOME/Wayland session)"
      category: "mount"
      rationale: "madaidans recommends mounting /proc with hidepid=2,gid=proc to hide other users' processes. REJECTED-by-default on this host: /proc is ALREADY mounted nosuid,nodev,noexec (the hardening flags are met); the only delta is hidepid, which is documented (Arch BBS 287272, Arch Wiki) to be fundamentally incompatible with systemd-based graphical desktops \u2014 GNOME Shell under Wayland fails to start with 'Could not get session ID' and the logind drop-in does NOT fix it. The 'proc' group already exists (gid 26), so no groupadd is needed."
      sources: ["madaidans:linux-hardening.html (/proc hidepid=2,gid=proc)", "Arch Wiki Security", "Arch BBS id=287272 (GNOME/Wayland hidepid breakage)"]
      risk: "high"
      breaks: ["BREAKS THE DESKTOP: hidepid=2 makes GNOME Shell / Wayland sessions fail to launch ('Could not get session ID: Failed to get session by pid'); adding gdm/logind to the proc group does NOT reliably fix it (Arch BBS 287272). This is a graphical AMD-GPU desktop host, so this is left DISABLED.", "Do NOT run 'groupadd --system proc' \u2014 the proc group already exists on this system (gid 26); groupadd would fail. The fstab gid=proc resolves the existing group.", "If you must use it on a headless variant, prefer hidepid=1 (hides details, not existence) which is far less likely to break session tooling, and pair with the systemd-logind drop-in.", "/proc is already mounted nosuid,nodev,noexec by default, so skipping this loses only the hidepid feature, not the suid/dev/exec hardening.", "Does not directly affect amdgpu/KVM/virtio-gpu/virtiofs, but breaks the logind graphical session those run within."]
      enabled: false
      apply:
        - !Append
          path: "/etc/fstab"
          content: "proc /proc proc rw,nosuid,nodev,noexec,hidepid=2,gid=proc 0 0"
      verify: "findmnt -no OPTIONS /proc"
      revert: "Remove the proc /proc line from /etc/fstab (kernel/systemd mounts /proc with defaults: nosuid,nodev,noexec, no hidepid) and reboot."
  - !NoCon
    value:
      id: "logind-supplementarygroups-proc"
      title: "Grant systemd-logind proc-group access for hidepid (DISABLED \u2014 parent hidepid disabled)"
      category: "mount"
      rationale: "Companion to proc-hidepid-gid-proc: adds SupplementaryGroups=proc to systemd-logind so it retains process visibility under hidepid. DISABLED here because the parent hidepid item is disabled on this graphical host \u2014 and critically, this drop-in does NOT actually make hidepid=2 work with GNOME/Wayland (Arch BBS 287272 shows the session still fails). The drop-in path/content are correct on Arch; the directory is created by the write."
      sources: ["madaidans:linux-hardening.html (systemd-logind SupplementaryGroups=proc)", "Arch Wiki Security", "Arch BBS id=287272 (drop-in insufficient for GNOME/Wayland)"]
      risk: "low"
      breaks: ["Only meaningful WITH the proc hidepid=2,gid=proc item, which is DISABLED on this host because it breaks GNOME/Wayland; this drop-in alone does not fix that breakage (Arch BBS 287272).", "daemon-reload does NOT actually apply SupplementaryGroups to the running logind; that needs a systemd-logind restart or reboot. Restarting logind mid-session disturbs the active graphical session, so apply only at the next reboot.", "Harmless if applied without the hidepid item (no functional effect), just dead config.", "Does not affect amdgpu/suspend/wifi/KVM/virtio-gpu/virtiofs."]
      enabled: false
      apply:
        - !Write
          path: "/etc/systemd/system/systemd-logind.service.d/hidepid.conf"
          content: "[Service]\nSupplementaryGroups=proc\n"
        - !Command
          command: "systemctl daemon-reload"
          parallel: false
      verify: "systemctl show systemd-logind.service -p SupplementaryGroups"
      revert: "Delete /etc/systemd/system/systemd-logind.service.d/hidepid.conf and run systemctl daemon-reload (then reboot)."
  - !NoCon
    value:
      id: "sysctl-disable-coredumps-suid-dumpable"
      title: "Disable core dumps and SUID core dumps via sysctl"
      category: "coredump-ptrace"
      rationale: "Core dumps record process memory at crash time and can contain passwords and encryption keys. madaidans recommends kernel.core_pattern=|/bin/false to discard all dumps and fs.suid_dumpable=0 to never dump setuid/privileged binaries (the most dangerous case). Arch Wiki Core dump documents the same; the file is numbered 51 so it overrides systemd's /usr/lib/sysctl.d/50-coredump.conf."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html (Core Dumps Disabled)", "Arch Wiki Core dump (wiki.archlinux.org/title/Core_dump)", "secureblue.dev"]
      risk: "low"
      breaks: ["Userspace crash handlers / post-mortem debuggers that rely on kernel-generated core files (e.g. abrt, manual gdb from a core file) no longer get a core. Use a live debugger attach instead (note: the Yama ptrace_scope=2 item further restricts live attach to CAP_SYS_PTRACE)."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/51-coredump-hardening.conf"
          content: "# Discard all core dumps (madaidans, Arch Wiki Core dump)\nkernel.core_pattern=|/bin/false\n# Never create core dumps for setuid/privileged processes\nfs.suid_dumpable=0\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl fs.suid_dumpable"
      revert: "rm /etc/sysctl.d/51-coredump-hardening.conf"
  - !NoCon
    value:
      id: "systemd-coredump-storage-none"
      title: "Disable systemd-coredump storage and processing"
      category: "coredump-ptrace"
      rationale: "Even with core_pattern piping, systemd-coredump can be the registered handler and would still store dumps under /var/lib/systemd/coredump and log backtraces. Storage=none plus ProcessSizeMax=0 disables all coredump handling except a journal log entry, per coredump.conf(5); madaidans and Arch Wiki recommend Storage=none. Defense-in-depth in case core_pattern is reset to the systemd handler."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html (Core Dumps Disabled)", "Arch Wiki Core dump (wiki.archlinux.org/title/Core_dump)", "coredump.conf(5) man.archlinux.org"]
      risk: "low"
      breaks: ["No core dumps are saved or processed by systemd-coredump; coredumpctl will have nothing to inspect."]
      enabled: true
      apply:
        - !Write
          path: "/etc/systemd/coredump.conf.d/disable.conf"
          content: "[Coredump]\nStorage=none\nProcessSizeMax=0\n"
        - !Command
          command: "systemctl daemon-reload"
          parallel: false
      verify: "systemd-analyze cat-config systemd/coredump.conf"
      revert: "rm /etc/systemd/coredump.conf.d/disable.conf"
  - !NoCon
    value:
      id: "limits-conf-hard-core-zero"
      title: "Set a hard ulimit of 0 for core dump size (PAM limits)"
      category: "coredump-ptrace"
      rationale: "limits.conf enforces the core dump size ceiling at the PAM/session level for all users so processes cannot raise it. madaidans recommends '* hard core 0'. Defense-in-depth alongside the sysctl and systemd settings; root is listed explicitly because the '*' wildcard does not always apply to root."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html (Core Dumps Disabled)", "Arch Wiki Core dump (wiki.archlinux.org/title/Core_dump)", "limits.conf(5)"]
      risk: "low"
      breaks: ["Applies to PAM-based login sessions; daemons started outside a PAM session are unaffected (covered by the sysctl/systemd items instead)."]
      enabled: true
      apply:
        - !Write
          path: "/etc/security/limits.d/30-disable-coredumps.conf"
          content: "# Hard-cap core dump size at 0 for all users (madaidans)\n*               hard    core            0\nroot            hard    core            0\n"
      verify: "grep core /etc/security/limits.d/30-disable-coredumps.conf"
      revert: "rm /etc/security/limits.d/30-disable-coredumps.conf"
  - !NoCon
    value:
      id: "yama-ptrace-scope-2"
      title: "Restrict ptrace to CAP_SYS_PTRACE via Yama (ptrace_scope=2)"
      category: "coredump-ptrace"
      rationale: "ptrace lets one process read and modify another's memory, a trivial path to dump secrets or inject code. madaidans recommends kernel.yama.ptrace_scope=2, limiting PTRACE_ATTACH to processes with CAP_SYS_PTRACE. Yama LSM is compiled into the Arch kernel (CONFIG_SECURITY_YAMA=y) and defaults to 0. Value 2 is chosen over 3 because 3 disables ptrace entirely and is irreversible until reboot, breaking legitimate root debugging of host services and the libvirt VM."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html (ptrace Scope Restriction)", "kernel.org Yama documentation (docs.kernel.org/admin-guide/LSM/Yama.html)", "secureblue.dev"]
      risk: "medium"
      breaks: ["Non-root debuggers (gdb, strace, ltrace) can no longer attach to already-running processes without CAP_SYS_PTRACE; run them with sudo or launch the target under the debugger. Some crash reporters that read another process need CAP_SYS_PTRACE. Does NOT affect KVM/QEMU, virtio-gpu, virtiofs, amdgpu, suspend, or wifi."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/52-ptrace-hardening.conf"
          content: "# Restrict ptrace PTRACE_ATTACH to CAP_SYS_PTRACE only (madaidans)\nkernel.yama.ptrace_scope=2\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl kernel.yama.ptrace_scope"
      revert: "rm /etc/sysctl.d/52-ptrace-hardening.conf"
  - !NoCon
    value:
      id: "kptr-restrict-2"
      title: "Hide kernel pointers and kallsyms (kptr_restrict=2)"
      category: "coredump-ptrace"
      rationale: "Kernel pointers exposed via /proc and /proc/kallsyms give attackers exact addresses for exploitation (KASLR defeat). madaidans recommends kernel.kptr_restrict=2, which masks pointers for all users including those with CAP_SYSLOG, fully hiding /proc/kallsyms symbol addresses. Arch defaults this to 0."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html (Kernel Pointer Restriction)", "KSPP Recommended Settings (kspp.github.io/Recommended_Settings.html)", "secureblue.dev"]
      risk: "low"
      breaks: ["perf and some profiling/tracing tools cannot resolve kernel symbol/module addresses, degrading kernel-level profiling output; rarely needed on a workstation."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/53-kptr-restrict.conf"
          content: "# Hide kernel pointers / kallsyms addresses from all users (madaidans, KSPP)\nkernel.kptr_restrict=2\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl kernel.kptr_restrict"
      revert: "rm /etc/sysctl.d/53-kptr-restrict.conf"
  - !NoCon
    value:
      id: "dmesg-restrict-1"
      title: "Restrict access to the kernel log (dmesg_restrict=1)"
      category: "coredump-ptrace"
      rationale: "The kernel ring buffer (dmesg) leaks sensitive debugging data including kernel pointers and addresses useful for exploitation. madaidans recommends kernel.dmesg_restrict=1, limiting dmesg reads to processes with CAP_SYSLOG (effectively root). Equivalent to CONFIG_SECURITY_DMESG_RESTRICT but set at runtime."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html (Kernel Log Access Restriction)", "KSPP Recommended Settings (kspp.github.io/Recommended_Settings.html)", "secureblue.dev"]
      risk: "low"
      breaks: ["Unprivileged users can no longer run dmesg; troubleshooting (e.g. checking amdgpu/firmware messages) now requires sudo dmesg. Does not affect kernel functionality, amdgpu/KMS, suspend, wifi, KVM, or virtio."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/54-dmesg-restrict.conf"
          content: "# Restrict kernel log (dmesg) reads to CAP_SYSLOG (madaidans, KSPP)\nkernel.dmesg_restrict=1\n"
        - !Command
          command: "sysctl --system"
