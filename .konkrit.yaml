          content: "# IPv6 privacy extensions: prefer temporary (randomized) source addresses\nnet.ipv6.conf.all.use_tempaddr = 2\nnet.ipv6.conf.default.use_tempaddr = 2\n"
      verify: "sysctl net.ipv6.conf.all.use_tempaddr"
      revert: "rm /etc/sysctl.d/92-ipv6-privacy.conf"
