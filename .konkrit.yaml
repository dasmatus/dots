      id: "sudo-hardening-defaults-dropin"
      title: "Harden sudo via /etc/sudoers.d drop-in (use_pty, env_reset, secure_path, !visiblepw, short timeout, log file)"
      category: "ssh-sudo-polkit"
      rationale: "Arch's /etc/sudoers ends with '@includedir /etc/sudoers.d', so a validated 0440 drop-in is the safe, package-update-proof way to enforce hardening. use_pty runs commands in a separate pseudo-tty so a compromised target cannot inject into the controlling terminal (madaidans/secureblue); env_reset + secure_path strip a poisoned environment/PATH (secure_path is not compiled into Arch's sudo, so setting it here is required to take effect); !visiblepw refuses to prompt when echo cannot be disabled; logfile gives a tamper-evident audit trail; a short timestamp_timeout limits the credential cache window. These mirror the Arch Wiki Sudo security guidance. Verified: the exact content parses with 'visudo -c' (parsed OK)."
      sources: ["Arch Wiki Sudo (wiki.archlinux.org/title/Sudo)", "sudoers(5) man.archlinux.org", "sudo.ws: Why sudo 1.9.16 enables secure_path by default", "madaidans:linux-hardening", "secureblue.dev"]
      risk: "low"
      breaks: ["Headless/cron scripts that pipe a password into sudo over a non-tty may break because of use_pty/!visiblepw; for those use a dedicated NOPASSWD rule or run as the service user instead.", "timestamp_timeout=5 means re-auth every 5 minutes of inactivity; raise it (or set 0 to always require a password) per preference.", "Does NOT affect amdgpu/suspend/wifi or the KVM/virtio VM."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sudoers.d/10-hardening"
          content: "# Managed: sudo hardening (maximal posture)\nDefaults use_pty\nDefaults env_reset\nDefaults !visiblepw\nDefaults secure_path=\"/usr/local/sbin:/usr/local/bin:/usr/bin\"\nDefaults timestamp_timeout=5\nDefaults passwd_tries=3\nDefaults logfile=\"/var/log/sudo.log\"\nDefaults lecture=once\n"
        - !Command
          command: "visudo -c -f /etc/sudoers.d/10-hardening"
          parallel: false
        - !Command
          command: "chmod 0440 /etc/sudoers.d/10-hardening"
          parallel: false
      verify: "visudo -c -f /etc/sudoers.d/10-hardening"
      revert: "rm /etc/sudoers.d/10-hardening"
