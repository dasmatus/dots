  - !NoCon
    value:
      id: "aslr-mmap-entropy"
      title: "Maximize ASLR entropy: randomize_va_space + vm.mmap_rnd_bits"
      category: "sysctl-kernel"
      rationale: "randomize_va_space=2 is full ASLR (stack, mmap, brk, VDSO). vm.mmap_rnd_bits=32 / mmap_rnd_compat_bits=16 raise mmap-base entropy to the x86_64 maximum so memory-corruption exploits need a stronger info leak first (madaidans, secureblue). Verified on this host: the kernel was built with CONFIG_ARCH_MMAP_RND_BITS_MAX=32 and CONFIG_ARCH_MMAP_RND_COMPAT_BITS_MAX=16, so both values are accepted (the bound is compile-time, not a runtime la57 check). Does not touch amdgpu/KMS, suspend, wifi, or the KVM/virtio-gpu/virtiofs guest."
      sources: ["madaidans:sysctl", "secureblue", "kspp:Recommended_Settings"]
      risk: "low"
      breaks: ["On a different kernel build where CONFIG_ARCH_MMAP_RND_BITS_MAX is 28, writing 32 is rejected and logged as a sysctl error at boot; lower it to 28 there. This host's kernel is built with MAX=32 so it applies cleanly. ASLR itself still works either way.", "Very rare legacy 32-bit apps allocating huge contiguous mmaps could fail."]
      enabled: true
      apply:
        - !Write
          path: "/etc/sysctl.d/90-hardening-aslr.conf"
          content: "# ASLR entropy (madaidans / secureblue).\n# This kernel: CONFIG_ARCH_MMAP_RND_BITS_MAX=32, COMPAT_MAX=16 -> both values accepted.\nkernel.randomize_va_space = 2\nvm.mmap_rnd_bits = 32\nvm.mmap_rnd_compat_bits = 16\n"
        - !Command
          command: "sysctl --system"
          parallel: false
      verify: "sysctl vm.mmap_rnd_bits"
      revert: "rm /etc/sysctl.d/90-hardening-aslr.conf"
  - !NoCon
    value:
      id: "fs-protected-links-files"
      title: "Filesystem link/file protections (symlinks, hardlinks, fifos, regular)"
      category: "sysctl-kernel"
      rationale: "protected_symlinks=1 and protected_hardlinks=1 block classic symlink/hardlink TOCTOU attacks in world-writable dirs (e.g. /tmp). protected_fifos=2 and protected_regular=2 stop a process from being tricked into opening an attacker-planted FIFO/regular file in a sticky world-writable directory, defeating data-spoofing. Recommended by madaidans, KSPP, and Arch Wiki; zero impact on GPU/suspend/wifi/VM."
      sources: ["madaidans:sysctl", "kspp:Recommended_Settings", "Arch Wiki Security#Sysctl"]
