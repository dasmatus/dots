  - !NoCon
    value:
      id: "nftables-default-deny-inbound-conf"
      title: "Default-deny inbound host firewall via /etc/nftables.conf (inet dual-stack, loopback + established/related + drop)"
      category: "firewall"
      rationale: "PrivacyGuides and Arch Wiki Security recommend a default-deny inbound firewall on Linux desktops. This is the nftables.org 'Simple ruleset for a workstation' (inet/dual-stack) extended with 'ct state invalid drop'. Arch already ships a near-identical /etc/nftables.conf (verified: nftables 1:1.1.6-3). Loopback allowed, established/related tracked, IPv6 ND/SLAAC permitted, everything else hits policy drop. The virbr0 accept lines use 'iifname' (runtime name match) so the ruleset loads cleanly even though libvirt/virbr0 are not present yet on this host; they pre-authorize guest->host DHCP/DNS for when the KVM VM is later created (required because in nftables a drop in ANY base chain on the input hook is final and overrides accepts in libvirt's own libvirt_network table)."
      sources: ["nftables wiki: Simple ruleset for a workstation (wiki.nftables.org)", "Arch Wiki Security (wiki.archlinux.org/title/Security)", "Arch Wiki nftables (wiki.archlinux.org/title/Nftables)", "PrivacyGuides (privacyguides.org/en/os/linux-overview)"]
      risk: "medium"
      breaks: ["Blocks all unsolicited inbound to the host (intended). Any host-listening service you want reachable (SSH, KDE Connect, file sharing) must get an explicit accept rule added to the input chain.", "If you rely on host-side mDNS/.local discovery (Avahi), add 'udp dport 5353 accept' (see mdns item) or it will be blocked.", "forward policy is accept (not the Arch-default drop); intentional for the KVM host but slightly looser than stock. Acceptable since no IP forwarding is enabled until libvirt sets it up."]
      enabled: true
      apply:
        - !Write
          path: "/etc/nftables.conf"
          content: "#!/usr/bin/nft -f\n# Host firewall: default-deny inbound. Dual-stack (inet) workstation ruleset.\n# Source: nftables.org \"Simple ruleset for a workstation\" + Arch Wiki Security.\n# NOTE: This drops unsolicited inbound on the HOST. It does NOT default-drop the\n# 'forward' hook, so libvirt NAT routing (guest -> internet) is unaffected once\n# libvirt is installed. libvirt is NOT installed on this host yet; the virbr0\n# rules below are pre-authorizations that match by interface NAME ('iifname'),\n# so they load fine even though virbr0 does not exist.\n\nflush ruleset\n\ntable inet filter {\n\tchain input {\n\t\ttype filter hook input priority filter; policy drop;\n\n\t\t# Early drop of invalid connections\n\t\tct state invalid drop\n\n\t\t# Allow traffic from established and related connections\n\t\tct state established,related accept\n\n\t\t# Allow loopback traffic\n\t\tiif lo accept\n\n\t\t# Allow ICMP and IGMP (ping, path MTU, multicast)\n\t\tip protocol icmp accept\n\t\tip6 nexthdr icmpv6 accept\n\t\tip protocol igmp accept\n\n\t\t# IPv6 neighbor discovery / SLAAC (keep IPv6 working)\n\t\ticmpv6 type { nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert, nd-router-solicit } accept\n\n\t\t# --- libvirt NAT guest connectivity (effective once libvirt+virbr0 exist) ---\n\t\t# 'iifname' matches by name at runtime, so these load even if virbr0 is absent.\n\t\t# Let KVM guests reach host dnsmasq for DHCP (udp 67) and DNS (udp/tcp 53).\n\t\tiifname \"virbr0\" udp dport { 53, 67 } accept\n\t\tiifname \"virbr0\" tcp dport 53 accept\n\n\t\t# Everything else is dropped by policy.\n\t}\n\n\tchain forward {\n\t\t# Left at policy accept so libvirt's own 'libvirt_network' table can govern\n\t\t# guest NAT routing without the host base chain dropping forwarded packets.\n\t\t# (Arch's stock nftables.conf uses policy drop here; that would block libvirt\n\t\t# NAT unless libvirt's forward accepts win, so accept is the safer default\n\t\t# for a KVM host.)\n\t\ttype filter hook forward priority filter; policy accept;\n\t}\n\n\tchain output {\n\t\ttype filter hook output priority filter; policy accept;\n\t}\n}\n"
      verify: "nft -c -f /etc/nftables.conf"
      revert: "Restore the previous /etc/nftables.conf (Arch ships a default at install). Then: nft -f /etc/nftables.conf"
  - !NoCon
    value:
