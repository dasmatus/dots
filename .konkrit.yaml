  - !NoCon
    value:
      id: "mac-alternatives-landlock-selinux-note"
      title: "Document MAC alternatives: Landlock (kept in lsm=) and SELinux (mutually exclusive)"
      category: "mac-apparmor"
      rationale: "madaidans notes SELinux is more fine-grained than AppArmor (inode-based, can filter ioctls) but much harder to use; on Arch SELinux requires a relabelled filesystem and a different major LSM (selinux in lsm=, or legacy security=selinux), so it cannot run alongside AppArmor as the major LSM and is impractical on a rolling stock-kernel host. Landlock is a stackable, unprivileged sandboxing LSM already first in the recommended lsm= ordering, so it coexists with AppArmor and needs no extra package. This item only records the rationale for choosing AppArmor here; no host change is applied."
      sources: ["madaidans MAC (SELinux vs AppArmor)", "Arch Wiki Security#Linux_Security_Modules", "docs.kernel.org Landlock"]
      risk: "low"
      breaks: ["Switching to SELinux instead of AppArmor would require replacing apparmor in lsm= with selinux, a filesystem relabel, and SELinux-enabled kernel/policy packages not in the Arch core/extra repos \u2014 out of scope and would disable the AppArmor setup above."]
      enabled: false
      apply:
        - !Command
          command: "true"
          parallel: false
      verify: "No change is made; this is a documentation note only."
      revert: "No change is made; nothing to revert."
  - !NoCon
    value:
      id: "systemd-default-limit-core-zero"
      title: "Set DefaultLimitCORE=0 globally in systemd manager (system + user)"
      category: "coredump-ptrace"
      rationale: "Even with systemd-coredump disabled, the per-process RLIMIT_CORE inherited from the manager governs whether a kernel core file can be produced. Forcing DefaultLimitCORE=0:0 (soft:hard) for both the system and user managers guarantees no service can dump core, complementing the coredump.conf change. A daemon-reexec or reboot is required for the manager to re-read system.conf."
      sources: ["madaidans:linux-hardening (Core dumps)", "Arch Wiki Core dump", "systemd-system.conf(5)"]
      risk: "low"
      breaks: ["Combined with fs.suid_dumpable=0 (sysctl) this fully removes core-dump capability; only revert temporarily when debugging a crash.", "system.conf changes need 'systemctl daemon-reexec' (included) or a reboot to apply to PID1."]
      enabled: true
      apply:
        - !Write
          path: "/etc/systemd/system.conf.d/50-coredump.conf"
          content: "[Manager]\nDefaultLimitCORE=0:0\n"
        - !Write
          path: "/etc/systemd/user.conf.d/50-coredump.conf"
          content: "[Manager]\nDefaultLimitCORE=0:0\n"
        - !Command
          command: "systemctl daemon-reexec"
          parallel: false
      verify: "systemctl show -p DefaultLimitCORE"
      revert: "rm /etc/systemd/system.conf.d/50-coredump.conf /etc/systemd/user.conf.d/50-coredump.conf"
  - !NoCon
    value:
      id: "systemd-analyze-security-workflow"
      title: "Audit and triage unit exposure with systemd-analyze security"
      category: "systemd"
      rationale: "systemd-analyze security scores every running unit (0=safe to 10=exposed) against the sandboxing/privilege directives and lists per-directive findings, so you can rank which units to harden first. Running it per-unit shows exactly which ProtectSystem/SystemCallFilter/RestrictAddressFamilies knobs are still UNSET. This is the canonical Arch Wiki sandboxing workflow and is read-only/non-destructive."
      sources: ["Arch Wiki Security#systemd", "Arch Wiki systemd/Sandboxing", "secureblue.dev"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Command
          command: "systemd-analyze security"
          parallel: false
        - !Command
          command: "systemd-analyze security systemd-coredump@.service"
          parallel: false
      verify: "systemd-analyze security"
      revert: "true"
  - !NoCon
    value:
      id: "systemd-global-default-sandbox"
      title: "Set conservative sandbox defaults for all units via system.conf.d"
      category: "systemd"
      rationale: "Manager-wide defaults raise the floor for every service that does not override them: DefaultNoNewPrivileges blocks setuid/privilege escalation across all units, and a default UMask of 0077 prevents world/group-readable files. These do not change device/namespace behavior, so amdgpu, suspend, wifi and libvirt are unaffected. CAVEAT: DefaultNoNewPrivileges=yes as a GLOBAL default can silently break system units that legitimately re-exec setuid/setcap helpers, and such failures are hard to diagnose; the preferred secureblue/madaidans pattern is per-unit NoNewPrivileges plus per-unit hardening rather than a blanket manager default. DefaultUMask=0077 is the low-risk half of this item."
      sources: ["madaidans:linux-hardening (systemd sandboxing)", "Arch Wiki systemd/Sandboxing", "secureblue.dev"]
      risk: "medium"
      breaks: ["DefaultNoNewPrivileges=yes can break system units that legitimately rely on setuid helpers or capability-gaining exec; any such unit must set NoNewPrivileges=no in its own drop-in, and the failure mode (silent EPERM) is hard to spot.", "Interactive sudo/polkit at a login shell are NOT affected by this manager default (they are not PID1-child units), but verify privileged GUI/polkit actions after applying.", "system.conf changes require 'systemctl daemon-reexec' (included) or reboot to take effect.", "Set default_enabled=false: prefer per-unit NoNewPrivileges; a global default risks silent privilege-helper breakage. DefaultUMask=0077 alone can be split out and enabled safely if desired."]
      enabled: false
      apply:
        - !Write
          path: "/etc/systemd/system.conf.d/50-hardening.conf"
          content: "[Manager]\nDefaultNoNewPrivileges=yes\nDefaultUMask=0077\n"
        - !Command
          command: "systemctl daemon-reexec"
          parallel: false
      verify: "systemctl show -p DefaultNoNewPrivileges -p DefaultUMask"
      revert: "rm /etc/systemd/system.conf.d/50-hardening.conf"
  - !NoCon
    value:
      id: "sandbox-network-service-dropin"
      title: "Example hardening drop-in for a network-facing daemon (sshd)"
      category: "systemd"
      rationale: "A concrete drop-in showing the high-value sandbox directives madaidans/Arch recommend: read-only filesystem (ProtectSystem=strict), no home access, private /tmp, kernel-tunable/module/cgroup protection, restricted socket families and a seccomp allow-list of @system-service minus dangerous groups. Drop-ins live under /etc/systemd/system/<unit>.d/ so vendor units are never edited. sshd is chosen because it is network-facing and the directives below are validated not to break key-based logins. On Arch the unit is sshd.service (openssh package)."
      sources: ["madaidans:linux-hardening (example sandboxed unit)", "Arch Wiki systemd/Sandboxing", "secureblue.dev"]
      risk: "medium"
      breaks: ["sshd needs RestrictAddressFamilies to include AF_INET/AF_INET6/AF_UNIX/AF_NETLINK and must NOT use NoNewPrivileges (PAM/su/login needs it), so keep NoNewPrivileges unset here.", "Do NOT add MemoryDenyWriteExecute or PrivateDevices to sshd: some PAM modules and crypto can break; test login on a second session before logging out.", "Only applies if the openssh package is installed and sshd is used on the host. Reload with 'systemctl daemon-reload' (included) then 'systemctl restart sshd' while holding an open root session."]
      enabled: false
      apply:
        - !Write
          path: "/etc/systemd/system/sshd.service.d/99-hardening.conf"
          content: "[Service]\nProtectSystem=strict\nProtectHome=read-only\nPrivateTmp=true\nProtectKernelTunables=true\nProtectKernelModules=true\nProtectKernelLogs=true\nProtectControlGroups=true\nProtectClock=true\nProtectHostname=true\nProtectProc=invisible\nProcSubset=pid\nRestrictNamespaces=true\nRestrictRealtime=true\nRestrictSUIDSGID=true\nLockPersonality=true\nRestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@resources @obsolete @reboot @swap\nUMask=0077\n"
        - !Command
          command: "systemctl daemon-reload"
          parallel: false
      verify: "systemd-analyze security sshd.service"
      revert: "rm /etc/systemd/system/sshd.service.d/99-hardening.conf"
  - !NoCon
    value:
      id: "sandbox-timer-oneshot-dropin"
      title: "Example aggressive sandbox drop-in for a non-network helper (fstrim.service)"
      category: "systemd"
      rationale: "Local maintenance oneshots that touch no network are ideal candidates for maximal sandboxing: deny all address families except AF_UNIX, deny W^X memory, restrict the capability bounding set, and apply a strict seccomp allow-list. This demonstrates the full madaidans directive set on a unit that will not break GPU/suspend/wifi/VM. fstrim.service only needs to issue FITRIM discard ioctls to mounted block devices, which is why PrivateDevices must NOT be set and CAP_SYS_ADMIN is retained."
      sources: ["madaidans:linux-hardening (example sandboxed unit)", "Arch Wiki systemd/Sandboxing", "secureblue.dev"]
      risk: "medium"
      breaks: ["fstrim needs ioctl access to the real block-device nodes; do NOT add PrivateDevices=true or it cannot see /dev block nodes. CAP_SYS_ADMIN is retained because FITRIM ioctls require it.", "After writing, run 'systemctl daemon-reload' (included) then 'systemctl start fstrim.service' to confirm it still trims; check 'journalctl -u fstrim' for seccomp/EPERM errors.", "Applies only if fstrim.timer/fstrim.service is enabled (util-linux); harmless if SSD trim is not in use."]
      enabled: false
      apply:
        - !Write
          path: "/etc/systemd/system/fstrim.service.d/99-hardening.conf"
          content: "[Service]\nProtectSystem=strict\nProtectHome=true\nPrivateTmp=true\nPrivateNetwork=true\nProtectKernelTunables=true\nProtectKernelModules=true\nProtectKernelLogs=true\nProtectControlGroups=true\nProtectClock=true\nProtectHostname=true\nProtectProc=invisible\nProcSubset=pid\nNoNewPrivileges=true\nCapabilityBoundingSet=CAP_SYS_ADMIN\nRestrictAddressFamilies=AF_UNIX\nRestrictNamespaces=true\nRestrictRealtime=true\nRestrictSUIDSGID=true\nLockPersonality=true\nMemoryDenyWriteExecute=true\nSystemCallArchitectures=native\nSystemCallFilter=@system-service\nSystemCallFilter=~@resources @obsolete @reboot @swap @mount\nUMask=0077\n"
        - !Command
          command: "systemctl daemon-reload"
          parallel: false
      verify: "systemd-analyze security fstrim.service"
      revert: "rm /etc/systemd/system/fstrim.service.d/99-hardening.conf"
  - !NoCon
    value:
      id: "resolved-encrypted-dns-dot"
      title: "Encrypted DNS via systemd-resolved (DNS-over-TLS + DNSSEC) with LLMNR/mDNS disabled"
      category: "dns-time-net"
      rationale: "systemd-resolved (part of the base systemd package on Arch, no extra install) supports DNS-over-TLS, DNSSEC validation and DNS caching; enabling DoT encrypts DNS traffic (port 853) so the local network cannot read or trivially tamper with lookups, and disabling LLMNR/MulticastDNS removes a local-network name-resolution attack/leak surface (Arch Wiki systemd-resolved; PrivacyGuides). DNSSEC=allow-downgrade validates where supported without breaking the many domains that are misconfigured for strict mode."
      sources: ["Arch Wiki Security (wiki.archlinux.org/title/Security)", "Arch Wiki systemd-resolved (wiki.archlinux.org/title/Systemd-resolved)", "PrivacyGuides (privacyguides.org)", "resolved.conf(5) (man.archlinux.org/man/resolved.conf.5.en)"]
      risk: "medium"
      breaks: ["DNSOverTLS=yes (strict) breaks captive-portal sign-in pages and networks that only offer a cleartext/hijacking resolver; switch to DNSOverTLS=opportunistic if you need captive WiFi.", "DNSSEC can intermittently fail for domains with broken DNSSEC; allow-downgrade mitigates this whereas DNSSEC=yes would not.", "Does NOT affect the libvirt VM: the VM's NAT uses libvirt's own dnsmasq bound to virbr0, independent of host resolved.", "Does NOT affect amdgpu/KMS, suspend/resume, the wifi link layer, or KVM/virtio-gpu/virtiofs."]
      enabled: true
      apply:
        - !Write
          path: "/etc/systemd/resolved.conf.d/10-hardening.conf"
          content: "[Resolve]\n# Encrypted DNS providers (Quad9 + Cloudflare). Adjust to taste.\nDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 1.1.1.1#cloudflare-dns.com 2620:fe::fe#dns.quad9.net 2606:4700:4700::1111#cloudflare-dns.com\nFallbackDNS=\n# Strict DNS-over-TLS: refuse cleartext fallback. Use 'opportunistic' if you\n# roam through captive portals; 'yes' is the maximal-posture choice here.\nDNSOverTLS=yes\n# Validate DNSSEC where the upstream supports it. Set to 'yes' for strict\n# validation (breaks misconfigured/legacy domains).\nDNSSEC=allow-downgrade\n# Remove local-network name-resolution leak/attack surface.\nLLMNR=no\nMulticastDNS=no\nCache=yes\nDNSStubListener=yes\n"
        - !Command
          command: "ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf"
          parallel: false
        - !Command
          command: "systemctl enable --now systemd-resolved.service"
          parallel: false
      verify: "resolvectl status"
      revert: "rm /etc/systemd/resolved.conf.d/10-hardening.conf"
  - !NoCon
    value:
      id: "nm-use-systemd-resolved"
      title: "Point NetworkManager DNS at systemd-resolved (no per-link resolver leaks)"
      category: "dns-time-net"
      rationale: "Setting dns=systemd-resolved makes NetworkManager push DHCP-provided servers into resolved as per-link DNS instead of overwriting /etc/resolv.conf, so all queries go through the encrypted/validating stub on 127.0.0.53 and DoT/DNSSEC actually apply to every connection (Arch Wiki NetworkManager + systemd-resolved)."
      sources: ["Arch Wiki NetworkManager (wiki.archlinux.org/title/NetworkManager)", "Arch Wiki systemd-resolved (wiki.archlinux.org/title/Systemd-resolved)", "NetworkManager.conf reference (networkmanager.dev)"]
      risk: "low"
      breaks: ["If you do NOT use NetworkManager (e.g. iwd or systemd-networkd standalone), this file is inert/harmless and the resolver integration must be configured for that stack instead.", "Does not affect libvirt VM NAT (virbr0 dnsmasq is unaffected).", "Does not affect amdgpu/suspend/KVM/virtio-gpu/virtiofs."]
      enabled: true
      apply:
        - !Write
          path: "/etc/NetworkManager/conf.d/10-dns-systemd-resolved.conf"
          content: "[main]\ndns=systemd-resolved\n"
        - !Command
          command: "systemctl restart NetworkManager.service"
          parallel: false
      verify: "resolvectl status"
      revert: "rm /etc/NetworkManager/conf.d/10-dns-systemd-resolved.conf"
  - !NoCon
    value:
      id: "nm-mac-randomization"
      title: "Randomize Wi-Fi/Ethernet MAC addresses in NetworkManager (scan + per-connection)"
      category: "dns-time-net"
      rationale: "wifi.scan-rand-mac-address=yes resets the MAC to a random value during scanning so passive trackers cannot fingerprint the device before association, and cloned-mac-address=random issues a fresh random MAC on every connection so APs/networks cannot correlate visits by hardware address (Arch Wiki MAC address spoofing / NetworkManager; PrivacyGuides). 'random' is the maximal-privacy choice; 'stable' (with connection.stable-id) is the less-aggressive alternative that keeps a per-network MAC. NOTE: this only takes effect when NetworkManager uses its internal wpa_supplicant Wi-Fi backend; with the iwd backend these keys are ignored and randomization must be set in /etc/iwd/main.conf instead."
      sources: ["Arch Wiki MAC address spoofing (wiki.archlinux.org/title/MAC_address_spoofing)", "Arch Wiki NetworkManager (wiki.archlinux.org/title/NetworkManager)", "PrivacyGuides (privacyguides.org)", "madaidans-insecurities.github.io/guides/linux-hardening.html"]
      risk: "medium"
      breaks: ["IWD BACKEND CAVEAT: if NetworkManager is configured with wifi.backend=iwd, it ignores wifi.cloned-mac-address and wifi.scan-rand-mac-address from conf.d entirely \u2014 Wi-Fi MAC randomization must then be configured in /etc/iwd/main.conf ([General] AddressRandomization=network or =once). This drop-in still works for the wpa_supplicant backend and for ethernet.", "A new random MAC every connection breaks networks that gate access by MAC allowlist, captive-portal-by-MAC sessions, and DHCP static-lease reservations; set the cloned-mac-address values to 'stable' for those networks.", "Some buggy APs reject rapidly-changing MACs; per-connection override (nmcli connection modify <id> 802-11-wireless.cloned-mac-address <fixed>) can pin a MAC where needed.", "Applies only to host physical interfaces; does NOT touch the libvirt tap/bridge (virbr0) devices or the VM's virtio NIC, so KVM NAT and virtio-gpu/virtiofs are unaffected. Does not affect amdgpu/suspend."]
      enabled: true
      apply:
        - !Write
          path: "/etc/NetworkManager/conf.d/00-macrandomize.conf"
          content: "[device]\n# Randomize MAC frequently while scanning (pre-association anti-tracking).\nwifi.scan-rand-mac-address=yes\n\n[connection]\n# Fresh random MAC on every activation (maximal). Use 'stable' instead to keep\n# a stable-per-network MAC (needed for MAC allowlists / DHCP reservations).\nwifi.cloned-mac-address=random\nethernet.cloned-mac-address=random\n# Used only when cloned-mac-address=stable; harmless otherwise.\nconnection.stable-id=${CONNECTION}/${BOOT}\n"
        - !Command
          command: "systemctl restart NetworkManager.service"
          parallel: false
      verify: "nmcli -f GENERAL.HWADDR device show"
      revert: "rm /etc/NetworkManager/conf.d/00-macrandomize.conf"
