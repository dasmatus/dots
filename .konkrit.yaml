      verify: "sysctl kernel.dmesg_restrict"
      revert: "rm /etc/sysctl.d/54-dmesg-restrict.conf"
  - !NoCon
    value:
      id: "install-apparmor-audit-userspace"
      title: "Install AppArmor userspace and the audit framework"
      category: "mac-apparmor"
      rationale: "AppArmor needs the apparmor userspace (apparmor_parser, aa-status, aa-enforce, aa-genprof) to load and manage profiles, and the Arch Wiki AppArmor page notes that the audit daemon (audit package, auditd.service) must be running for aa-genprof/aa-logprof/aa-notify to read kernel denials. Without these packages the kernel LSM has no profiles to enforce. Verified: 'apparmor' is in the extra repo and 'audit' is in the core repo; both names are correct."
      sources: ["Arch Wiki Security#Mandatory_access_control", "Arch Wiki AppArmor", "archlinux.org/packages (apparmor extra, audit core)", "apparmor.7 (man.archlinux.org)"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Command
          command: "emerge --noreplace --quiet sys-apps/apparmor sys-process/audit"
          parallel: false
      verify: "pacman -Qq apparmor audit"
      revert: "pacman -Rs apparmor audit"
  - !NoCon
    value:
      id: "lsm-boot-param-apparmor"
      title: "Set kernel lsm= boot parameter so AppArmor is the active major LSM"
      category: "boot-params"
      rationale: "Arch does not enable AppArmor by default; the kernel must be told to initialize it via the lsm= cmdline. Per the Arch Wiki AppArmor page the value is lsm=landlock,lockdown,yama,integrity,apparmor,bpf (apparmor as the major LSM; SELinux/SMACK/TOMOYO omitted; capability is auto-prepended). The legacy security=apparmor and apparmor=1 params are deprecated/useless and must NOT be used (security=apparmor corrupts the lsm list). This example uses GRUB. The lockdown LSM listed here stays inactive unless lockdown= is also passed, so this line does not restrict KVM/iGPU/virtio-gpu."
      sources: ["Arch Wiki AppArmor (kernel parameters)", "Arch Wiki Security#Linux_Security_Modules", "bbs.archlinux.org id=292335"]
      risk: "medium"
      breaks: ["IMPORTANT: this append adds a NEW GRUB_CMDLINE_LINUX_DEFAULT line. Because grub sources /etc/default/grub as shell, the last assignment wins, so any tokens in the ORIGINAL line (e.g. an existing resume=, amdgpu, or quiet param) would be dropped \u2014 on this host that could break suspend/resume. Instead, merge the lsm= token INTO the existing GRUB_CMDLINE_LINUX_DEFAULT line and keep its current contents, or ensure no other line set those params.", "A typo in lsm= (or accidentally adding security=apparmor) can leave the system with no/incorrect LSMs; verify with aa-status after reboot.", "If using systemd-boot/UKI instead of GRUB, edit the correct cmdline source (/boot/loader/entries/*.conf, or the kernel-cmdline file / mkinitcpio UKI config) rather than /etc/default/grub, then no grub-mkconfig is needed."]
      enabled: true
      apply:
        - !Append
          path: "/etc/default/grub"
          content: "GRUB_CMDLINE_LINUX_DEFAULT=\"loglevel=3 lsm=landlock,lockdown,yama,integrity,apparmor,bpf\""
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "aa-status"
      revert: "Edit /etc/default/grub to remove the lsm= token from GRUB_CMDLINE_LINUX_DEFAULT (and delete any duplicate line) then re-run grub-mkconfig -o /boot/grub/grub.cfg"
  - !NoCon
    value:
      id: "enable-apparmor-service"
      title: "Enable apparmor.service to load profiles at boot"
      category: "mac-apparmor"
      rationale: "AppArmor confinement is delivered by profiles loaded into the kernel via apparmor_parser, typically through the apparmor.service systemd unit (apparmor.7). Enabling it makes every profile under /etc/apparmor.d/ load on each boot once the lsm= param activates the LSM; disabling it is what stops profiles loading. Requires the lsm boot param to already be set. Note: stock Arch ships very few profiles, so on a base install this enforces almost nothing until a profile set is added."
      sources: ["apparmor.7 (man.archlinux.org)", "Arch Wiki AppArmor"]
