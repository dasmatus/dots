      rationale: "On Arch, nftables.service reads /etc/nftables.conf at startup and makes the ruleset persistent across reboots. Without enabling it, the firewall file exists but is never applied. This is the Arch Wiki nftables procedure."
      sources: ["Arch Wiki nftables (wiki.archlinux.org/title/Nftables)", "Arch Wiki Security (wiki.archlinux.org/title/Security)"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Command
          command: "systemctl enable --now nftables.service"
          parallel: false
      verify: "systemctl is-enabled nftables.service"
      revert: "systemctl disable --now nftables.service"
  - !NoCon
    value:
      id: "allow-virbr0-guest-dhcp-dns"
      title: "Allow libvirt VM NAT (virbr0) guest DHCP/DNS through the host input drop policy"
      category: "firewall"
      rationale: "The underlying concern is real and is already handled inside nftables-default-deny-inbound-conf: in nftables a drop in any base chain on the input hook is final and overrides accepts in libvirt's libvirt_network table, so guest->host DHCP (udp 67) and DNS (udp/tcp 53) must be explicitly accepted in the user's inet filter input chain. This standalone item is REJECTED because (a) its 'append' actions write lines after the closing brace of /etc/nftables.conf, producing a syntax error rather than inserting into the input chain, (b) the identical rules are already embedded in the main nftables.conf, and (c) libvirt is not installed and virbr0 does not exist on this host."
      sources: ["nftables wiki: Configuring chains (wiki.nftables.org)", "libvirt.org/firewall.html", "Fedora Wiki: Libvirt Virtual Network NFTables (fedoraproject.org/wiki/Changes/LibvirtVirtualNetworkNFTables)", "Arch Wiki Libvirt (wiki.archlinux.org/title/Libvirt)"]
      risk: "low"
      breaks: ["REJECTED: blind file-append placed the rules outside the chain braces (syntax error) and duplicated rules already present in /etc/nftables.conf. The virbr0 DHCP/DNS allow is instead correctly embedded (using 'iifname') in the nftables-default-deny-inbound-conf item. If your libvirt NAT bridge is named something other than virbr0, edit that embedded rule.", "libvirt is not installed on this host; no virbr0 exists yet."]
      enabled: false
      apply: []
      verify: "nft list chain inet filter input"
      revert: "n/a (no separate action applied; rules live in /etc/nftables.conf)"
  - !NoCon
    value:
      id: "libvirt-network-firewall-backend-nftables"
      title: "Pin libvirt's network firewall_backend to nftables in /etc/libvirt/network.conf (only if libvirt is installed)"
      category: "firewall"
      rationale: "When libvirt is installed, it manages virtual-network NAT/masquerade rules through firewall_backend in /etc/libvirt/network.conf. Pinning firewall_backend=\"nftables\" keeps libvirt consistent with the host nftables firewall and places its rules in a self-contained 'libvirt_network' table that coexists with the host 'inet filter' table. NOTE: libvirt is NOT currently installed on this host (verified: pacman -Q libvirt fails, /etc/libvirt/network.conf absent, no libvirtd.service), so this item cannot be applied yet. Additionally this host's 'iptables' is the nft-backed variant (xtables-nft-multi), so libvirt would otherwise auto-select the iptables(-nft) backend; firewall_backend=\"iptables\" is the documented Arch fallback if the nftables backend ever errors."
      sources: ["libvirt.org/firewall.html", "Fedora Wiki: Libvirt Virtual Network NFTables (fedoraproject.org/wiki/Changes/LibvirtVirtualNetworkNFTables)", "Arch Wiki Libvirt (wiki.archlinux.org/title/Libvirt)", "Arch bug FS#74552 iptables-nft + libvirt"]
      risk: "low"
      breaks: ["libvirt is NOT installed on this host: the append would create an orphan file and 'systemctl restart libvirtd.service' would fail (no such unit). Apply only after installing libvirt (pacman -S libvirt) and enabling libvirtd/virtnetworkd.", "Requires a libvirt version that supports the nftables backend (current Arch does). If the nftables backend errors, set firewall_backend = \"iptables\" instead (this host's iptables is nft-backed, so it still uses nftables under the hood).", "Restarting libvirtd re-applies network rules; a running guest's NAT rules are recreated."]
      enabled: false
      apply:
        - !Append
          path: "/etc/libvirt/network.conf"
          content: "firewall_backend = \"nftables\""
        - !Command
          command: "systemctl restart libvirtd.service"
          parallel: false
      verify: "nft list tables"
      revert: "Remove the firewall_backend line from /etc/libvirt/network.conf and restart libvirtd.service"
  - !NoCon
    value:
      id: "ufw-alternative-default-deny"
      title: "ufw alternative: default-deny inbound (use INSTEAD OF nftables.conf, not alongside)"
      category: "firewall"
      rationale: "ufw is the simpler, higher-level alternative recommended by Arch Wiki and PrivacyGuides for users who don't want to hand-write nftables. On Arch, ufw drives the iptables command which on this host is the nft-backed variant (xtables-nft-multi). It provides the same default-deny-inbound posture. MUTUALLY EXCLUSIVE with the hand-written /etc/nftables.conf \u2014 pick one. For this host nftables.conf is preferred because of fine-grained virbr0 control for the future KVM VM. If using ufw, add allows for virbr0 so the VM keeps DHCP/DNS (and 'ufw route allow in/out on virbr0' for forwarded guest traffic)."
      sources: ["Arch Wiki Uncomplicated Firewall (wiki.archlinux.org/title/Uncomplicated_Firewall)", "Arch Wiki Libvirt (wiki.archlinux.org/title/Libvirt)", "PrivacyGuides (privacyguides.org/en/os/linux-overview)"]
      risk: "medium"
      breaks: ["Do NOT enable ufw.service and a hand-written nftables.service at the same time \u2014 they will both try to own the ruleset. Choose one.", "Without 'ufw allow in on virbr0' (and the route allows), ufw's default-deny blocks guest->host DHCP/DNS once libvirt is installed and the KVM VM loses networking.", "ufw must not run together with an enabled iptables.service/ip6tables.service.", "libvirt is not installed yet on this host, so virbr0 does not exist; the virbr0 ufw rules only take effect once libvirt creates the bridge."]
      enabled: false
      apply:
        - !Command
          command: "emerge --noreplace --quiet net-firewall/ufw"
          parallel: false
        - !Command
          command: "ufw default deny incoming"
          parallel: false
        - !Command
          command: "ufw default allow outgoing"
          parallel: false
        - !Command
          command: "ufw allow in on virbr0"
          parallel: false
        - !Command
          command: "ufw route allow in on virbr0"
          parallel: false
        - !Command
          command: "ufw route allow out on virbr0"
          parallel: false
        - !Command
          command: "ufw --force enable"
          parallel: false
        - !Command
          command: "systemctl enable --now ufw.service"
          parallel: false
      verify: "ufw status verbose"
      revert: "ufw --force reset; systemctl disable --now ufw.service"
  - !NoCon
    value:
      id: "usbguard-install"
      title: "Install USBGuard (Arch: usbguard package)"
      category: "usbguard"
      rationale: "USBGuard enforces a USB device authorization policy in the kernel, the primary defense against BadUSB / malicious peripheral attacks recommended by madaidans and the Arch Wiki. The package (extra/usbguard, currently 1.1.4-8) must be installed before any policy or service can be configured. Installing alone does NOT block anything (the systemd service is not auto-enabled by Arch presets). The package ships a DEFAULT usbguard-daemon.conf and an EMPTY rules.conf, plus an empty /etc/usbguard/IPCAccessControl.d/ directory; later items overwrite/seed these before the service is ever started. Pulls in polkit and audit as dependencies automatically."
      sources: ["Arch Wiki Security (wiki.archlinux.org/title/USBGuard)", "archlinux.org/packages/extra/x86_64/usbguard", "madaidans:physical-access", "secureblue"]
      risk: "low"
      breaks: []
      enabled: true
      apply:
        - !Command
          command: "emerge --noreplace --quiet sys-apps/usbguard"
          parallel: false
      verify: "pacman -Q usbguard"
      revert: "pacman -Rns --noconfirm usbguard"
  - !NoCon
    value:
      id: "usbguard-generate-initial-policy"
      title: "Generate initial allow-list from currently attached devices (anti-lockout, MUST run before enabling the service)"
      category: "usbguard"
      rationale: "Critical anti-lockout step the Arch Wiki warns about: 'Make sure to actually configure the daemon before starting/enabling it or all USB devices, including keyboard and mouse, will immediately be blocked!' 'usbguard generate-policy' emits allow rules (with device hashes) for every USB device attached RIGHT NOW. The command writes ONLY to stdout (there is no --output flag), so it must be redirected into /etc/usbguard/rules.conf, replacing the empty file the package ships. The harness forbids shell redirection in plain argv, so this is wrapped in 'sh -c' where the '>' lives inside the script string. Run with keyboard, mouse, internal USB hubs/webcam plugged in. The iGPU/amdgpu and KVM virtio devices are PCI, not USB, so they are unaffected; only physical USB peripherals matter. '-P' (--no-ports-sn) omits port-specific rules for devices without an iSerial so peripherals still match when moved to a different USB port \u2014 desirable on a laptop."
      sources: ["Arch Wiki Security (wiki.archlinux.org/title/USBGuard)", "usbguard(1) man-page (man.archlinux.org/man/usbguard.1)", "madaidans:physical-access"]
      risk: "high"
      breaks: ["If run with a peripheral unplugged, that device is REJECTED on next insert until you add a rule. Re-run after plugging in any forgotten device, or use 'usbguard allow-device' once the service is running.", "The redirection MUST stay inside the sh -c script string \u2014 a bare 'usbguard generate-policy' dumps the policy to stdout and leaves the shipped EMPTY rules.conf in place, which would lock out keyboard/mouse the moment the service starts."]
      enabled: true
      apply:
        - !Command
          command: "sh -c usbguard generate-policy -P > /etc/usbguard/rules.conf"
          parallel: false
        - !Command
          command: "chmod 0600 /etc/usbguard/rules.conf"
          parallel: false
        - !Command
          command: "chown root:root /etc/usbguard/rules.conf"
          parallel: false
      verify: "test -s /etc/usbguard/rules.conf"
      revert: "rm -f /etc/usbguard/rules.conf (or restore the empty packaged file). Note: removing rules.conf while ImplicitPolicyTarget=block is set will block all USB on next service start."
  - !NoCon
    value:
      id: "usbguard-daemon-conf-hardened"
      title: "Harden /etc/usbguard/usbguard-daemon.conf (block implicit, apply-policy, IPC for your user)"
      category: "usbguard"
      rationale: "Sets enforcement posture. ImplicitPolicyTarget=block silently blocks unknown devices (package + madaidans default; 'reject' is more aggressive but can cause re-probe loops with some hubs, so 'block' is the safer maximal default). PresentDevicePolicy/InsertedDevicePolicy=apply-policy evaluate the generated allow-list at boot and on hotplug. PresentControllerPolicy=keep keeps USB host controllers present at boot authorized (apply-policy here can wedge boot if a controller is not in the policy). IPCAllowedUsers must include the login user (matus) and/or IPCAllowedGroups=wheel, else 'usbguard allow-device' over IPC is denied to non-root. RestoreControllerDeviceState=false avoids leaving controllers authorized across daemon restarts. AuditBackend=LinuxAudit routes audit events to the kernel audit subsystem (the usbguard package depends on 'audit', so this works without extra setup and avoids a dependency on the /var/log/usbguard audit-file directory). DeviceManagerBackend=uevent is the correct real-host backend. The file ships with the package; this overwrites it. PCI devices (amdgpu, KVM virtio-gpu/virtiofs) are not USB and untouched."
      sources: ["Arch Wiki Security (wiki.archlinux.org/title/USBGuard)", "usbguard-daemon.conf(5) (man.archlinux.org/man/usbguard-daemon.conf.5)", "usbguard.github.io/documentation/configuration", "secureblue"]
      risk: "high"
      breaks: ["PresentControllerPolicy=keep is chosen so USB host controllers present at boot stay authorized; setting it to apply-policy can wedge boot if a controller is not in the policy.", "IPCAllowedUsers hard-codes 'matus'; if the login user differs, edit IPCAllowedUsers (or rely on IPCAllowedGroups=wheel) or you cannot manage devices at runtime without root."]
      enabled: true
      apply:
        - !Write
          path: "/etc/usbguard/usbguard-daemon.conf"
          content: "RuleFile=/etc/usbguard/rules.conf\nImplicitPolicyTarget=block\nPresentDevicePolicy=apply-policy\nPresentControllerPolicy=keep\nInsertedDevicePolicy=apply-policy\nAuthorizedDefault=none\nRestoreControllerDeviceState=false\nDeviceManagerBackend=uevent\nIPCAllowedUsers=root matus\nIPCAllowedGroups=wheel\nIPCAccessControlFiles=/etc/usbguard/IPCAccessControl.d/\nDeviceRulesWithPort=false\nAuditBackend=LinuxAudit\nAuditFilePath=/var/log/usbguard/usbguard-audit.log\nHidePII=false\n"
        - !Command
          command: "chmod 0600 /etc/usbguard/usbguard-daemon.conf"
          parallel: false
      verify: "grep -q ImplicitPolicyTarget=block /etc/usbguard/usbguard-daemon.conf"
      revert: "Reinstall the packaged default: pacman -S --noconfirm usbguard (then re-confirm config overwrite), or set ImplicitPolicyTarget=allow temporarily to unblock all USB."
  - !NoCon
    value:
      id: "usbguard-ipc-access-control"
      title: "Grant your user fine-grained USBGuard IPC access (IPCAccessControl.d, space-delimited)"
      category: "usbguard"
      rationale: "Pairs with IPCAccessControlFiles in the daemon config. Without an IPC access-control entry, 'usbguard allow-device', 'usbguard list-devices' and persistent rule appends fail for a non-root user even when listed in IPCAllowedUsers. This grants the login user list/listen/modify on Devices, list/modify on Policy and Parameters, and listen on Exceptions, so a newly inserted trusted device can be authorized without root or a full lockout. CRITICAL FORMAT: privileges are SPACE-separated, not comma-separated (the documented format is 'Devices=modify list listen'). The file basename must equal the username; a leading ':' would denote a group. The /etc/usbguard/IPCAccessControl.d/ directory already ships with the package. Equivalent to running 'usbguard add-user matus -d=modify,list,listen -p=modify,list -P=modify,list -e=listen'."
      sources: ["usbguard.github.io/documentation/configuration", "usbguard(1) add-user (man.archlinux.org/man/usbguard.1)", "Arch Wiki Security (wiki.archlinux.org/title/USBGuard)"]
      risk: "low"
      breaks: ["File name must equal the login username (here 'matus'); rename if your user differs.", "Privileges MUST be space-separated; a comma-separated file is parsed incorrectly and grants nothing."]
      enabled: true
      apply:
        - !Write
          path: "/etc/usbguard/IPCAccessControl.d/{{user}}"
          content: "Devices=modify list listen\nPolicy=modify list\nParameters=modify list\nExceptions=listen\n"
        - !Command
          command: "chmod 0600 /etc/usbguard/IPCAccessControl.d/{{user}}"
          parallel: false
      verify: "test -f /etc/usbguard/IPCAccessControl.d/{{user}}"
      revert: "rm -f /etc/usbguard/IPCAccessControl.d/{{user}}"
  - !NoCon
    value:
      id: "usbguard-enable-service"
      title: "Enable and start usbguard.service (ONLY after rules.conf is seeded)"
      category: "usbguard"
      rationale: "usbguard.service (/usr/lib/systemd/system/usbguard.service) is the enforcement daemon; nothing is blocked until it runs. It MUST be enabled only AFTER rules.conf has been populated from currently-attached devices (the packaged rules.conf is EMPTY) and the daemon config is in place, otherwise keyboard/mouse are blocked instantly (Arch Wiki explicit warning, compounded by ImplicitPolicyTarget=block). Enabling at boot gives persistent BadUSB protection. Do NOT enable usbguard-dbus.service (also shipped) unless a desktop applet needs it \u2014 extra attack surface. USB-only: amdgpu/iGPU, suspend, wifi, and the KVM virtio-gpu/virtiofs VM (all PCI) are unaffected."
      sources: ["Arch Wiki Security (wiki.archlinux.org/title/USBGuard)", "usbguard-daemon(8) (man.archlinux.org/man/usbguard-daemon.8)", "secureblue"]
      risk: "high"
      breaks: ["If rules.conf is empty or does not list your keyboard/mouse, they are blocked the instant this starts (the packaged rules.conf is EMPTY). ALWAYS run usbguard-generate-initial-policy first and confirm 'test -s /etc/usbguard/rules.conf'.", "Hot-plugging a brand-new device later requires 'usbguard allow-device <id>' (transient) or 'usbguard allow-device -p <id>' to persist; budget for this in daily use."]
      enabled: true
      apply:
        - !Command
          command: "systemctl enable --now usbguard.service"
          parallel: false
      verify: "systemctl is-active usbguard.service"
      revert: "systemctl disable --now usbguard.service"
  - !NoCon
    value:
      id: "dma-iommu-boot-params"
      title: "Enable IOMMU + block early-boot PCI DMA (Thunderbolt/FireWire/PCIe DMA attacks)"
      category: "boot-params"
      rationale: "madaidans 'Physical attacks': Thunderbolt/FireWire/PCIe/USB4 peripherals can DMA into system RAM, bypassing USBGuard (which only governs USB enumeration). 'amd_iommu=force_isolation' enforces per-device IOMMU isolation on AMD Barcelo (stronger superset of madaidans' 'amd_iommu=on'); 'iommu=force' keeps the hardware IOMMU active; 'efi=disable_early_pci_dma' clears the busmaster bit on all PCI bridges in the EFI boot stub to close the pre-IOMMU DMA window. The IOMMU is required for safe PCI passthrough and is relied on by KVM/VFIO; it is harmless to amdgpu/KMS, suspend, and wifi. Append to the kernel command line, which is BOOTLOADER-SPECIFIC \u2014 confirm whether this host uses /etc/kernel/cmdline (UKI/mkinitcpio), /boot/loader/entries/*.conf (systemd-boot), or GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub before applying, and regenerate the boot artifact afterwards."
      sources: ["madaidans:physical-access (DMA attacks)", "kernel.org kernel-parameters (admin-guide)", "Arch Wiki Security (wiki.archlinux.org/title/Security)", "PrivacyGuides (privacyguides.org)"]
      risk: "medium"
      breaks: ["Kernel-cmdline path is bootloader-specific: /etc/kernel/cmdline (UKI/mkinitcpio, requires 'mkinitcpio -P' after), /boot/loader/entries/*.conf (systemd-boot), or GRUB_CMDLINE_LINUX_DEFAULT then 'grub-mkconfig -o /boot/grub/grub.cfg'. Verify which this UEFI host uses; appending to a file the bootloader does not read is a silent no-op.", "'amd_iommu=force_isolation' adds minor overhead and can rarely expose buggy device firmware; if a peripheral misbehaves, drop force_isolation but keep 'efi=disable_early_pci_dma'.", "Does NOT harm amdgpu/KMS, suspend, wifi, or the KVM virtio-gpu/virtiofs VM (KVM relies on the IOMMU)."]
      enabled: true
      apply:
        - !Append
          path: "/etc/kernel/cmdline"
          content: "amd_iommu=force_isolation iommu=force efi=disable_early_pci_dma"
      verify: "grep -q amd_iommu /proc/cmdline (after reboot); kernel ring buffer should show 'AMD-Vi' / IOMMU initialization (journalctl -kb)"
      revert: "Remove 'amd_iommu=force_isolation iommu=force efi=disable_early_pci_dma' from the kernel command line and rebuild the boot artifact (mkinitcpio -P for UKI, or update the systemd-boot/GRUB entry)."
  - !NoCon
    value:
      id: "blacklist-dma-peripheral-modules"
      title: "Blacklist FireWire/Thunderbolt DMA-capable peripheral modules"
      category: "modules"
      rationale: "madaidans 'Physical attacks': FireWire and Thunderbolt are classic DMA attack vectors (full memory read/write over the bus). This host has no legacy FireWire and untrusted GUI apps run inside the Alpine VM, so the host needs no FireWire or external Thunderbolt device support; disabling the drivers removes the DMA surface as defense-in-depth alongside the IOMMU. Uses 'install ... /bin/false' (madaidans' form) so the modules cannot be auto- or manually loaded. Lands in its own /etc/modprobe.d file to avoid clobbering the existing 99-hardening-blacklist.conf."
      sources: ["madaidans:physical-access (DMA attacks / module blacklisting)", "Arch Wiki Security (wiki.archlinux.org/title/Security)", "secureblue"]
      risk: "medium"
      breaks: ["If this machine ever uses a Thunderbolt dock / external Thunderbolt GPU / Thunderbolt-attached storage or display, those stop working - remove the 'thunderbolt' line in that case.", "Does NOT affect amdgpu (PCIe-internal), USB-C DisplayPort alt-mode (handled by USB/DP, not the thunderbolt driver), wifi, or the KVM VM."]
      enabled: true
      apply:
        - !Write
          path: "/etc/modprobe.d/99-dma-peripheral-blacklist.conf"
          content: "# Disable DMA-capable legacy/external buses (FireWire, Thunderbolt) - madaidans physical hardening\ninstall firewire-core /bin/false\ninstall firewire-ohci /bin/false\ninstall firewire-sbp2 /bin/false\ninstall ohci1394 /bin/false\ninstall sbp2 /bin/false\ninstall thunderbolt /bin/false\n"
      verify: "grep -q thunderbolt /etc/modprobe.d/99-dma-peripheral-blacklist.conf"
      revert: "rm -f /etc/modprobe.d/99-dma-peripheral-blacklist.conf and rebuild initramfs (mkinitcpio -P) only if these modules were present in the image."
  - !NoCon
    value:
      id: "lock-on-lid-and-suspend"
      title: "Lock screen on lid close and before suspend (physical access)"
      category: "systemd"
      rationale: "Physical-access complement to USBGuard: an unlocked, suspended laptop is the easiest peripheral/cold-boot/Evil-Maid target. systemd-logind HandleLidSwitch=suspend ensures the lid suspends; a system-sleep 'pre' hook running 'loginctl lock-sessions' locks sessions before RAM is suspended so an attacker opening the lid faces a lock screen. Pairs with disk encryption (RAM still holds keys while suspended, so USBGuard + IOMMU stay relevant). logind drop-ins go in /etc/systemd/logind.conf.d/ (correct admin path). The sleep hook must live in /usr/lib/systemd/system-sleep/ \u2014 that is the ONLY directory systemd scans for sleep hooks (there is no /etc equivalent); systemd only removes its OWN files there on upgrade, so a distinctively named admin script persists. No impact on amdgpu/suspend correctness, wifi, or the VM."
      sources: ["Arch Wiki Security (wiki.archlinux.org/title/Security)", "systemd-sleep(8) / logind.conf(5)", "PrivacyGuides (privacyguides.org)", "madaidans:physical-access"]
      risk: "low"
      breaks: ["'loginctl lock-sessions' only locks sessions that registered a locker (a Wayland compositor lock or an X locker via xss-lock must be installed and running); a session with no locker suspends WITHOUT a visible lock screen.", "Restarting systemd-logind can momentarily disrupt the active graphical session in some setups; otherwise safe. Does not affect the KVM VM.", "The hook lives in /usr/lib/systemd/system-sleep/ (systemd's only scan dir); a future systemd release that changes hook discovery could require relocation."]
      enabled: true
      apply:
        - !Command
          command: "install -d -m0755 /etc/systemd/logind.conf.d"
          parallel: false
        - !Write
          path: "/etc/systemd/logind.conf.d/10-lid-lock.conf"
          content: "[Login]\nHandleLidSwitch=suspend\nHandleLidSwitchExternalPower=suspend\nHandleLidSwitchDocked=suspend\nLidSwitchIgnoreInhibited=no\n"
        - !Write
          path: "/usr/lib/systemd/system-sleep/00-lock-sessions"
          content: "#!/bin/sh\ncase \"$1\" in\n  pre) /usr/bin/loginctl lock-sessions ;;\nesac\n"
        - !Command
          command: "chmod 0755 /usr/lib/systemd/system-sleep/00-lock-sessions"
          parallel: false
        - !Command
          command: "systemctl restart systemd-logind.service"
          parallel: false
      verify: "test -x /usr/lib/systemd/system-sleep/00-lock-sessions"
      revert: "rm -f /etc/systemd/logind.conf.d/10-lid-lock.conf /usr/lib/systemd/system-sleep/00-lock-sessions and restart systemd-logind.service."
vm:
  name: "{{vmname}}"
  connection: "qemu:///system"
  memory_mib: 4096
  vcpus: 4
  gpu: "venus+virgl"
  shared_dirs:
    -
      host_path: "{{vmshare_host}}"
      tag: "hostshare"
      guest_mount: "/mnt/hostshare"
  guest_packages: ["mesa", "mesa-dri-gallium", "mesa-gbm", "mesa-egl", "mesa-gl", "mesa-gles", "mesa-vulkan-virtio", "mesa-vulkan-swrast", "vulkan-loader", "vulkan-tools", "mesa-utils", "wayland", "cage", "sway", "swaybg", "foot", "seatd", "seatd-openrc", "dbus", "dbus-openrc", "eudev", "eudev-openrc", "polkit", "flatpak", "bubblewrap", "xdg-desktop-portal", "xdg-desktop-portal-wlr", "xdg-desktop-portal-gtk", "xdg-user-dirs", "font-dejavu", "ca-certificates", "chrony"]
  flatpaks: ["org.mozilla.firefox"]
  artifacts:
    -
      path: "{{vm_xml}}"
      purpose: "libvirt domain (q35/UEFI/virtio-gpu venus+virgl/virtiofs)"
      content: "<!--\n  alpine-vm.xml  -  minimal Alpine guest, qemu:///system (rootful), AMD host + KVM.\n  Define:  virsh --connect qemu:///system define /etc/libvirt/qemu/alpine-vm.xml\n  NOTE: the top-level <domain> element MUST carry the qemu namespace\n        (xmlns:qemu) so the <qemu:commandline> venus override at the bottom\n        is accepted. Editing via 'virsh edit' preserves it.\n-->\n<domain type=\"kvm\" xmlns:qemu=\"http://libvirt.org/schemas/domain/qemu/1.0\">\n  <name>{{vmname}}</name>\n  <memory unit=\"GiB\">4</memory>\n  <currentMemory unit=\"GiB\">4</currentMemory>\n\n  <!-- REQUIRED for virtiofs + venus host blob: shared memfd backing.\n       Without source type=memfd + access mode=shared, virtiofsd refuses to\n       start and venus blob resources will not map. -->\n  <memoryBacking>\n    <source type=\"memfd\"/>\n    <access mode=\"shared\"/>\n  </memoryBacking>\n\n  <vcpu placement=\"static\">4</vcpu>\n\n  <os firmware=\"efi\">\n    <type arch=\"x86_64\" machine=\"q35\">hvm</type>\n    <!-- Arch edk2-ovmf, 4MB split firmware (default since 202402).\n         If you prefer explicit paths over firmware=\"efi\" autoselect,\n         replace the <os> block with the explicit-loader variant in notes. -->\n    <loader readonly=\"yes\" secure=\"no\" type=\"pflash\" format=\"raw\">/usr/share/edk2/x64/OVMF_CODE.4m.fd</loader>\n    <nvram template=\"/usr/share/edk2/x64/OVMF_VARS.4m.fd\" format=\"raw\">/var/lib/libvirt/qemu/nvram/{{vmname}}_VARS.fd</nvram>\n    <boot dev=\"hd\"/>\n  </os>\n\n  <features>\n    <acpi/>\n    <apic/>\n  </features>\n\n  <!-- AMD Barcelo: expose all host CPU features incl. svm-related to guest. -->\n  <cpu mode=\"host-passthrough\" check=\"none\" migratable=\"off\"/>\n\n  <clock offset=\"utc\">\n    <timer name=\"rtc\" tickpolicy=\"catchup\"/>\n    <timer name=\"pit\" tickpolicy=\"delay\"/>\n    <timer name=\"hpet\" present=\"no\"/>\n  </clock>\n\n  <on_poweroff>destroy</on_poweroff>\n  <on_reboot>restart</on_reboot>\n  <on_crash>destroy</on_crash>\n\n  <pm>\n    <suspend-to-mem enabled=\"no\"/>\n    <suspend-to-disk enabled=\"no\"/>\n  </pm>\n\n  <devices>\n    <emulator>/usr/bin/qemu-system-x86_64</emulator>\n\n    <!-- virtio qcow2 root disk -->\n    <disk type=\"file\" device=\"disk\">\n      <driver name=\"qemu\" type=\"qcow2\" cache=\"none\" io=\"native\" discard=\"unmap\"/>\n      <source file=\"{{vm_disk}}\"/>\n      <target dev=\"vda\" bus=\"virtio\"/>\n      <address type=\"pci\" domain=\"0x0000\" bus=\"0x04\" slot=\"0x00\" function=\"0x0\"/>\n    </disk>\n\n    <!-- virtio NIC on the default NAT network (virbr0) -->\n    <interface type=\"network\">\n      <source network=\"default\"/>\n      <model type=\"virtio\"/>\n      <address type=\"pci\" domain=\"0x0000\" bus=\"0x01\" slot=\"0x00\" function=\"0x0\"/>\n    </interface>\n\n    <!-- virtiofs share: host dir exposed to guest as mount tag 'hostshare'.\n         Requires the memfd/shared memoryBacking above. -->\n    <filesystem type=\"mount\" accessmode=\"passthrough\">\n      <driver type=\"virtiofs\" queue=\"1024\"/>\n      <binary path=\"/usr/lib/virtiofsd\"/>\n      <source dir=\"{{vmshare_host}}\"/>\n      <target dir=\"hostshare\"/>\n      <address type=\"pci\" domain=\"0x0000\" bus=\"0x05\" slot=\"0x00\" function=\"0x0\"/>\n    </filesystem>\n\n    <!-- virtio-serial channel for the qemu guest agent -->\n    <controller type=\"virtio-serial\" index=\"0\">\n      <address type=\"pci\" domain=\"0x0000\" bus=\"0x02\" slot=\"0x00\" function=\"0x0\"/>\n    </controller>\n    <channel type=\"unix\">\n      <target type=\"virtio\" name=\"org.qemu.guest_agent.0\"/>\n      <address type=\"virtio-serial\" controller=\"0\" bus=\"0\" port=\"1\"/>\n    </channel>\n\n    <!-- SPICE agent channel (clipboard / dynamic resolution via spice-vdagent) -->\n    <channel type=\"spicevmc\">\n      <target type=\"virtio\" name=\"com.redhat.spice.0\"/>\n      <address type=\"virtio-serial\" controller=\"0\" bus=\"0\" port=\"2\"/>\n    </channel>\n\n    <!-- virtio-gpu with 3D acceleration. accel3d=yes selects virtio-gpu-gl.\n         The libvirt schema does not yet expose 'venus', so virgl/GL is on by\n         default here and venus(Vulkan) is forced on via the qemu:commandline\n         override at the bottom of the file. -->\n    <video>\n      <model type=\"virtio\" heads=\"1\" primary=\"yes\">\n        <acceleration accel3d=\"yes\"/>\n      </model>\n      <address type=\"pci\" domain=\"0x0000\" bus=\"0x03\" slot=\"0x00\" function=\"0x0\"/>\n    </video>\n\n    <!-- SPICE display with host GL passthrough via the amdgpu render node.\n         listen type=none is REQUIRED when <gl enable=yes> is used (local GL,\n         no TCP listener). Connect with: virt-viewer / remote-viewer. -->\n    <graphics type=\"spice\">\n      <listen type=\"none\"/>\n      <gl enable=\"yes\" rendernode=\"{{rendernode}}\"/>\n    </graphics>\n\n    <!-- input -->\n    <input type=\"keyboard\" bus=\"virtio\"/>\n    <input type=\"tablet\" bus=\"virtio\"/>\n\n    <!-- entropy -->\n    <rng model=\"virtio\">\n      <backend model=\"random\">/dev/urandom</backend>\n    </rng>\n\n    <!-- no legacy devices: no usb redir, no sound, no parallel/serial,\n         no floppy, no PS/2 emulation beyond q35 defaults. -->\n    <memballoon model=\"none\"/>\n  </devices>\n\n  <!-- ============================================================\n       venus(Vulkan) override. libvirt builds the GL video device as\n       'virtio-gpu-gl' from accel3d=yes; we append the venus/blob/hostmem\n       properties QEMU needs for the Venus protocol. The id MUST match the\n       device libvirt generates (video0). Verify the id with:\n         virsh --connect qemu:///system dumpxml alpine-vm   (then check the\n         generated -device line via 'virsh qemu-monitor-command').\n       hostmem sizes the host visible memory window for blob resources.\n       ============================================================ -->\n  <qemu:commandline>\n    <qemu:arg value=\"-set\"/>\n    <qemu:arg value=\"device.video0.blob=on\"/>\n    <qemu:arg value=\"-set\"/>\n    <qemu:arg value=\"device.video0.venus=on\"/>\n    <qemu:arg value=\"-set\"/>\n    <qemu:arg value=\"device.video0.hostmem=8G\"/>\n  </qemu:commandline>\n</domain>\n"
    -
      path: "/etc/modules-load.d/konkrit-virtio-gpu.conf"
      purpose: "HOST: udmabuf+vhost_net for venus blob"
      content: "# Required for virtio-gpu blob resources (Venus/Vulkan) \u2014 QEMU needs /dev/udmabuf.\nudmabuf\n# vhost-net acceleration for the virtio NIC (optional but recommended).\nvhost_net\n"
    -
      path: "{{vmshare_host}}/answerfile"
      purpose: "GUEST: setup-alpine unattended answerfile"
      content: "# Alpine unattended install answerfile (sys install to /dev/vda).\n# Usage on the booted virt ISO:\n#   ERASE_DISKS=/dev/vda setup-alpine -e -f /srv/provision/answerfile\n#   reboot\n# -e = empty root password allowed during automation (set a real one in provision.sh).\n\nKEYMAPOPTS=\"us us\"\nHOSTNAMEOPTS=alpine-gui\n\n# Device manager: udev is required for seatd/libinput/DRM hotplug in a GUI guest.\nDEVDOPTS=udev\n\nINTERFACESOPTS=\"auto lo\niface lo inet loopback\n\nauto eth0\niface eth0 inet dhcp\n    hostname alpine-gui\n\"\n\nDNSOPTS=\"-d localdomain 1.1.1.1 9.9.9.9\"\nTIMEZONEOPTS=\"UTC\"\nPROXYOPTS=none\n\n# Main + community at install time so flatpak/cage/sway resolve later.\nAPKREPOSOPTS=\"-1 -c\"\n\n# Non-root user; member of the groups a Wayland/seatd GUI needs.\nUSEROPTS=\"-a -g audio,video,input,seat,netdev kiosk\"\n# USERSSHKEY=\"ssh-ed25519 AAAA... kiosk@host\"   # optional\n\nSSHDOPTS=openssh\nNTPOPTS=chrony\n\n# Full on-disk system install (not diskless/data). Pairs with ERASE_DISKS=/dev/vda.\nDISKOPTS=\"-m sys /dev/vda\"\n\nLBUOPTS=none\nAPKCACHEOPTS=none\n"
    -
      path: "{{vmshare_host}}/provision.sh"
      purpose: "GUEST: in-guest provisioning (apk, flathub, services, userns, autologin)"
      content: "#!/bin/sh\n# Run as root inside the installed Alpine guest:  sh provision.sh\nset -eu\n\nKIOSK_USER=kiosk\nFLATPAK_APP=org.mozilla.firefox    # change to the app you want autostarted\n\n# --- 1. Repositories: enable community (main is already on) -----------------\nREL=$(cut -d. -f1,2 /etc/alpine-release)\ncat > /etc/apk/repositories <<EOF\nhttps://dl-cdn.alpinelinux.org/alpine/v${REL}/main\nhttps://dl-cdn.alpinelinux.org/alpine/v${REL}/community\nEOF\napk update\n\n# --- 2. Packages -----------------------------------------------------------\n# seat/session/bus + udev\napk add dbus dbus-openrc seatd seatd-openrc eudev eudev-openrc polkit\n# mesa: virgl GL driver (mesa-dri-gallium -> virtio_gpu_dri.so),\n#       Venus Vulkan (mesa-vulkan-virtio), Lavapipe SW fallback (mesa-vulkan-swrast)\napk add mesa mesa-dri-gallium mesa-gbm mesa-egl mesa-gl mesa-gles \\\n        mesa-vulkan-virtio mesa-vulkan-swrast vulkan-loader \\\n        mesa-utils vulkan-tools\n# Wayland compositors + a terminal\napk add wayland cage sway swaybg foot\n# portals (wlr backend for screenshot/screencast on wlroots, gtk for file chooser)\napk add xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk \\\n        xdg-utils xdg-user-dirs\n# flatpak + sandbox + fonts/certs\napk add flatpak bubblewrap font-dejavu ca-certificates\nupdate-ca-certificates || true\n\n# --- 3. Guest user namespaces (the inverse of the hardened HOST) ------------\n# Alpine bwrap is NON-setuid (0755), so flatpak needs unprivileged userns.\ncat > /etc/sysctl.d/00-userns.conf <<'EOF'\n# GUEST ONLY: flatpak/bwrap require unprivileged user namespaces.\nuser.max_user_namespaces = 28633\nEOF\n# Apply now if sysctl service is present; harmless if not yet.\nsysctl -p /etc/sysctl.d/00-userns.conf 2>/dev/null || true\n# Confirm kernel support (Alpine linux-virt/linux-lts ship CONFIG_USER_NS=y):\nzgrep -q 'CONFIG_USER_NS=y' /proc/config.gz 2>/dev/null && echo 'CONFIG_USER_NS=y OK' || true\n\n# --- 4. Enable OpenRC services --------------------------------------------\nrc-update add udev sysinit 2>/dev/null || rc-update add udev boot\nrc-update add udev-trigger sysinit 2>/dev/null || true\nrc-update add udev-settle sysinit 2>/dev/null || true\nrc-update add dbus default\nrc-update add seatd default\nrc-update add sysctl boot 2>/dev/null || true\nrc-service dbus start || true\nrc-service seatd start || true\n\n# --- 5. virtiofs share mount ----------------------------------------------\nmkdir -p /mnt/hostshare\n# tag 'hostshare' matches <target dir='hostshare'/> in the domain XML.\ngrep -q '^hostshare' /etc/fstab || \\\n  printf 'hostshare\\t/mnt/hostshare\\tvirtiofs\\trw,noatime,_netdev,nofail\\t0 0\\n' >> /etc/fstab\nmount -t virtiofs hostshare /mnt/hostshare 2>/dev/null || true\n\n# --- 6. Flathub + the Flatpak app -----------------------------------------\nflatpak remote-add --if-not-exists flathub \\\n  https://dl.flathub.org/repo/flathub.flatpakrepo\nflatpak install -y --noninteractive flathub \"$FLATPAK_APP\" || true\n\n# --- 7. Autologin on tty1 (OpenRC/busybox getty via inittab) ---------------\n# Replace the tty1 line with an autologin agetty for the kiosk user.\nsed -i \"/^tty1::/d\" /etc/inittab\nprintf 'tty1::respawn:/sbin/agetty --autologin %s --noclear tty1 linux\\n' \\\n  \"$KIOSK_USER\" >> /etc/inittab\n\necho 'Provisioning complete. Reboot to autostart the compositor + Flatpak.'\n"
    -
      path: "{{vmshare_host}}/kiosk.profile"
      purpose: "GUEST: kiosk user .profile (cage -> Flatpak, Venus ICD)"
      content: "# ~/.profile for the autologin kiosk user (OpenRC + seatd, no logind).\n# Runs only on the real console (tty1); avoids recursion on ssh/other ttys.\n\nif [ -z \"${WAYLAND_DISPLAY:-}\" ] && [ \"$(tty)\" = \"/dev/tty1\" ]; then\n  # seatd provides no logind, so create XDG_RUNTIME_DIR ourselves.\n  export XDG_RUNTIME_DIR=\"/run/user/$(id -u)\"\n  if [ ! -d \"$XDG_RUNTIME_DIR\" ]; then\n    mkdir -p \"$XDG_RUNTIME_DIR\"\n    chmod 0700 \"$XDG_RUNTIME_DIR\"\n  fi\n\n  # --- virtio-gpu rendering selection ---\n  # GL: force the virgl/virtio Gallium driver (virtio_gpu_dri.so from mesa-dri-gallium).\n  export MESA_LOADER_DRIVER_OVERRIDE=virtio_gpu\n  export GALLIUM_DRIVER=virpipe          # virgl pipe over virtio-gpu\n  # Wayland/EGL hints\n  export XDG_SESSION_TYPE=wayland\n  export MOZ_ENABLE_WAYLAND=1            # makes the Firefox Flatpak go native-Wayland\n  export GDK_BACKEND=wayland\n  export QT_QPA_PLATFORM=wayland\n  # Vulkan: prefer the Venus virtio ICD (mesa-vulkan-virtio). If Venus is broken,\n  # comment the next line and Lavapipe (mesa-vulkan-swrast) is used automatically.\n  if [ -f /usr/share/vulkan/icd.d/virtio_icd.x86_64.json ]; then\n    export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/virtio_icd.x86_64.json\n  fi\n\n  # --- launch the kiosk: cage runs a single Flatpak full-screen ---\n  # cage execs its child; when the app exits, the session ends (then agetty respawns).\n  exec cage -- flatpak run org.mozilla.firefox\n\n  # To run MULTIPLE Flatpak windows instead, replace the line above with:\n  #   exec sway\n  # and create ~/.config/sway/config with `exec flatpak run <app>` lines.\nfi\n"
    -
      path: "{{vmshare_host}}/modules-load-virtiofs.conf"
      purpose: "GUEST: preload virtiofs+fuse"
      content: "# Preload virtiofs so /etc/fstab virtiofs mounts succeed at boot.\n# virtiofs depends on fuse; fuse is pulled in automatically as a dep,\n# but list both to be explicit on the minimal linux-virt kernel.\nfuse\nvirtiofs\n"
    -
      path: "{{vmshare_host}}/konkrit-flatpak.NOTES"
      purpose: "operator instructions"
      content: "konkrit Flatpak VM \u2014 operator notes (agent-verified design)\n==========================================================\n\nkonkrit (host, as root) has: installed host packages, loaded udmabuf/vhost_net,\nenabled libvirtd, added you to libvirt+kvm groups, written the domain XML\n({{vm_xml}}), created the qcow2 ({{vm_disk}}) and the share ({{vmshare_host}}),\nfetched the Alpine ISO, and defined the '{{vmname}}' domain.\n\nONE-TIME GUEST INSTALL (the only manual part):\n  1. virsh --connect qemu:///system start {{vmname}}\n     virt-viewer --connect qemu:///system {{vmname}}\n  2. At the Alpine 'virt' ISO login (root, empty pw), bring up the share + install:\n       mount -t virtiofs hostshare /mnt 2>/dev/null || (modprobe virtiofs; mount -t virtiofs hostshare /mnt)\n       ERASE_DISKS=/dev/vda setup-alpine -e -f /mnt/answerfile\n       reboot     # then detach the cdrom or set boot order to hd\n  3. Log in as root, re-mount the share, run provisioning:\n       mount -t virtiofs hostshare /mnt\n       cp /mnt/modules-load-virtiofs.conf /etc/modules-load.d/virtiofs.conf\n       sh /mnt/provision.sh\n       install -o kiosk -g kiosk -m 0644 /mnt/kiosk.profile /home/kiosk/.profile\n       reboot     # autologs in as 'kiosk' and launches Firefox via cage\n\nGPU\n  - The domain enables Virgl (OpenGL) natively (accel3d=yes + SPICE gl). Venus\n    (Vulkan) is forced on by the <qemu:commandline> override (libvirt has no\n    native venus knob). Host needs virglrenderer >= 1.0 with venus (Arch's\n    'virglrenderer' has it) and the udmabuf module (konkrit loads it).\n  - Guest Venus ICD = the 'mesa-vulkan-virtio' apk (installed by provision.sh).\n    Test in-guest: 'vulkaninfo --summary' should show 'Virtio-GPU Venus';\n    'glxinfo -B' should show a virgl renderer.\n  - Confirm the qemu:commandline device id is 'video0':\n      virsh --connect qemu:///system dumpxml {{vmname}}\n  - rendernode is set to {{rendernode}}; if SPICE-gl fails, find the right node\n    with: ls -l /dev/dri/by-path/  (match your amdgpu PCI address).\n\nWHY A VM: the host disables unprivileged user namespaces (secureblue style),\nwhich would break host Flatpak/bwrap. The guest re-enables userns\n(provision.sh writes /etc/sysctl.d/00-userns.conf), so you keep the hardened\nhost and still get sandboxed, GPU-accelerated GUI apps. Files cross via the\nvirtiofs share at /mnt/hostshare in the guest.\n"
  setup:
    - !Command
      command: "emerge --noreplace --quiet app-emulation/qemu app-emulation/libvirt sys-firmware/edk2-ovmf app-emulation/virtiofsd net-dns/dnsmasq app-crypt/swtpm media-libs/virglrenderer media-libs/mesa media-libs/vulkan-loader dev-util/vulkan-tools net-misc/spice-gtk app-emulation/virt-viewer"
      parallel: false
    - !Command
      command: "modprobe udmabuf"
      parallel: false
    - !Command
      command: "modprobe vhost_net"
      parallel: false
    - !Command
      command: "systemctl enable --now libvirtd.socket"
      parallel: false
    - !Command
      command: "usermod -aG libvirt,kvm {{user}}"
      parallel: false
    - !Command
      command: "install -d -m 0755 -o {{user}} -g {{user}} {{vmshare_host}}"
      parallel: false
    - !Command
      command: "qemu-img create -f qcow2 {{vm_disk}} 20G"
      parallel: false
    - !Command
      command: "curl -L -o {{alpine_iso}} {{alpine_iso_url}}"
      parallel: false
    - !Command
      command: "virsh --connect qemu:///system net-autostart default"
      parallel: false
    - !Command
      command: "virsh --connect qemu:///system net-start default"
      parallel: false
    - !Command
      command: "virsh --connect qemu:///system define {{vm_xml}}"
      parallel: false
