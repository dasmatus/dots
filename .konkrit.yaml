      id: "chrony-nts-secure-time"
      title: "NTS-secured time sync with chrony (replace unauthenticated systemd-timesyncd)"
      category: "dns-time-net"
      rationale: "Plain NTP is unencrypted and unauthenticated, so an on-path attacker can trivially modify the clock and, e.g., break certificate validity windows (madaidans Linux hardening). chrony 4.x supports Network Time Security (NTS), which authenticates the time source via a TLS handshake; using multiple NTS providers with cookie persistence (ntsdumpdir) gives cryptographically authenticated, redundant time (Cloudflare Time Services; Arch Wiki Chrony; PrivacyGuides). On Arch the chrony config lives at /etc/chrony.conf and the service is chronyd.service."
      sources: ["madaidans-insecurities.github.io/guides/linux-hardening.html", "Arch Wiki Chrony (wiki.archlinux.org/title/Chrony)", "Cloudflare Time Services NTS (developers.cloudflare.com/time-services/nts)", "PrivacyGuides (privacyguides.org)", "chrony.conf(5) (man.archlinux.org/man/chrony.conf.5.en)"]
      risk: "medium"
      breaks: ["NTS requires outbound TCP 4460 (NTS-KE) and UDP 123 (NTP); a firewall that only allows 123 will block NTS key establishment.", "If every NTS provider is unreachable (e.g. behind a captive portal before time-dependent TLS works) the clock can stay unset; chrony keeps retrying.", "Disabling systemd-timesyncd is required so two time daemons do not fight; do not re-enable it. Full revert should also re-enable timesyncd if no other time source is wanted.", "Does not affect the VM (guest gets time via its own NTP/NTS or kvm-clock), nor amdgpu/suspend/wifi-link/KVM/virtio-gpu/virtiofs."]
      enabled: true
      apply:
        - !Command
          command: "emerge --noreplace --quiet net-misc/chrony"
          parallel: false
        - !Write
          path: "/etc/chrony.conf"
          content: "# NTS-authenticated time sources (multiple providers for redundancy).\nserver time.cloudflare.com iburst nts\nserver nts.netnod.se iburst nts\nserver ptbtime1.ptb.de iburst nts\nserver ntppool1.time.nl iburst nts\n\n# Persist NTS cookies/keys across reboots so startup does not fall back to NTP.\nntsdumpdir /var/lib/chrony\n\n# Require agreement among multiple sources before stepping/slewing.\nminsources 2\n\n# Allow a large initial correction on the first 3 updates, then only slew.\nmakestep 1.0 3\n\ndriftfile /var/lib/chrony/drift\nrtcsync\nleapsectz right/UTC\n# Do not act as a server or allow remote command access.\nport 0\ncmdport 0\n"
        - !Command
          command: "systemctl disable --now systemd-timesyncd.service"
          parallel: false
        - !Command
          command: "systemctl enable --now chronyd.service"
          parallel: false
