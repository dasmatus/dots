  - !NoCon
    value:
      id: "iommu-amd-on-strict"
      title: "Enable AMD IOMMU strictly (amd_iommu=force_enable iommu=force iommu.passthrough=0 iommu.strict=1 efi=disable_early_pci_dma)"
      category: "boot-params"
      rationale: "Keeping AMD-Vi enabled is mandatory for safe DMA and for VFIO/KVM passthrough and must not be disabled. The kernel auto-enables AMD-Vi when the BIOS does; 'amd_iommu=force_enable' forces the AMD IOMMU driver on even if firmware tables are imperfect, and 'iommu=force' forces IOMMU use; iommu.passthrough=0 forces DMA translation rather than bypass; iommu.strict=1 synchronously invalidates IOMMU TLBs so devices never read stale mappings; efi=disable_early_pci_dma clears PCI busmaster bits in the EFI stub to block boot-window DMA before the kernel programs the IOMMU. IOMMU being ON HELPS the KVM/virtio VM. Note: 'amd_iommu=on' (in the original) is an INVALID token and was replaced with 'amd_iommu=force_enable'."
      sources: ["kernel.org admin-guide kernel-parameters (valid amd_iommu values: off/force_enable/force_isolation/pgtbl_v1/pgtbl_v2 - 'on' is NOT valid)", "secureblue kargs (iommu=force, iommu.passthrough=0, iommu.strict=1; efi=disable_early_pci_dma in unstable set)", "KSPP Recommended_Settings (iommu.passthrough=0, iommu.strict=1)", "Arch Wiki PCI passthrough via OVMF (AMD IOMMU enablement)"]
      risk: "low"
      breaks: ["efi=disable_early_pci_dma can, on rare firmware, drop a boot-critical device that does early DMA (some NVMe/Thunderbolt). If boot or a disk disappears, remove that single token from /etc/cmdline.d/31-iommu.conf and rerun mkinitcpio -P. This token is in secureblue's UNSTABLE set for that reason."]
      enabled: true
      apply:
        - !Write
          path: "/etc/kernel/cmdline.d/31-iommu.conf"
          content: "amd_iommu=force_enable iommu=force iommu.passthrough=0 iommu.strict=1 efi=disable_early_pci_dma\n"
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "dmesg | grep -q AMD-Vi"
      revert: "Remove /etc/cmdline.d/31-iommu.conf and run 'mkinitcpio -P' to regenerate the UKI"
  - !NoCon
    value:
      id: "cpu-mitigations-auto-nosmt"
      title: "Enable all CPU mitigations and disable SMT (mitigations=auto,nosmt + AMD spectre/SSB/GDS)"
      category: "cpu-mitigations"
      rationale: "mitigations=auto,nosmt enables every applicable CPU vulnerability mitigation and disables SMT, required to fully close cross-thread leaks (MDS-class, GDS, Spectre-BHB). spectre_v2=on and spec_store_bypass_disable=on + ssbd=force-on force Spectre-v2 and SSB mitigations on; gather_data_sampling=force covers GDS/Downfall (inert on this AMD CPU but harmless). secureblue maximal default. Safe for amdgpu/suspend/wifi/KVM. nosmt roughly halves hardware threads (real perf cost, fewer effective vCPUs for the VM) but does not break the VM. Note: there is no 'mitigations=on'; 'auto' is the correct strong value."
      sources: ["secureblue kargs (mitigations=auto,nosmt, spectre_v2=on, spec_store_bypass_disable=on, ssbd=force-on, gather_data_sampling=force)", "KSPP Recommended_Settings (mitigations=auto,nosmt)", "kernel.org admin-guide (mitigations accepts only auto/off; auto is the mitigated default)", "madaidans:linux-hardening (CPU mitigations)"]
      risk: "medium"
      breaks: ["nosmt disables SMT: ~30-50% fewer threads, slower parallel/compile and fewer effective vCPUs for the KVM guest (functionality intact, throughput reduced)."]
      enabled: true
      apply:
        - !Write
          path: "/etc/kernel/cmdline.d/32-cpu-mitigations.conf"
          content: "mitigations=auto,nosmt spectre_v2=on spec_store_bypass_disable=on ssbd=force-on gather_data_sampling=force\n"
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "grep -q mitigations=auto,nosmt /proc/cmdline"
      revert: "Edit /etc/cmdline.d/32-cpu-mitigations.conf to drop ',nosmt' (use mitigations=auto) or delete the file, then run 'mkinitcpio -P'"
  - !NoCon
    value:
      id: "lockdown-confidentiality"
      title: "Kernel lockdown in confidentiality mode (lockdown=confidentiality, replacing the host's existing lockdown=integrity)"
      category: "boot-params"
      rationale: "The lockdown LSM in confidentiality mode (strictest) removes userspace-to-kernel escalation and kernel-memory-extraction paths: blocks /dev/mem, /dev/kmem, /dev/port, raw MSR writes, kexec of unsigned images, kernel-memory-reading BPF, and unsigned module loading. It does NOT block amdgpu firmware loading or suspend-to-RAM/s2idle, so suspend/resume on this Barcelo box is unaffected, and it does not impede KVM/QEMU/virtio-gpu/virtiofs. It DOES block unencrypted hibernation and low-level tools (flashrom, direct MSR/IO). NOTE: this host's /etc/kernel/cmdline already sets lockdown=integrity; this item UPGRADES it to confidentiality and the old integrity token must be removed to avoid a duplicate lockdown= token."
      sources: ["madaidans:linux-hardening (lockdown=confidentiality)", "secureblue kargs (lockdown=confidentiality, default)", "kernel_lockdown(7) / Red Hat (confidentiality mode blocks /dev/mem, kexec, unsigned modules, unencrypted hibernation)"]
      risk: "medium"
      breaks: ["Unencrypted hibernation (suspend-to-disk) is disabled; suspend-to-RAM is fine.", "Tools needing raw kernel access break: flashrom/BIOS flashing, /dev/mem or MSR access, loading unsigned out-of-tree modules, kexec of unsigned kernels, some perf/eBPF kernel-memory reads."]
      enabled: true
      apply:
        - !Command
          command: "sed -i s/ lockdown=integrity//;s/lockdown=integrity //;s/lockdown=integrity// /etc/cmdline.d/00-base.conf"
          parallel: false
        - !Write
          path: "/etc/kernel/cmdline.d/33-lockdown.conf"
          content: "lockdown=confidentiality\n"
        - !Command
          command: "rebuild-uki"
          parallel: false
      verify: "grep -qE '\\[confidentiality\\]' /sys/kernel/security/lockdown"
      revert: "Remove /etc/cmdline.d/33-lockdown.conf (optionally restore lockdown=integrity in 00-base.conf) and run 'mkinitcpio -P'"
