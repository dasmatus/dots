      category: "sysctl-kernel"
      rationale: "yama.ptrace_scope=2 limits ptrace to root (CAP_SYS_PTRACE), stopping one compromised process from reading/injecting another's memory (credential theft, process-injection pivots). perf_event_paranoid=3 removes the perf_event_open attack surface (historically many LPEs) from unprivileged users. sysrq=4 leaves only the Secure Attention Key, dropping dangerous unprivileged debug keys. All per madaidans/KSPP; safe for GPU/suspend/wifi/VM."
