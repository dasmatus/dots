# libinput-gestures config — i3 touchpad gestures
# Docs: https://github.com/bulletmark/libinput-gestures

gesture swipe right 3 i3-msg workspace next_on_output
gesture swipe left  3 i3-msg workspace prev_on_output
gesture swipe up    3 i3-msg fullscreen toggle
gesture swipe down  3 i3-msg fullscreen toggle

gesture swipe right 4 i3-msg move container to workspace next_on_output; i3-msg workspace next_on_output
gesture swipe left  4 i3-msg move container to workspace prev_on_output; i3-msg workspace prev_on_output
