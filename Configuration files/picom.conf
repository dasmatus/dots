backend = "glx";
vsync = true;
detect-transient = true;
detect-client-leader = true;
xrender-sync-fence = true;

shadow = false;

# Fading — matches Hyprland fade speed (7 units ≈ 350ms)
fading = true;
fade-in-step  = 0.028;
fade-out-step = 0.04;
fade-delta = 4;

active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 0.8;
inactive-opacity-override = false;

blur-method = "dual_kawase";
blur-size = 10;
blur-deviation = 5.0;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

opacity-rule = [
  "95:class_g = 'Alacritty'",
  "90:class_g = 'Polybar'",
  "96:class_g = 'Nitrogen'",
];

corner-radius = 11;

# Window animations — requires pijulius/picom fork
# Approximates Hyprland's: bezier = myBezier, 0.05, 0.9, 0.1, 1.05
#   windows at speed 7, workspaces at speed 6, windowsOut popin 80%
animations = true;
animation-stiffness = 200;
animation-dampening = 22;
animation-mass = 1;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in  = "slide-right";
animation-for-workspace-switch-out = "slide-left";
animation-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];
