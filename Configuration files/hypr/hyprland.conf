################
### MONITORS ###
################

monitor = eDP-1, 1920x1200, 0x0, 1

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = swaybg -m stretch -i /home/matus/Dokumente/gitlab/personal/dots/Wallpapers/night/minimal/stripes_00_1920x1080.png
exec-once = nm-applet --indicator
exec-once = gentoo-pipewire-launcher
exec-once = swayidle -w \
    timeout 300 'swaylock -f -c 000000' \
    timeout 600 'hyprctl dispatch dpms off' \
    resume 'hyprctl dispatch dpms on' \
    before-sleep 'swaylock -f -c 000000'
exec-once = flatpak run org.keepassxc.KeePassXC
exec-once = libinput-gestures-setup start
exec-once = redshift -l 48.15:17.11 -t 4500:3000 -b 0.9:0.75

exec = gsettings set org.gnome.desktop.interface gtk-theme 'Tokyonight-Dark-B'
exec = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec = gsettings set org.gnome.desktop.interface font-name 'Lilex Nerd Font Bold'

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, gtk3
env = MOZ_ENABLE_WAYLAND, 1
env = OBSIDIAN_USE_WAYLAND, 1
env = GDK_BACKEND, wayland,x11

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(9aa5ceff)
    col.inactive_border = rgba(16161dff)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1a1a2ecc)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows,     1, 7, myBezier
    animation = windowsOut,  1, 7, default, popin 80%
    animation = border,      1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade,        1, 7, default
    animation = workspaces,  1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

##############
### INPUT  ###
##############

input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = false
    }
}

####################
### WINDOW RULES ###
####################

windowrulev2 = float, class:^(org.keepassxc.KeePassXC)$
windowrulev2 = workspace special:scratch silent, class:^(org.keepassxc.KeePassXC)$
windowrulev2 = float, class:^(org.flameshot.Flameshot)$
windowrulev2 = float, title:^(nm-connection-editor)$
windowrulev2 = float, class:^(pavucontrol)$

# Fix screen sharing via xwaylandvideobridge
windowrulev2 = opacity 0.0 override 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Terminals and launchers
bind = $mainMod, Return,      exec, alacritty
bind = $mainMod, D,           exec, rofi -show drun -show-icons -theme tokyonight
bind = $mainMod SHIFT, F,     exec, ~/.config/rofi/rofi-files.sh
bind = $mainMod, O,           exec, obsidian -enable-features=UseOzonePlatform -ozone-platform=wayland
bind = $mainMod SHIFT, S,     exec, flatpak run org.flameshot.Flameshot gui

# Window management
bind  = $mainMod, Q,           killactive
bind  = $mainMod SHIFT, Space, togglefloating
bind  = $mainMod, F,           fullscreen, 0
bind  = $mainMod, P,           pseudo
bind  = $mainMod, J,           togglesplit

# KeePassXC scratchpad (mirrors i3 $mod+p)
bind  = $mainMod, minus,       togglespecialworkspace, scratch
bind  = $mainMod SHIFT, minus, movetoworkspace, special:scratch

# Focus: vim keys + arrows
bind = $mainMod, H,     movefocus, l
bind = $mainMod, L,     movefocus, r
bind = $mainMod, K,     movefocus, u
bind = $mainMod, J,     movefocus, d
bind = $mainMod, Left,  movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up,    movefocus, u
bind = $mainMod, Down,  movefocus, d

# Move windows: vim keys + arrows
bind = $mainMod SHIFT, H,     movewindow, l
bind = $mainMod SHIFT, L,     movewindow, r
bind = $mainMod SHIFT, K,     movewindow, u
bind = $mainMod SHIFT, J,     movewindow, d
bind = $mainMod SHIFT, Left,  movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up,    movewindow, u
bind = $mainMod SHIFT, Down,  movewindow, d

# Resize: mod+alt+hjkl
binde = $mainMod ALT, H, resizeactive, -40 0
binde = $mainMod ALT, L, resizeactive,  40 0
binde = $mainMod ALT, K, resizeactive,  0 -40
binde = $mainMod ALT, J, resizeactive,  0  40

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, S,        togglespecialworkspace, magic
bind = $mainMod SHIFT, S,  movetoworkspace, special:magic

# Lock screen
bind = $mainMod ALT, L, exec, swaylock -f -c 000000

# Hyprland reload and exit
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, E, exit

# Media / hardware keys
binde = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp,   exec, light -A 5
binde = , XF86MonBrightnessDown, exec, light -U 5

# Mouse: move/resize by dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
