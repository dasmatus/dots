name: "Publish to Forgejo generic registry"
description: "Upload one file to the repository owner's generic package registry."

inputs:
  file:
    description: "Path to the file to upload."
    required: true
  owner:
    description: "Package owner (typically the repository owner)."
    required: true
  package:
    description: "Generic package name."
    required: true
  version:
    description: "Generic package version."
    required: true
  filename:
    description: "Filename in the package version. Defaults to the file basename."
    required: false
    default: ""
  token:
    description: "Forgejo API token."
    required: true
  token-alt:
    description: "Fallback token when token is empty."
    required: false
    default: ""

outputs:
  url:
    description: "Public package file URL."
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      env:
        IN_FILE: ${{ inputs.file }}
        IN_OWNER: ${{ inputs.owner }}
        IN_PACKAGE: ${{ inputs.package }}
        IN_VERSION: ${{ inputs.version }}
        IN_FILENAME: ${{ inputs.filename }}
        IN_TOKEN: ${{ inputs.token }}
        IN_TOKEN_ALT: ${{ inputs.token-alt }}
      run: |
        set -euo pipefail

        test -f "$IN_FILE" || { echo "::error::no such file: $IN_FILE"; exit 1; }
        command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
        command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }

        TOKEN="${IN_TOKEN:-$IN_TOKEN_ALT}"
        test -n "$TOKEN" || {
          echo "::error::no API token available for package upload"
          exit 1
        }

        name="$IN_FILENAME"
        if [ -z "$name" ]; then
          name="$(basename "$IN_FILE")"
        fi

        urlencode() {
          python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
        }

        owner_enc="$(urlencode "$IN_OWNER")"
        package_enc="$(urlencode "$IN_PACKAGE")"
        version_enc="$(urlencode "$IN_VERSION")"
        name_enc="$(urlencode "$name")"

        url="${GITHUB_SERVER_URL}/api/packages/${owner_enc}/generic/${package_enc}/${version_enc}/${name_enc}"
        resp="$(mktemp)"
        trap 'rm -f "$resp"' EXIT

        code=$(curl -sS -o "$resp" -w '%{http_code}' \
          -X PUT -H "Authorization: token $TOKEN" \
          --upload-file "$IN_FILE" "$url")

        case "$code" in
          200|201)
            echo "published generic package file: $url"
            ;;
          409)
            echo "::error::generic package file already exists at $url; refusing to reuse potentially stale bytes" >&2
            cat "$resp" >&2
            exit 1
            ;;
          *)
            echo "::error::generic package upload failed: HTTP $code" >&2
            cat "$resp" >&2
            exit 1
            ;;
        esac

        echo "url=${url}" >> "$GITHUB_OUTPUT"
