# Codeberg CI — Forgejo Actions (GitHub-Actions-compatible syntax).
#
# Runner: the hosted codeberg-medium runner (4 vCPU / 8 GB). An earlier
# self-hosted runner (medium@actions-tiny.aburayama.m.codeberg.org, chosen
# for its /dev/kvm and no time cap) was retired in 4b7528c — the lanes all
# target the hosted label now. Consequence: no persistent Nix store between
# runs; every job installs Nix fresh.
#
# Nix is installed by DeterminateSystems/nix-installer-action@v22 — the
# idiomatic GitHub-Actions setup, which Forgejo Actions runs unchanged (it
# fetches the action from github.com, same as actions/checkout). The action
# installs Determinate Nix with flakes + nix-command on by default and
# auto-enables KVM when /dev/kvm is present (exports DETERMINATE_NIX_KVM=1).
# The action's `determinate: false` upstream-Nix option was retired
# 2026-01-01, so Determinate Nix is what we get — same `nix` CLI, flakes on.
# Caveat: pinning @v22 does NOT pin the Nix version underneath (the action
# always pulls the newest Determinate Nix Installer), so DetNix behavior
# changes can reach CI silently; see the GC-disable steps below for what
# bitten us once.
#
# Lanes (mirror the retired .gitlab-ci.yml):
#   lint (every push + PR)  flake eval + cheap checks; cargo fmt/clippy/test.
#   vm   (weekly + manual)  the two LiveISO boot oracles (tests/default.nix).
#
# Cold-cache escape hatch: the 1.5 GB ISO closure in vm-boot builds in-job.
# The hosted runner's store does NOT survive between runs, so every weekly
# boot oracle pays the full build — to make it substitute instead of build,
# wire up a binary cache (Cachix/attic) or
# DeterminateSystems/flakehub-cache-action and point the jobs at it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # ~03:57 UTC Mondays (off the :00 mark; see Justfile ethos)
    - cron: "57 3 * * 1"
  workflow_dispatch:

jobs:
  nix-eval:
    name: "nix: flake check + cheap checks"
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v4
      # nix/settings.nix is a tracked symlink to /var/lib/dots/settings.nix
      # (cb4fe5e), written by the first-login dots-clone service on an
      # installed target. A bare CI checkout has no such target, so pure
      # eval dies importing it ("access to absolute path ... is forbidden
      # in pure evaluation mode") for every flake output that touches
      # nixosConfigurations. Materialize the same install-answer defaults
      # the pre-cb4fe5e committed file used to carry, so this stays a real
      # in-tree file for the run — same fix `--impure` gives locally on an
      # installed machine, without weakening the pure-eval check here.
      - name: Materialize nix/settings.nix defaults for a bare checkout
        run: |
          rm -f nix/settings.nix
          cat > nix/settings.nix <<'EOF'
          {
            username = "ci";
            hostname = "tokyonight";
            disks = [ "/dev/nvme0n1" ];
            swapSize = "32G";
            gitName = "CI Runner";
            gitEmail = "ci@localhost.invalid";
          }
          EOF
      # Determinate Nix's determinate-nixd runs automatic background GC by
      # default (targets 30 GB / 5-20% free disk, "urgent" mode below 5%), and
      # its deletion loop never re-checks GC temp roots added while a
      # collection is in flight (DeterminateSystems/nix-src#395; the upstream
      # fix NixOS/nix#15992 merged 2026-06-07 but is not ported to any
      # Determinate Nix release). `flake check` still *builds* this flake's
      # IFD drvs mid-eval (fetchgit aipage source; callCabal2nix abstracttui)
      # — a racing GC pass deletes those freshly instantiated .drv files and
      # the check dies with "error: path '…-aipage-944064e.drv' is not valid",
      # cascading to every dependent check. On the hosted runner's small disk
      # that race fires on ~every run.
      #
      # A post-install "stop the daemon" step (tried 2026-08-24, three runs)
      # still lost the race every time: determinate-nixd's very first boot,
      # during nix-installer-action below, can kick off its initial GC pass
      # before any later step gets a chance to intervene. Writing this config
      # *before* Nix is even installed means the daemon never starts with GC
      # enabled in the first place — no window for an initial pass to exist.
      - name: Pre-seed determinate-nixd config with GC disabled
        run: |
          sudo mkdir -p /etc/determinate 2>/dev/null || mkdir -p /etc/determinate
          echo '{"garbageCollector":{"strategy":"disabled"}}' > /tmp/determinate-config.json
          sudo cp /tmp/determinate-config.json /etc/determinate/config.json 2>/dev/null \
            || cp /tmp/determinate-config.json /etc/determinate/config.json
      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22
      # Second line of defense in case the pre-seeded config above doesn't
      # stick — confirmed 2026-08-24 that config.json correctly reads
      # {"garbageCollector":{"strategy":"disabled"}} both right after
      # install and after a manual re-apply, so a wrong/reset config was
      # never the problem. The systemd-based stop+mask from three earlier
      # attempts was chasing a daemon that was never systemd-managed at
      # all: `systemctl stop` on codeberg-medium fails outright with
      # "System has not been booted with systemd as init system (PID 1).
      # Can't operate." — determinate-nixd runs as a bare background
      # process. A plain `pkill` (SIGTERM, the default) also didn't stick:
      # the same PID was still alive 2s later, which points at it ignoring
      # or deferring SIGTERM — plausible if it was already mid-GC-sweep at
      # that point, the same sweep this whole step exists to prevent. Kill
      # it with SIGKILL, which cannot be deferred or ignored, and loop
      # until `pgrep` actually confirms it's gone rather than trusting a
      # single attempt plus a fixed sleep. The pattern matches
      # `determinate-nixd daemon` specifically, not the bare substring
      # "determinate-nixd": nix-daemon's own cmdline embeds that string via
      # its `--option json-log-path .../determinate-nixd-logger.socket`
      # argument.
      - name: Stop determinate-nixd (nix-src#395 race)
        run: |
          df -h /nix
          echo "--- config.json after install ---"
          cat /etc/determinate/config.json 2>&1 || echo "(missing)"
          echo "--- re-applying GC-disabled config in case the installer reset it ---"
          sudo cp /tmp/determinate-config.json /etc/determinate/config.json 2>/dev/null \
            || cp /tmp/determinate-config.json /etc/determinate/config.json
          cat /etc/determinate/config.json
          echo "--- SIGKILL retry loop, verified ---"
          for attempt in 1 2 3 4 5; do
            if ! pgrep -f 'determinate-nixd daemon' >/dev/null; then
              echo "determinate-nixd confirmed down after $((attempt - 1)) SIGKILL attempts"
              break
            fi
            pgrep -a -f 'determinate-nixd daemon'
            sudo pkill -9 -f 'determinate-nixd daemon' 2>&1 || true
            sleep 2
          done
          pgrep -a -f 'determinate-nixd daemon' && echo "::warning::determinate-nixd survived 5 SIGKILL attempts — likely a different pid namespace" || echo "determinate-nixd is confirmed down"
      # Diagnostic only, not a fix: confirmed 2026-08-24 that killing
      # determinate-nixd (previous step, verified dead before flake check
      # even starts) does NOT stop the "aipage-944064e.drv is not valid"
      # failure — same error, every run, dead daemon or not. That rules out
      # the GC race entirely; every earlier step in this job chased the
      # wrong cause. `nix flake check`'s cascading failure output swallows
      # the real underlying error for whatever breaks first, so build the
      # one IFD-requiring package flake check needs mid-eval in isolation
      # here, with full logs, before flake check's own noisier failure.
      - name: Diagnose the aipage fetch in isolation (not a fix)
        run: |
          echo "--- can this runner reach codeberg.org at all? ---"
          time git ls-remote https://codeberg.org/dasmatus/aipage.git HEAD || echo "[ls-remote failed, see above]"
          echo "--- building .#aipage-firefox alone, full logs ---"
          nix build -L --no-link .#aipage-firefox || echo "[isolated aipage build failed, see above — this is the real error]"
      # Evaluates every output incl. both VM test derivations; builds nothing.
      - run: nix flake check --no-build -L
      # The cheap non-VM checks are worth actually building. Build ALL the
      # eval checks declared in flake/checks.nix so a silent regression in
      # fido-2fa / aipage / formfactor doesn't slip past CI (nix flake check
      # --no-build above only evaluates them, it doesn't build the asserts).
      - run: |
          nix build -L \
            .#checks.x86_64-linux.settings-eval \
            .#checks.x86_64-linux.facter-stub-eval \
            .#checks.x86_64-linux.facter-nvidia-eval \
            .#checks.x86_64-linux.fido-2fa-eval \
            .#checks.x86_64-linux.aipage-eval \
            .#checks.x86_64-linux.formfactor-eval

  rust:
    name: "rust: fmt + clippy + test"
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain on the runner host (replaces the rust:1.97 container;
      # no Docker needed on the self-hosted runner).
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      # Swatinem/rust-cache supports a comma-separated list of workspace roots
      # (Cargo.toml dirs). ask-daemon is a second one: it is the only other
      # crate here whose tests run without a Postgres server or a pgrx
      # toolchain behind them, so it is the only other one this lane can gate.
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/installer-tui
            rust/ask-daemon
      # Lint the Rust crates — matches `nix run .#nix-lint` (flake/apps.nix).
      - run: |
          cd rust/installer-tui
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ../ask-daemon
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  vm-boot:
    name: "vm: ${{ matrix.check }}"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: codeberg-medium
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        check: [iso-boot, limine-install-boot]
    steps:
      - uses: actions/checkout@v4
      # Same determinate-nixd background-GC race as in the nix-eval lane
      # (DeterminateSystems/nix-src#395) — this job realises the same IFD
      # drvs plus a far larger closure, so its exposure window is worse.
      # See the nix-eval job for the full rationale, incl. why this is
      # pre-seeded *before* nix-installer-action rather than stopped after.
      - name: Pre-seed determinate-nixd config with GC disabled
        run: |
          sudo mkdir -p /etc/determinate 2>/dev/null || mkdir -p /etc/determinate
          echo '{"garbageCollector":{"strategy":"disabled"}}' > /tmp/determinate-config.json
          sudo cp /tmp/determinate-config.json /etc/determinate/config.json 2>/dev/null \
            || cp /tmp/determinate-config.json /etc/determinate/config.json
      - uses: https://github.com/DeterminateSystems/nix-installer-action@v22
      # See the nix-eval job for the full rationale: no systemd, and a
      # single SIGTERM pkill didn't stick either — SIGKILL in a loop, verified.
      - name: Stop determinate-nixd (nix-src#395 race)
        run: |
          df -h /nix
          echo "--- config.json after install ---"
          cat /etc/determinate/config.json 2>&1 || echo "(missing)"
          echo "--- re-applying GC-disabled config in case the installer reset it ---"
          sudo cp /tmp/determinate-config.json /etc/determinate/config.json 2>/dev/null \
            || cp /tmp/determinate-config.json /etc/determinate/config.json
          cat /etc/determinate/config.json
          echo "--- SIGKILL retry loop, verified ---"
          for attempt in 1 2 3 4 5; do
            if ! pgrep -f 'determinate-nixd daemon' >/dev/null; then
              echo "determinate-nixd confirmed down after $((attempt - 1)) SIGKILL attempts"
              break
            fi
            pgrep -a -f 'determinate-nixd daemon'
            sudo pkill -9 -f 'determinate-nixd daemon' 2>&1 || true
            sleep 2
          done
          pgrep -a -f 'determinate-nixd daemon' && echo "::warning::determinate-nixd survived 5 SIGKILL attempts — likely a different pid namespace" || echo "determinate-nixd is confirmed down"
      # --option system-features is still needed: even with /dev/kvm present,
      # Nix won't schedule nixos-test derivations unless kvm/nixos-test are
      # declared on the (per-invocation) system-features.
      - run: |
          nix build -L ".#checks.x86_64-linux.${{ matrix.check }}" \
            --option system-features "nixos-test benchmark big-parallel kvm"
      # result/ holds the test driver output incl. the serial log; on a build
      # failure it doesn't exist, so also grab the derivation's build log.
      - if: always()
        run: |
          mkdir -p test-logs
          cp -rL result/* test-logs/ 2>/dev/null || true
          nix log ".#checks.x86_64-linux.${{ matrix.check }}" > test-logs/build.log 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.check }}
          path: test-logs/
