# Codeberg CI — Forgejo Actions (GitHub-Actions-compatible syntax).
#
# Runner: the hosted codeberg-medium runner (4 vCPU / 8 GB, and on these
# runners filesystem writes count against RAM, with 2 GB of temp on top). An
# earlier self-hosted runner (medium@actions-tiny.aburayama.m.codeberg.org,
# chosen for its /dev/kvm and no time cap) was retired in 4b7528c — the lanes
# all target the hosted label now. Consequence: no persistent Nix store between
# runs; every job installs Nix fresh.
#
# The Nix bootstrap that used to be pasted into every Nix job lives in
# .forgejo/actions/setup-nix now. It is a local composite action, so every job
# that uses it MUST run actions/checkout first — Forgejo resolves `uses: ./…`
# out of the checked-out tree. Read that file before touching cache or daemon
# behaviour; it carries the reasoning for both.
#
# Lanes:
#   lint    (every push + PR)  flake eval + cheap checks; cargo fmt/clippy/test.
#   vm      (weekly + manual)  the two LiveISO boot oracles (tests/default.nix).
#   release (v* tags)          build the ISO, publish it, cut a release.
#
# Releases do NOT attach the ISO to Codeberg. Codeberg asks that a repository
# stay under "1.5 GiB of packages, LFS and attachments", and one ISO is that
# whole allowance — so the image goes to buzzheavier plus Forgejo's generic
# package registry, and the release body carries both links. Only the ~100-byte
# .sha256 is attached here, which costs nothing and keeps `sha256sum -c`
# working even after off-forge download links lapse.
#
# That link DOES lapse: buzzheavier's free tier keeps a file for 8 days, plus
# 2 days per download, and only makes it permanent after 30 downloads in 60
# days. .forgejo/workflows/refresh.yml re-uploads the newest release's ISO
# twice a week to keep its link alive. If you delete that workflow, every
# published download link dies within about a week.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # ~03:57 UTC Mondays (off the :00 mark; see Justfile ethos)
    - cron: "57 3 * * 1"
  workflow_dispatch:

env:
  # Not secret: a directory id is meaningless without the account token, and
  # the region id is public (GET /api/locations).
  BUZZ_PARENT_ID: ${{ vars.BUZZ_PARENT_ID }}
  BUZZ_LOCATION_ID: ${{ vars.BUZZ_LOCATION_ID }}

jobs:
  nix-eval:
    name: "nix: flake check + cheap checks"
    runs-on: codeberg-medium
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-nix
        with:
          # PR runs never carry the secret in the first place — Forgejo does
          # not pass secrets to a fork's PR run at all — so there is nothing
          # there for the push side to do, and nothing to assert.
          push: ${{ github.event_name != 'pull_request' }}
          cachix-token: ${{ secrets.CACHIX_KEY }}
      # Diagnostic only, not a fix: confirmed 2026-08-24 that killing
      # determinate-nixd (see setup-nix, verified dead before flake check even
      # starts) does NOT stop the "aipage-944064e.drv is not valid" failure —
      # same error, every run, dead daemon or not. That rules out the GC race
      # entirely. `nix flake check`'s cascading failure output swallows the real
      # underlying error for whatever breaks first, so build the one
      # IFD-requiring package flake check needs mid-eval in isolation here, with
      # full logs, before flake check's own noisier failure.
      #
      # This also gates the release lane: nix/packages/aipage.nix:242 reads a
      # manifest out of a fetchgit derivation, and flake/lib.nix puts the aipage
      # dists in isoImage.storeContents for BOTH ISOs, so evaluating .#iso goes
      # through the same import-from-derivation. If this is red, releases are
      # red for the same reason.
      - name: Diagnose the aipage fetch in isolation (not a fix)
        run: |
          echo "--- can this runner reach codeberg.org at all? ---"
          time git ls-remote https://codeberg.org/dasmatus/aipage.git HEAD || echo "[ls-remote failed, see above]"
          echo "--- building .#aipage-firefox alone, full logs ---"
          nix build -L --no-link .#aipage-firefox || echo "[isolated aipage build failed, see above — this is the real error]"
      # Evaluates every output incl. both VM test derivations; builds nothing.
      - run: nix flake check --no-build -L
      # The cheap non-VM checks are worth actually building. Build ALL the eval
      # checks declared in flake/checks.nix so a silent regression in
      # fido-2fa / aipage / formfactor doesn't slip past CI (nix flake check
      # --no-build above only evaluates them, it doesn't build the asserts).
      - run: |
          nix build -L \
            .#checks.x86_64-linux.settings-eval \
            .#checks.x86_64-linux.facter-stub-eval \
            .#checks.x86_64-linux.facter-nvidia-eval \
            .#checks.x86_64-linux.fido-2fa-eval \
            .#checks.x86_64-linux.aipage-eval \
            .#checks.x86_64-linux.formfactor-eval

  rust:
    name: "rust: fmt + clippy + test"
    runs-on: codeberg-medium
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain on the runner host (replaces the rust:1.97 container;
      # no Docker needed). This lane never touches Nix, so it does not use
      # setup-nix and never sees the Cachix config.
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      # Swatinem/rust-cache supports a comma-separated list of workspace roots
      # (Cargo.toml dirs); only installer-tui needs one here.
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: rust/installer-tui
      # Lint the Rust crate — matches `nix run .#nix-lint` (flake/apps.nix).
      - run: |
          cd rust/installer-tui
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  vm-boot:
    name: "vm: ${{ matrix.check }}"
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: codeberg-medium
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        check: [iso-boot, limine-install-boot, session-boot]
    steps:
      - uses: actions/checkout@v4
      # This job realises the same IFD drvs as nix-eval plus a far larger
      # closure, so its exposure to everything setup-nix guards against is
      # worse, not better.
      - uses: ./.forgejo/actions/setup-nix
        with:
          push: ${{ github.event_name != 'pull_request' }}
          cachix-token: ${{ secrets.CACHIX_KEY }}
      # --option system-features is still needed: even with /dev/kvm present,
      # Nix won't schedule nixos-test derivations unless kvm/nixos-test are
      # declared on the (per-invocation) system-features.
      - run: |
          nix build -L ".#checks.x86_64-linux.${{ matrix.check }}" \
            --option system-features "nixos-test benchmark big-parallel kvm"
      # result/ holds the test driver output incl. the serial log; on a build
      # failure it doesn't exist, so also grab the derivation's build log.
      - if: always()
        run: |
          mkdir -p test-logs
          cp -rL result/* test-logs/ 2>/dev/null || true
          nix log ".#checks.x86_64-linux.${{ matrix.check }}" > test-logs/build.log 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.check }}
          path: test-logs/

  release:
    name: "release: build and publish the ISO"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: codeberg-medium
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # push: true — the refresh workflow substitutes this ISO from the cache
      # instead of rebuilding it, which only works if the tag build put it
      # there. Do not set this to false to "save a push"; it breaks refresh.
      - uses: ./.forgejo/actions/setup-nix
        with:
          push: "true"
          cachix-token: ${{ secrets.CACHIX_KEY }}
      # The composite actions below speak the buzzheavier and Forgejo APIs with
      # curl and jq. The hosted runner is not guaranteed to ship jq, and this
      # lane has Nix by now, so make sure rather than hope.
      - name: Ensure curl and jq
        run: |
          command -v jq   >/dev/null || nix profile install nixpkgs#jq
          command -v curl >/dev/null || nix profile install nixpkgs#curl
          jq --version; curl --version | head -1
      - name: Assert the buzzheavier credentials are present
        env:
          TOKEN: ${{ secrets.BUZZHEAVIER_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::BUZZHEAVIER_TOKEN is unset — the ISO would have nowhere to go"
            exit 1
          }
          test -n "$BUZZ_PARENT_ID" || {
            echo "::error::BUZZ_PARENT_ID is unset — set it under Settings -> Actions -> Variables"
            exit 1
          }
      # UNMEASURED. nix/system/iso.nix:39 sets squashfsCompression to
      # "xz -Xdict-size 100%", which is deliberately slow, and no timing for
      # this build has ever been recorded. losos builds its ISO in 3.5 min but
      # uses zstd, so that figure does NOT transfer. Record the real duration
      # here once a tag has run, and if it does not fit the runner's budget,
      # switch this to `--max-jobs 0` (substitute-only, fails instead of
      # building) and `cachix push` locally before tagging.
      - name: Build the LiveISO
        run: nix build -L .#packages.x86_64-linux.iso -o result-iso
      # cp -L dereferences: result-iso is a symlink into /nix/store. The name
      # has to come from the tag, because nix/system/iso.nix:38 mkForce's
      # image.baseName to a constant — .#iso and .#iso-full emit the identical
      # filename, with no version in it.
      - name: Stage the image
        id: stage
        run: |
          set -euo pipefail
          name="tokyonight-dots-installer-${GITHUB_REF_NAME}.iso"
          cp -L result-iso/iso/*.iso "./${name}"
          sha256sum "$name" | tee "${name}.sha256"
          {
            echo "name=${name}"
            echo "storePath=$(readlink -f result-iso)"
          } >> "$GITHUB_OUTPUT"
      - id: publish
        uses: ./.forgejo/actions/publish-buzz
        with:
          file: ${{ steps.stage.outputs.name }}
          filename: ${{ steps.stage.outputs.name }}
          parent-id: ${{ env.BUZZ_PARENT_ID }}
          location-id: ${{ env.BUZZ_LOCATION_ID }}
          token: ${{ secrets.BUZZHEAVIER_TOKEN }}
      - id: publish-generic
        uses: ./.forgejo/actions/publish-generic
        with:
          file: ${{ steps.stage.outputs.name }}
          owner: ${{ github.repository_owner }}
          package: tokyonight-dots-installer
          version: ${{ github.ref_name }}
          filename: ${{ steps.stage.outputs.name }}
          token: ${{ secrets.FORGEJO_TOKEN }}
          token-alt: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose the release body
        id: body
        env:
          ISO_NAME: ${{ steps.stage.outputs.name }}
          ISO_URL: ${{ steps.publish.outputs.url }}
          ISO_URL_GENERIC: ${{ steps.publish-generic.outputs.url }}
          ISO_SUM: ${{ steps.publish.outputs.sha256 }}
          ISO_SIZE: ${{ steps.publish.outputs.size }}
          STORE_PATH: ${{ steps.stage.outputs.storePath }}
        run: |
          set -euo pipefail
          human=$(awk -v b="$ISO_SIZE" 'BEGIN { printf "%.2f GiB", b/1073741824 }')
          # refresh.yml reads this back to re-upload the same bytes without
          # evaluating the flake. Keep the field names stable: changing one
          # silently breaks the refresh for every release already published.
          jq -n --arg iso "$ISO_NAME" --arg sum "$ISO_SUM" \
                --argjson size "$ISO_SIZE" --arg path "$STORE_PATH" \
                --arg generic "$ISO_URL_GENERIC" \
            '{iso:$iso, sha256:$sum, size:$size, storePath:$path, genericUrl:$generic}' > release.json
          cat release.json
          {
            echo "### ISO links"
            echo ""
            echo "- buzzheavier: ${ISO_URL}"
            echo "- Forgejo generic registry: ${ISO_URL_GENERIC}"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<RELEASE_BODY_EOF"
            cat <<BODY
          ### Download
          
          **[${ISO_NAME}](${ISO_URL})** — ${human}
          
          **[${ISO_NAME} (Forgejo generic registry)](${ISO_URL_GENERIC})**

          \`\`\`
          sha256  ${ISO_SUM}
          \`\`\`

          Verify against the \`.sha256\` attached below:

          \`\`\`sh
          sha256sum -c ${ISO_NAME}.sha256
          \`\`\`

          Write it to a USB stick and boot the target machine; the installer
          starts on tty1. The image is plain and unsigned, so it boots via
          firmware defaults with no Secure Boot enrolment.

          ---

          The download is hosted off-forge, because one ISO is Codeberg's entire
          recommended allowance for packages, LFS and attachments. That link is
          refreshed automatically and may still lapse — if it has, \`nix run .#iso\`
          builds the same image from this tag.
          BODY
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.forgejo/actions/forgejo-release
        with:
          tag: ${{ github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          assets: |
            ${{ steps.stage.outputs.name }}.sha256
            release.json
          token: ${{ secrets.FORGEJO_TOKEN }}
          token-alt: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.forgejo/actions/prune-buzz
        with:
          parent-id: ${{ env.BUZZ_PARENT_ID }}
          prefix: tokyonight-dots-installer-
          keep: "5"
          keep-id: ${{ steps.publish.outputs.id }}
          token: ${{ secrets.BUZZHEAVIER_TOKEN }}
