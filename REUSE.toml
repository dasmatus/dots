# REUSE 3.3 licensing manifest (https://reuse.software).
#
# One file instead of a header in every source file: this repo is mostly Nix
# and Rust with dense top-of-file documentation, and a copyright banner above
# each of those would bury the part that actually explains the module.
#
# Annotations are matched most-specific-last. A later block carrying
# `precedence = "override"` beats the repo-wide default above it. Check with
# `reuse lint`.
version = 1
SPDX-PackageName = "dots"
SPDX-PackageDownloadLocation = "https://codeberg.org/dasmatus/dots"

# Everything in the repo, unless a block below overrides it.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Matus Mastena"
SPDX-License-Identifier = "AGPL-3.0-only"

# The bemenu patch series is a derivative work of bemenu and cannot be
# relicensed. Every hunk lands in bemenu's `lib/`, which upstream ships under
# LICENSE-LIB (LGPL-3.0); its `client/` is GPL-3.0 and is not patched here.
[[annotations]]
path = "nix/patches/beamenu/**"
precedence = "override"
SPDX-FileCopyrightText = "Jari Vetoniemi and the bemenu contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# ChromaLeon patch. A derivative of upstream's extension.js/themeUtils.js, so
# it carries their licence and not this repo's; every ChromaLeon source header
# says GPL-3.0-or-later, which the bare GPLv3 LICENSE file does not narrow.
[[annotations]]
path = "nix/patches/chromaleon/**"
precedence = "override"
SPDX-FileCopyrightText = "Fabiano Junior Lima Barbosa and the ChromaLeon contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Wallpapers downloaded from wallhaven. Their terms are set by whoever made
# each image, so claiming any licence over them here would be wrong; this
# records that the terms are not established rather than pretending they are.
[[annotations]]
path = "Wallpapers/**"
precedence = "override"
SPDX-FileCopyrightText = "the respective image authors"
SPDX-License-Identifier = "LicenseRef-wallhaven-unknown"

# Generated lockfiles and hardware reports: facts about the build, not
# authored work, so they are dedicated to the public domain rather than
# carrying a copyleft that would be meaningless on them.
[[annotations]]
path = [
  "flake.lock",
  "nix/data/facter.json",
  "rust/*/Cargo.lock",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# secureblue's kernel-module blacklist (reference/secureblue-modprobe.conf in
# this project's SDD notes — see docs/superpowers/specs/2026-09-08-
# hardening-design.md, "Phase C"), ported with its structure and grouping
# intact rather than independently selected. Carries secureblue's own
# license, not this repo's default.
[[annotations]]
path = "nix/data/module-blacklist.nix"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2025-2026 The Secureblue Authors"
SPDX-License-Identifier = "Apache-2.0"

# secureblue's legacy-framebuffer blacklist (reference/secureblue-
# framebuffer.conf), itself a derivative of Ubuntu's kmod package
# blacklist-framebuffer.conf — see that file's own "Upstream:" pointer.
# Kept out of module-blacklist.nix above because it carries a DIFFERENT
# license and a multi-party copyright list, not just secureblue's.
[[annotations]]
path = "nix/data/framebuffer-blacklist.nix"
precedence = "override"
SPDX-FileCopyrightText = [
  "(C) 2011-2013  ProFUSION embedded systems",
  "(C) 2013-2016  Intel Corporation. All rights reserved.",
  "(C) 2012  Lucas De Marchi <lucas.de.marchi@gmail.com>",
  "(C) 2019  Alexey Gladkov <gladkov.alexey@gmail.com>",
  "(C) 2012  Pedro Pedruzzi",
  "(C) 2013 Michal Marek, SUSE",
  "Copyright 2025-2026 The Secureblue Authors",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"
