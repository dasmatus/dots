[package]
name = "dots-snip"
version = "0.1.0"
edition = "2021"
description = "Snipping Tool-style screenshot overlay for Hyprland, backed by grim"
license = "MIT"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tauri-build = "2"

[profile.release]
lto = true
strip = true