# steps.yaml — afosi (agent-first-os-installer) config for tokyonight-dots
#
# STRUCTURE is generated from the Rust types — regenerate with
#   installer emit-cfg
# and then edit only the VALUES here. Consumed by install.sh, which builds the
# `installer` binary in the live env and runs:  installer .steps.yaml < /dev/tty
#
# The Steps ask the install-time questions; the final Action re-enters
# install.sh with every answer exported as an environment variable (plus
# AFOSI_DRIVEN=1 so it skips the bootstrap and runs the real install).

variables: {}

steps:
  - !NoCon
    value:
      name: disk
      description: "Target disk selection"
      forms:
        - !Input
          prompt: "Target disk to ERASE and install onto (e.g. /dev/nvme0n1 or /dev/sda)"
          password: false

  - !NoCon
    value:
      name: wipe_confirm
      description: "Destructive-action confirmation"
      forms:
        - !YesNo
          prompt: "ALL DATA on {{disk}} will be permanently erased. Continue?"

  - !NoCon
    value:
      name: hostname
      description: "Machine identity"
      forms:
        - !Input
          prompt: "Hostname"
          password: false

  - !NoCon
    value:
      name: root_password
      description: "Root account password"
      forms:
        - !Input
          prompt: "Root password"
          password: true

actions:
  - description: "Run the Gentoo installer with the collected answers"
    command: "bash /root/install.sh"
    variables:
      AFOSI_DRIVEN: "1"
    parallel: false
