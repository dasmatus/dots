# Weekly lockfile refresh: `nix flake update` plus `cargo update` in every
# crate, opened (or updated) as one pull request on bot/lockfile-updates.
#
# Dependabot (.github/dependabot.yml) already bumps Cargo manifests and the
# workflow actions, but it has no Nix ecosystem, so flake.lock only moved when
# someone ran the update by hand. This is that run, on a schedule.
#
# What it does NOT move, on purpose:
#   - the kernel source pin in nix/modules/system/kernel.nix, which that file
#     says is bumped by a human and is invisible to `nix flake update`;
#   - the aipage rev (nix/packages/aipage.nix), which needs
#     scripts/update-aipage.sh and its bun2nix regeneration.
#
# The pull request is pushed with LOCKFILE_UPDATE_TOKEN when that secret
# exists (a fine-grained token with contents and pull-requests write), because
# GitHub runs no workflow for a push or pull request made with the job's own
# GITHUB_TOKEN, and a lockfile bump nobody checked is the point of CI. Without
# the secret it falls back to GITHUB_TOKEN, which needs "Allow GitHub Actions
# to create and approve pull requests" (Settings -> Actions -> General), and
# the pull request's checks then have to be started by hand.
name: lockfile-updates

on:
  schedule:
    # ~04:17 UTC Mondays, off the hour and before Dependabot's Monday run.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: lockfile-updates
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "bot: weekly lockfile refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Passes the job's token to Nix as a github.com access token, so the
      # flake update is not held to the anonymous API rate limit.
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: nix flake update
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee flake-update.log

      - name: cargo update
        run: |
          set -euo pipefail
          for crate in rust/installer-tui rust/settings-global rust/dots-secreport; do
            (cd "$crate" && cargo update 2>&1 | tee -a ../../cargo-update.log)
          done

      # The same gate as ci.yml's nix-eval job, cut to what a lock bump can
      # break at eval time: a removed or renamed package or option (a kernel
      # branch going EOL is the usual one). It does not block the pull
      # request; it puts the error in its body so the reviewer starts there.
      - name: Evaluate the updated flake
        id: eval
        run: |
          set -uo pipefail
          {
            nix build .#quickshell-config --no-link &&
            nix build .#aipage-firefox.aipageSrc --no-link &&
            nix flake check --no-build
          } > eval.log 2>&1
          status=$?
          tail -n 40 eval.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Compose the pull request body
        env:
          EVAL_STATUS: ${{ steps.eval.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "## Summary"
            echo
            echo "Weekly refresh of \`flake.lock\` and the Cargo lockfiles of \`rust/installer-tui\`,"
            echo "\`rust/settings-global\` and \`rust/dots-secreport\`."
            echo
            if [ "$EVAL_STATUS" = 0 ]; then
              echo "\`nix flake check --no-build\` passed on the updated lock."
            else
              echo "> [!WARNING]"
              echo "> \`nix flake check --no-build\` FAILED on the updated lock. The end of its output:"
              echo
              echo '```'
              tail -n 40 eval.log
              echo '```'
            fi
            echo
            echo "## flake inputs"
            echo
            echo '```'
            grep -E "^(•|  ')" flake-update.log || echo "(no flake input moved)"
            echo '```'
            echo
            echo "## Cargo"
            echo
            echo '```'
            grep -E "^ +(Updating|Adding|Removing|Downgrading) " cargo-update.log | grep -v "crates.io index" || echo "(no crate moved)"
            echo '```'
          } > pr-body.md
          rm -f flake-update.log cargo-update.log eval.log

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.LOCKFILE_UPDATE_TOKEN || github.token }}
          branch: bot/lockfile-updates
          delete-branch: true
          add-paths: |
            flake.lock
            rust/*/Cargo.lock
          commit-message: "chore(deps): weekly lockfile updates"
          title: "chore(deps): weekly lockfile updates"
          body-path: pr-body.md
          labels: dependencies
