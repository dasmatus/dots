[package]
name = "beamenu-canvas"
version = "0.1.0"
edition = "2021"
description = "WebKitGTK sidecar that renders beamenu plugin views under one host-enforced design system"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# webkit6's generated bindings reference gtk4::Accessible unconditionally,
# but gtk4-rs gates that type behind "v4_10" (GTK 4.10, released 2023) —
# without it Cargo builds a gtk4 that doesn't export the type webkit6 needs.
gtk4 = { version = "0.11", features = ["v4_10"] }
webkit6 = "0.6"
gtk4-layer-shell = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
