[package]
name = "ask-daemon"
version = "0.1.0"
edition = "2021"
description = "dots-ask: the AI side pane daemon behind the Quickshell ask pane"
license = "AGPL-3.0-only"

[[bin]]
name = "dots-ask"
path = "src/main.rs"

[lib]
name = "ask_daemon"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "sync",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
