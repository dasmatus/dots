[package]
name = "beamenu-calc"
version = "0.1.0"
edition = "2021"
description = "Scientific calculator plugin worker for the beamenu launcher"
license = "AGPL-3.0-only"

[lib]
name = "beamenu_calc"
path = "src/lib.rs"

[[bin]]
name = "beamenu-calc"
path = "src/main.rs"

[dependencies]
evalexpr = { version = "13", default-features = false }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
