<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Wallpapers</title>
  <defs>
    <!-- Keeps the scene inside the frame's inner edge rather than relying on
         the path happening to stop there. -->
