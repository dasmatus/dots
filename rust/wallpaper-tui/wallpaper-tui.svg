      <rect x="6.75" y="9.75" width="34.5" height="26.5" rx="2"/>
    </clipPath>
  </defs>
  <rect x="5.5" y="8.5" width="37" height="29" rx="3" fill="#1f2335" stroke="#7aa2f7" stroke-width="2.5"/>
  <g clip-path="url(#frame)">
    <circle cx="33" cy="17" r="3.5" fill="#e0af68"/>
    <path d="M4 38 L17 21 L24 29.5 L29 23.5 L44 38 Z" fill="#9ece6a"/>
    <path d="M24 38 L33 26 L44 38 Z" fill="#7dcfff" opacity="0.55"/>
  </g>
</svg>
