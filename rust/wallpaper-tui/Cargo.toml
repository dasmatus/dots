[package]
name = "wallpaper-tui"
version = "0.1.0"
edition = "2021"
description = "awww-based TUI wallpaper changer with wallpaper-derived accent tinting"
license = "MIT"

[dependencies]
abstracttui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = "0.25"
regex = "1"
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true