[package]
name = "dots-memory-mcp"
version = "0.1.0"
edition = "2021"
description = "stateless stdio MCP server over the agentmem Postgres schema"
license = "AGPL-3.0-only"

[[bin]]
name = "dots-memory-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-std"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
