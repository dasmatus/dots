[package]
name = "pg_agentmem"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
# Test code lives under tests/ (per repo convention) and is spliced into the
# extension crate itself via `include!` from src/lib.rs, because a pgrx
# #[pg_test] function must be compiled into the same cdylib that carries
# pg_module_magic! to become a callable SQL entity. Cargo's own integration
# test auto-discovery is turned off so those files are not also built as
# separate (and non-functional, outside the extension) test binaries.
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.18.1"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
pgrx-tests = "=0.18.1"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
