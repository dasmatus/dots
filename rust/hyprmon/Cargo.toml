[package]
name = "hyprmon"
version = "0.1.0"
edition = "2021"
description = "declarative multi-monitor auto-detection + setup for Hyprland"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
abstracttui = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true