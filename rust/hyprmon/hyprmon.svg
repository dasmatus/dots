<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Monitors</title>
  <!-- Secondary output, set back and dimmed: the one hyprmon arranges around
       the primary. Drawn first so the primary overlaps it. -->
  <rect x="26.5" y="13" width="18" height="13.5" rx="2" fill="#1f2335" stroke="#565f89" stroke-width="2"/>
  <path d="M35.5 26.5v4M31 30.5h9" fill="none" stroke="#565f89" stroke-width="2" stroke-linecap="round"/>
  <!-- Primary output, in front and accented. -->
  <rect x="3" y="8.5" width="26" height="19" rx="2.5" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2.5"/>
  <path d="M16 27.5v6M10 33.5h12" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round"/>
</svg>
