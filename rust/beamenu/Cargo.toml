[package]
name = "beamenu"
version = "0.1.0"
edition = "2021"
description = "Raycast-style launcher for Wayland, driving a patched bemenu as its view layer"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
beamenu-status = { path = "../beamenu-status" }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
