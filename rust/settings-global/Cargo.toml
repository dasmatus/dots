[package]
authors = ["Matus Mastena <Shadiness9530@proton.me>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "global-settings"
description = "Interactive editor for the installer-written dots settings.nix"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The privilege step (pkexec) is still a spawned subprocess, std-only. `serve`
# speaks JSON-RPC 2.0 to the beamenu-canvas sidecar, which is itself
# serde_json-based (rust/beamenu-canvas); hand-rolling framing/escaping here
# risks silently diverging from that encoder, so this crate matches the rest
# of the repo (rust/beamenu) and depends on serde/serde_json instead.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
